.biz-ctx-edit-area{width:100%;margin-top:8px;padding:8px 10px;font-size:15px;font-family:var(--font);border:1px solid var(--lavender);border-radius:8px;line-height:1.6;resize:vertical;min-height:80px;outline:none;color:var(--text);box-sizing:border-box;}
.biz-ctx-edit-area:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--mauve);}
.biz-ctx-edit-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;}
.biz-ctx-nl-bar{background:#fff;border:1px solid var(--border);border-radius:12px;padding:4px 4px 4px 16px;display:flex;align-items:center;gap:8px;transition:border-color .15s;}
.biz-ctx-nl-bar:focus-within{border-color:var(--lavender);box-shadow:0 0 0 3px var(--mauve);}
.biz-ctx-nl-inp{flex:1;border:none;outline:none;font-size:15px;font-family:var(--font);color:var(--text);background:transparent;padding:8px 0;}
.biz-ctx-nl-inp::placeholder{color:#aaa;}
.biz-ctx-nl-send{width:34px;height:34px;border-radius:50%;background:var(--purple);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.biz-ctx-nl-send:hover{background:#6309d4;}
.biz-ctx-nl-send svg{width:14px;height:14px;fill:#fff;}
.biz-ctx-nl-hint{font-size:13px;color:var(--muted);margin-top:8px;text-align:center;}
.biz-ctx-thinking{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--purple);padding:10px 14px;background:var(--mauve);border-radius:8px;margin-bottom:10px;}
/* ─── Preferences section (Figma) ─── */
.pref-section{background:#fff;border-radius:12px;padding:20px;margin-bottom:28px;}
.pref-master{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:16px;}
.pref-master-left{flex:1;}
.pref-master-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px;}
.pref-master-desc{font-size:16px;color:var(--muted);line-height:1.55;max-width:640px;}
.pref-master-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px;}
.pref-tog-label{font-size:15px;color:var(--muted);}
.pref-tog-label.on{color:var(--text);font-weight:500;}
.pref-divider{border:none;border-top:1px solid var(--border);margin:0 0 20px;}
.pref-sub-rows{display:flex;flex-direction:column;gap:20px;}
.pref-sub-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
.pref-sub-row.dim{opacity:.4;pointer-events:none;}
.pref-sub-left{flex:1;max-width:640px;}
.pref-sub-name{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500;color:var(--text);margin-bottom:3px;}
.pref-new-badge{font-size:13px;font-weight:500;background:#c5fbdf;color:#006629;padding:2px 8px;border-radius:10px;}
.pref-help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:12px;font-weight:700;cursor:help;flex-shrink:0;}
.pref-sub-desc{font-size:15px;color:var(--muted);line-height:1.5;}
.pref-sub-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px;}
.pref-footer{display:flex;justify-content:flex-end;padding-top:20px;border-top:1px solid var(--border);margin-top:24px;}

/* ─── AI Settings layout (Figma) ─── */
.stg-ai-layout{display:grid;grid-template-columns:229px minmax(0,1fr);gap:54px;align-items:start;}
.stg-ai-nav{background:#fff;border-radius:10px;padding:14px 10px;position:sticky;top:16px;}
.stg-ai-nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;border-radius:4px;background:transparent;font-family:var(--font);font-size:16px;font-weight:500;color:var(--text);cursor:pointer;text-align:left;}
.stg-ai-nav-item:hover{background:var(--stone20);}
.stg-ai-nav-item.act{background:var(--brand-subtle);color:var(--purple);position:relative;}
.stg-ai-nav-item.act::before{content:'';position:absolute;left:-16px;top:0;bottom:0;width:6px;background:var(--purple);border-radius:0 4px 4px 0;}
.stg-ai-nav-ico{width:18px;text-align:center;flex-shrink:0;font-size:16px;line-height:1;}
.stg-ai-nav-label{flex:1;}
.stg-ai-nav-chev{color:var(--muted);font-size:14px;}
.stg-ai-main{min-width:0;}
.stg-ai-crumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.stg-ai-back{width:34px;height:34px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--text);cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stg-ai-back:hover{background:var(--stone20);}
.stg-ai-crumb-link{border:none;background:none;padding:0;font-family:var(--font);font-size:20px;font-weight:600;color:var(--muted);cursor:pointer;line-height:1.2;}
.stg-ai-crumb-link:hover{color:var(--purple);}
.stg-ai-crumb-sep{font-size:20px;color:var(--muted);line-height:1;}
.stg-ai-crumb-cur{font-size:20px;font-weight:700;color:var(--purple);line-height:1.2;}
.stg-ai-section{margin-bottom:28px;}
.stg-ai-section-hd{font-size:20px;font-weight:700;color:var(--text);margin:0 0 4px;line-height:1.2;}
.stg-ai-section-sub{font-size:16px;color:var(--muted);line-height:1.55;margin:0 0 16px;max-width:760px;}
.stg-ai-card{background:#fff;border-radius:10px;padding:20px;border:1px solid transparent;}
.stg-ai-card-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.stg-ai-card-left{display:flex;gap:10px;flex:1;min-width:0;}
.stg-ai-card-ico{width:18px;padding-top:2px;color:var(--muted);flex-shrink:0;}
.stg-ai-card-title{font-size:16px;font-weight:600;color:var(--text);margin:0 0 4px;}
.stg-ai-card-desc{font-size:16px;color:var(--muted);line-height:1.55;margin:0;max-width:640px;}
.stg-ai-card-foot{margin-top:10px;font-size:16px;color:var(--muted);line-height:1.5;}
.stg-ai-card-foot a,.stg-ai-link-btn{border:none;background:none;padding:0;color:var(--purple);text-decoration:underline;cursor:pointer;font-family:var(--font);font-size:16px;}
.stg-ai-link-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;background:#fff;border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s;border:1px solid transparent;}
.stg-ai-link-row:hover{background:var(--stone20);}
.stg-ai-link-row+.stg-ai-link-row{margin-top:8px;}
.stg-ai-link-left{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0;}
.stg-ai-link-ico{width:36px;height:36px;border-radius:8px;background:var(--stone20);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.stg-ai-link-title{font-size:16px;font-weight:600;color:var(--text);margin:0 0 3px;}
.stg-ai-link-desc{font-size:15px;color:var(--muted);line-height:1.45;margin:0;}
.stg-ai-link-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.stg-ai-status-pill{font-size:14px;font-weight:600;padding:3px 10px;border-radius:9999px;background:var(--success-bg);color:var(--success);}
.stg-ai-status-pill.off{background:var(--stone20);color:var(--muted);}
.stg-ai-link-chev{color:var(--muted);font-size:18px;line-height:1;}
.stg-ai-page-title{font-size:20px;font-weight:700;color:var(--text);margin:0;}
.stg-ai-page-hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.stg-ai-updated-pill{font-size:14px;font-weight:600;padding:3px 10px;border-radius:9999px;background:var(--success-bg);color:var(--success);}
.stg-ai-summary-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:16px;}
.stg-ai-summary-sec{padding:18px 20px;border-bottom:1px solid var(--border);position:relative;}
.stg-ai-summary-sec:last-child{border-bottom:none;}
.stg-ai-summary-sec-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
.stg-ai-summary-sec-title{font-size:16px;font-weight:600;color:var(--text);margin:0;}
.stg-ai-summary-sec-more{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:4px;}
.stg-ai-summary-sec-more:hover{background:var(--stone20);color:var(--text);}
.stg-ai-summary-sec-text{font-size:16px;color:#45464a;line-height:1.65;margin:0;}
.stg-mem-filter{display:flex;align-items:center;gap:8px;margin:12px 0 16px;flex-wrap:wrap;}
.stg-mem-filter .fx-pill{min-height:32px;padding:6px 14px;font-size:16px;}
.stg-mem-toolbar{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:12px;}
.stg-mem-stack{display:flex;flex-direction:column;gap:12px;}
.stg-mem-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:19px 23px 23px;}
.stg-mem-card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px;}
.stg-mem-card-left{flex:1;min-width:0;}
.stg-mem-flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.stg-mem-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 7px;border-radius:7px;background:var(--stone20);font-size:20px;font-weight:600;color:var(--text);line-height:1.2;}
.stg-mem-chip-ico{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.stg-mem-chip-ico.is-out{color:#45464a;}
.stg-mem-chip-ico.is-in{color:var(--success);}
.stg-mem-chip-ico.is-stop{color:var(--red);}
.stg-mem-chip-ico.is-tax{color:var(--purple);}
.stg-mem-chip-ico.is-split{color:var(--muted);}
.stg-mem-flow-arrow{color:var(--muted);font-size:16px;line-height:1;padding:0 2px;}
.stg-mem-meta{font-size:14px;color:#45464a;line-height:1.2;}
.stg-mem-card-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.stg-mem-card-desc{font-size:16px;color:var(--text);line-height:1.45;margin:0;}
.stg-mem-card.inactive{opacity:.55;}
.stg-mem-card.is-open{border-color:var(--purple);box-shadow:0 0 0 1px var(--brand-subtle);}
.stg-mem-create-row{display:flex;justify-content:flex-end;margin-top:12px;}

/* ─── AI memory section ─── */
.mem-section-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:14px;letter-spacing:.01em;}
.mem-filter-row{display:flex;align-items:center;gap:6px;margin-bottom:14px;}
.mem-fc{padding:5px 14px;border:1px solid var(--border);border-radius:20px;background:#fff;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .12s;}
.mem-fc:hover{background:var(--stone20);}
.mem-fc.act{background:var(--brand-subtle);color:var(--purple);border-color:var(--purple);}
.mem-list{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.mem-entry{padding:16px 20px;border-bottom:1px solid var(--border);}
.mem-entry:last-child{border-bottom:none;}
.mem-entry.inactive{opacity:.55;}
.mem-entry-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.mem-entry-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mem-src-badge{font-size:12px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.mem-src-badge.rule{background:var(--mauve);color:var(--purple);}
.mem-src-badge.learned{background:var(--green-bg);color:var(--green);}
.mem-src-badge.rejected{background:#FDECEA;color:var(--red);}
.mem-entity{font-size:16px;font-weight:600;color:var(--text);}
.mem-action-summary{font-size:15px;color:var(--muted);}
.mem-entry-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.mem-applied{font-size:13px;color:var(--muted);white-space:nowrap;}
.mem-cond-block{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.mem-cond-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.mem-cond-label{font-size:13px;font-weight:600;color:var(--muted);width:44px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;}
.mem-pill{font-size:13px;padding:2px 8px;background:var(--stone20);border:1px solid var(--border);border-radius:4px;color:var(--text);white-space:nowrap;}
.mem-pill.rejected-val{background:#FDECEA;border-color:#fca5a5;color:var(--red);text-decoration:line-through;}
.mem-pill-op{font-size:12px;font-weight:700;padding:2px 6px;background:#fff;border:1px solid var(--border);border-radius:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.mem-entry-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.mem-edit-form{background:var(--stone20);border-radius:8px;padding:12px;margin-top:10px;}
.mem-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.mem-edit-label{font-size:13px;font-weight:600;color:var(--muted);width:64px;flex-shrink:0;text-transform:uppercase;letter-spacing:.03em;}
.mem-edit-inp{flex:1;padding:6px 9px;border:1px solid var(--border);border-radius:var(--r4);font-size:14px;font-family:var(--font);outline:none;background:#fff;}
.mem-edit-inp:focus{border-color:var(--lavender);}
.mem-edit-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;}
.mem-empty{text-align:center;padding:40px 20px;color:var(--muted);}
.mem-empty-icon{font-size:28px;margin-bottom:8px;}

/* ─── Action required section ─── */
.ar-section{margin-bottom:20px;}
.ar-heading{font-size:18px;font-family:var(--font-heading);font-weight:600;line-height:.95;color:var(--text);margin-bottom:12px;}
.ar-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.ar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.ar-card:hover{border-color:var(--lavender);}
.ar-card-dim{opacity:.55;cursor:default;}
.ar-card-dim:hover{border-color:var(--border);}
.ar-card-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;}
.ar-card-body{font-size:14px;color:var(--muted);line-height:1.55;}
.ar-card-cta{font-size:16px;font-weight:500;color:var(--purple);margin-top:8px;}
/* ─── Shared filter bar ─── */
.fbar2-sp,.fx-filterbar-sp{flex:1;}
/* Feelix FilterBar — single-row layout */
.fx-filterbar{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);}
/* Table shell — filter bar, pills, and table as one card */
.tx-table-shell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);overflow:hidden;}
.tx-table-shell:has(.rev-mod-wrap),.tx-table-shell:has(.rev-card){overflow:visible;}
.tx-table-shell .fx-filterbar{margin-bottom:0;border:none;border-radius:0;border-bottom:1px solid var(--border);}
.tx-table-shell .fx-pill-group{margin-bottom:0;padding:12px 16px 10px;border-bottom:1px solid var(--border);}
.tx-table-shell .rev-toolbar{margin-bottom:0;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.tx-table-shell .rev-card,.tx-table-shell>.card{border:none;border-radius:0;box-shadow:none;}
.tx-table-shell .rev-mod-wrap{border:none;border-radius:0;}
.fx-filterbar-field{display:flex;flex-direction:column;gap:4px;min-width:0;}
.fx-filterbar-field.fx-filterbar-search{flex:1 1 200px;max-width:280px;}
.fx-field-label{font-size:14px;font-weight:500;color:var(--muted);line-height:1.2;}
.fx-search-wrap{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r4);background:var(--surface);}
.fx-search-wrap:focus-within{border-color:var(--lavender);}
.fx-search-wrap svg{flex-shrink:0;color:var(--muted);}
.fx-search-wrap input{border:none;outline:none;font-size:16px;font-family:var(--font);color:var(--text);background:transparent;width:100%;min-width:0;}
.fx-search-wrap input::placeholder{color:var(--muted);}
.fx-select{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r4);background:var(--surface);font-size:16px;font-family:var(--font);color:var(--text);cursor:pointer;white-space:nowrap;min-width:120px;}
.fx-select:hover{border-color:var(--lavender);}
.fx-select-arr{font-size:12px;color:var(--muted);}
.fx-filterbar-group{display:flex;align-items:flex-end;gap:12px;}
.fx-filterbar-sep{width:1px;height:32px;background:var(--border);flex-shrink:0;align-self:flex-end;margin-bottom:2px;}
.fx-filterbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;padding-bottom:2px;}
.fx-iconbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--r4);background:var(--surface);color:var(--muted);cursor:pointer;flex-shrink:0;}
.fx-iconbtn:hover{background:var(--stone20);color:var(--text);border-color:var(--lavender);}
/* ─── Scope pills (review tab) ─── */
.scope-pill-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.scope-pill{padding:6px 12px;border:1px solid var(--border);border-radius:var(--r4);background:var(--surface);font-size:16px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .12s;}
.scope-pill:hover{background:var(--stone20);}
.scope-pill.act{background:var(--brand-subtle);color:var(--purple);border-color:var(--purple);font-weight:600;}
.scope-pill .scope-ct{font-size:13px;background:var(--brand-subtle);color:var(--purple);border-radius:var(--r4);padding:0 6px;font-weight:600;}
.scope-pill:not(.act) .scope-ct{background:var(--mauve);color:var(--purple);}
/* ─── All-tab table ─── */
.all-tbl{width:100%;border-collapse:collapse;font-size:15px;}
.all-tbl th{font-size:14px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface);text-transform:none;letter-spacing:0;}
.all-tbl th.r{text-align:right;}
.all-tbl th .sort-ico{display:inline-block;margin-left:3px;opacity:.5;font-size:12px;}
.all-tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.all-tbl tr:last-child td{border-bottom:none;}
.all-tbl tr:hover td{background:var(--stone20);cursor:pointer;}
.all-tbl tr:hover .unmatch-btn{opacity:1;pointer-events:auto;}
.unmatch-btn{opacity:0;pointer-events:none;transition:opacity .15s;padding:3px 9px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:var(--r4);color:var(--muted);cursor:pointer;font-family:var(--font);white-space:nowrap;}
.unmatch-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);}
.status-cell{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tx-ref{font-size:15px;font-weight:600;color:var(--text);}
.tx-bank{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.4;max-width:360px;}
.tx-icon{width:30px;height:30px;border-radius:8px;background:var(--mauve);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.tx-icon.green{background:var(--green-bg);}
.tax-cell{font-size:16px;line-height:1.35;color:var(--text);}
.tax-code{font-size:16px;font-weight:600;color:var(--text);}
.tax-amt{font-size:14px;font-weight:400;color:#74767b;margin-top:2px;}
.match-cell{font-size:14px;color:var(--muted);}
.match-val{font-size:15px;font-weight:500;color:var(--text);}
.match-acct{font-size:13px;color:var(--muted);margin-top:1px;}
/* Status pills */
.sp{display:inline-flex;align-items:center;border-radius:var(--r4);padding:2px 8px;font-size:14px;font-weight:500;line-height:1.4;white-space:nowrap;}
.sp.matched,.sp.coded{background:var(--success-bg);color:var(--success);}
.sp.match-found{background:var(--info-bg);color:var(--info);}
.sp.awaiting{background:var(--warning-bg);color:var(--warning);}
/* ─── Review-tab suggestion cell ─── */
.sug-cell{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;position:relative;min-width:220px;}
.sug-conf{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ai-text);font-weight:500;margin-bottom:4px;}
.sug-conf-star{font-size:12px;}
.sug-why{color:var(--purple);text-decoration:underline;cursor:pointer;font-weight:600;}
.sug-name{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:4px;}
.sug-acct{font-size:13px;color:var(--muted);margin-top:2px;}
.sug-actions{display:flex;gap:6px;margin-top:8px;}
.btn-sug-acc{padding:3px 10px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-sug-acc:hover{background:#c3e6d5;}
.btn-sug-rej{padding:3px 10px;background:var(--red-bg);color:var(--red);border:1px solid #f5a9a2;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-sug-rej:hover{background:#f7c7c3;}
.rev-chev{color:var(--muted);font-size:16px;padding:0 4px;flex-shrink:0;}

/* rule wizard */
.rwiz{max-width:560px;}
.rwiz-steps{display:flex;align-items:center;margin-bottom:28px;}
.rwiz-step{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.rwiz-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.rwiz-num.done{background:var(--green);color:#fff;}
.rwiz-num.active{background:var(--purple);color:#fff;}
.rwiz-num.idle{background:var(--stone20);color:var(--muted);border:1px solid var(--border);}
.rwiz-label{font-size:14px;font-weight:500;}
.rwiz-label.active{color:var(--text);font-weight:600;}
.rwiz-label.done{color:var(--green);}
.rwiz-label.idle{color:var(--muted);}
.rwiz-connector{flex:1;height:1px;background:var(--border);margin:0 8px;min-width:12px;}
.rwiz-connector.done{background:var(--green);}
/* step 1 type cards */
.rtype-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px;}
.rtype-card{background:#fff;border:2px solid var(--border);border-radius:var(--r8);padding:20px 14px 16px;cursor:pointer;text-align:center;transition:all .15s;}
.rtype-card:hover{border-color:var(--lavender);background:var(--mauve);}
.rtype-card.sel{border-color:var(--purple);background:var(--mauve);}
.rtype-icon{font-size:26px;margin-bottom:8px;}
.rtype-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;}
.rtype-desc{font-size:13px;color:var(--muted);line-height:1.45;}
/* step 2 conditions */
.cond-and-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
.cond-and{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;background:var(--stone20);border-radius:4px;flex-shrink:0;}
.cond-row{display:flex;align-items:center;gap:7px;background:var(--stone20);border:1px solid var(--border);border-radius:var(--r8);padding:10px 12px;}
.cond-sel{padding:5px 7px;border:1px solid var(--border);border-radius:var(--r4);font-size:14px;font-family:var(--font);background:#fff;cursor:pointer;outline:none;color:var(--text);}
.cond-sel:focus{border-color:var(--lavender);}
.cond-inp{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:var(--r4);font-size:14px;font-family:var(--font);outline:none;background:#fff;min-width:0;}
.cond-inp:focus{border-color:var(--lavender);}
.cond-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px;line-height:1;flex-shrink:0;}
.cond-del:hover{color:var(--red);}
.btn-add-cond{background:none;border:none;color:var(--purple);font-size:14px;font-weight:600;cursor:pointer;padding:8px 0 0;font-family:var(--font);display:block;}
.btn-add-cond:hover{text-decoration:underline;}
/* step 3 action */
.act-field{margin-bottom:16px;}
.act-label{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.03em;}
.act-sel,.act-inp{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r4);font-size:15px;font-family:var(--font);background:#fff;outline:none;box-sizing:border-box;}
.act-sel:focus,.act-inp:focus{border-color:var(--lavender);}
/* step 4 review */
.rwiz-summary{background:var(--stone20);border:1px solid var(--border);border-radius:var(--r8);padding:16px 18px;margin-bottom:20px;}
.rwiz-sum-row{display:flex;gap:12px;margin-bottom:8px;font-size:15px;line-height:1.45;}
.rwiz-sum-row:last-child{margin-bottom:0;}
.rwiz-sum-label{font-weight:700;color:var(--muted);width:44px;flex-shrink:0;padding-top:1px;}
.rwiz-sum-val{color:var(--text);}
.rwiz-name-input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r4);font-size:16px;font-weight:600;font-family:var(--font);outline:none;box-sizing:border-box;margin-bottom:16px;}
.rwiz-name-input:focus{border-color:var(--lavender);}
/* wizard footer */
.rwiz-footer{display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--border);margin-top:24px;}
.btn-wiz-cancel{padding:8px 16px;background:#fff;border:1px solid var(--border);border-radius:var(--r4);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font);color:var(--text);}
.btn-wiz-cancel:hover{background:var(--stone20);}
.btn-wiz-back{padding:8px 16px;background:#fff;border:1px solid var(--border);border-radius:var(--r4);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font);color:var(--purple);}
.btn-wiz-back:hover{background:var(--mauve);}
.btn-wiz-next{padding:8px 22px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-wiz-next:hover{background:#6810cc;}
.btn-wiz-next:disabled{opacity:.35;cursor:not-allowed;}
.btn-wiz-save{padding:8px 22px;background:var(--green);color:#fff;border:none;border-radius:var(--r4);font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-wiz-save:hover{background:#0a6640;}
/* settings segment tabs */
.stg-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--r8);background:#fff;padding:3px;margin-bottom:22px;width:fit-content;}
.stg-tab{padding:6px 16px;border-radius:6px;border:none;background:none;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:6px;transition:all .15s;}
.stg-tab:hover{color:var(--text);}
.stg-tab.act{color:var(--purple);font-weight:600;border-bottom:2px solid var(--purple);background:transparent;}
.stg-tab-ct{font-size:13px;padding:1px 6px;border-radius:var(--r99);background:rgba(255,255,255,.25);font-weight:700;}
.stg-tab:not(.act) .stg-tab-ct{background:var(--mauve);color:var(--purple);}
/* clear list cards */
.cl-card{background:#fff;border:1px solid var(--border);border-radius:var(--r8);padding:13px 16px;margin-bottom:9px;}
.cl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.cl-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.cl-badge{font-size:12px;font-weight:700;border-radius:var(--r99);padding:2px 8px;text-transform:uppercase;letter-spacing:.04em;}
.cl-badge-cat{background:#ede9fe;color:#5b21b6;}
.cl-badge-match{background:#e0f2fe;color:#0369a1;}
.cl-badge-scope{font-size:12px;background:var(--stone20);color:var(--muted);border-radius:var(--r99);padding:2px 8px;}
.cl-desc{font-size:16px;font-weight:600;margin-bottom:2px;}
.cl-meta{font-size:14px;color:var(--muted);line-height:1.6;}
.cl-meta span{color:var(--text);font-weight:500;}
.cl-future{margin-top:8px;padding:8px 10px;background:#fffbf0;border:1px solid #fde68a;border-radius:var(--r4);font-size:13px;color:#92400e;line-height:1.5;}
.cl-future strong{color:var(--amber);}
.cl-empty{padding:40px 24px;text-align:center;color:var(--muted);}
.cl-empty-icon{font-size:28px;margin-bottom:8px;}
.cl-empty-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;}
.cl-empty-sub{font-size:15px;line-height:1.5;}
/* settings filter bar */
.stg-filter-bar{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;padding:12px 14px;background:var(--stone20);border-radius:var(--r8);border:1px solid var(--border);}
.stg-filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.stg-filter-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;width:60px;flex-shrink:0;}
.stg-filter-sep{width:1px;height:16px;background:var(--border);margin:0 4px;flex-shrink:0;}
.stg-fc{padding:3px 11px;border-radius:var(--r99);border:1px solid var(--border);background:#fff;font-size:14px;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .12s;white-space:nowrap;}
.stg-fc:hover{border-color:var(--purple);color:var(--purple);}
.stg-fc.act{background:var(--brand-subtle);color:var(--purple);border-color:var(--purple);font-weight:600;}
/* rule meta badges */
.rule-badges{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.rb{font-size:12px;border-radius:var(--r99);padding:2px 7px;font-weight:600;white-space:nowrap;}
.rb-cat{background:#ede9fe;color:#5b21b6;}
.rb-inv{background:#e0f2fe;color:#0369a1;}
.rb-bill{background:#fef3c7;color:#92400e;}
.rb-sup{background:#f0fdf4;color:#166534;}
.rb-cus{background:#eff6ff;color:#1e40af;}
.rb-acc{background:#fdf4ff;color:#86198f;}
.rule-card{background:#fff;border:1px solid var(--border);border-radius:var(--r8);padding:13px 16px;margin-bottom:9px;}
.rule-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.rule-name{font-weight:600;font-size:16px;}
.rule-meta{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:7px;}
.rule-meta span{color:var(--text);font-weight:500;}
.rule-foot{display:flex;align-items:center;gap:8px;}
.rule-applied{font-size:13px;color:var(--muted);}
.rule-sp{flex:1;}
.btn-re{padding:4px 10px;background:#fff;color:var(--purple);border:1px solid var(--lavender);border-radius:var(--r4);font-size:14px;cursor:pointer;font-family:var(--font);}
.btn-re:hover{background:var(--mauve);}
.btn-rd{padding:4px 10px;background:#fff;color:var(--red);border:1px solid #fca5a5;border-radius:var(--r4);font-size:14px;cursor:pointer;font-family:var(--font);}
.btn-rd:hover{background:var(--red-bg);}
.tog{position:relative;width:34px;height:18px;}
.tog input{opacity:0;width:0;height:0;}
.tog-s{position:absolute;inset:0;background:#ccc;border-radius:9px;cursor:pointer;transition:.2s;}
.tog-s::before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;}
.tog input:checked+.tog-s{background:var(--purple);}
.tog input:checked+.tog-s::before{transform:translateX(16px);}
.badge-ai{font-size:13px;background:var(--ai-bg);color:var(--ai-text);border-radius:var(--r4);padding:2px 8px;font-weight:600;}
.badge-sug{font-size:13px;background:var(--warning-bg);color:var(--warning);border-radius:var(--r4);padding:2px 8px;font-weight:600;}
.stg-sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.stg-sec-title{font-size:15px;font-weight:600;}
.btn-add-rule{padding:8px 16px;background:var(--success);color:#fff;border:none;border-radius:var(--r4);font-size:16px;font-weight:500;cursor:pointer;font-family:var(--font);}

/* toast — Feelix inverse (Figma Smart Rec) */
.toast-container{position:fixed;bottom:24px;left:24px;z-index:300;display:flex;flex-direction:column-reverse;gap:12px;align-items:flex-start;pointer-events:none;}
.toast-container>*{pointer-events:auto;}
.fx-toast-inverse{background:#232428;color:#fff;border-radius:4px;min-width:200px;max-width:310px;width:max-content;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastIn .28s ease;font-family:var(--font);}
.fx-toast-inverse-row{display:flex;align-items:flex-start;gap:10px;padding:8px 8px 12px 12px;}
.fx-toast-inverse-ico{flex-shrink:0;padding-top:2px;line-height:0;}
.fx-toast-inverse-text{flex:1;margin:0;font-size:16px;line-height:20px;letter-spacing:.24px;color:#fff;font-weight:400;word-break:break-word;}
.fx-toast-inverse-link{background:none;border:none;padding:0;margin-left:6px;font-size:16px;line-height:20px;font-weight:500;color:#fff;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-family:var(--font);}
.fx-toast-inverse-link:hover{color:#e8e8ea;}
.fx-toast-inverse-close{background:none;border:none;color:#fff;opacity:.75;cursor:pointer;padding:2px;line-height:0;flex-shrink:0;border-radius:4px;}
.fx-toast-inverse-close:hover{opacity:1;background:rgba(255,255,255,.08);}
.fx-toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);padding:12px 16px;max-width:380px;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;align-items:flex-start;gap:12px;font-size:16px;line-height:1.5;animation:toastIn .28s ease;}
.toast{background:#fff;border:1px solid var(--border);border-radius:var(--r8);padding:12px 16px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;align-items:flex-start;gap:10px;font-size:15px;animation:toastIn .28s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(8px);}}
.toast.toast-out{animation:toastOut .2s ease forwards;}
.toast-icon{font-size:16px;flex-shrink:0;}
.toast-body{flex:1;}
.toast-title{font-weight:600;margin-bottom:3px;}
.toast-foot{display:flex;gap:6px;margin-top:6px;}
.btn-ty{padding:6px 12px;background:var(--success);color:#fff;border:none;border-radius:var(--r4);font-size:16px;font-weight:500;cursor:pointer;font-family:var(--font);}
.btn-tn{padding:4px 8px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:14px;cursor:pointer;font-family:var(--font);}
.toast-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}


/* ── Feelix alignment utilities ── */
.fx-label-ai{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;padding:2px 8px;border-radius:var(--r4);background:var(--ai-bg);color:var(--ai-text);}
.btn-save-stg,.btn-att-confirm,.btn-toast-yes,.btn-att-dl,.btn-wiz-next,.btn-asp-acc{background:var(--success)!important;color:#fff!important;border:none!important;}
.btn-save-stg:hover,.btn-att-confirm:hover,.btn-toast-yes:hover,.btn-att-dl:hover,.btn-wiz-next:hover,.btn-asp-acc:hover{background:var(--success-hover)!important;}
.btn-asp-dis,.btn-att-can,.btn-att-invoice,.btn-ctx-cancel,.btn-ctx-keep,.btn-rc-skip,.btn-rc-detail{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--border)!important;}
.btn-att-reassign,.btn-asave,.btn-ctx-save{background:var(--success)!important;color:#fff!important;border:none!important;}
.btn-add-line,.btn-rc-detail{color:var(--purple)!important;border-color:var(--lavender)!important;background:var(--surface)!important;}
.mem-fc.act,.mem-fc.act:hover{background:var(--brand-subtle)!important;color:var(--purple)!important;border-color:var(--purple)!important;}
.rtbl-w tbody tr.tr-upd,.rtbl-w tbody tr.tr-done{background:transparent!important;}
.all-tbl th{font-size:14px;padding:10px 12px;}
.all-tbl td{padding:12px;font-size:16px;}
.hub-title,.stg-title,.biz-ctx-title,.pref-master-title{font-size:24px;font-family:var(--font-heading);font-weight:600;line-height:.95;}

.btn-asave,.btn-asp-acc,.btn-att-dl,.btn-toast-yes,.btn-wiz-next,.btn-add-rule,.btn-ty{background:var(--success)!important;color:#fff!important;}
.btn-toast-yes:hover,.btn-wiz-next:hover{background:var(--success-hover)!important;}
.stg-tabs,.stg-tab{display:flex;gap:0;border-bottom:1px solid var(--border);}
.stg-tab{padding:12px 16px;border:none;background:none;font-family:var(--font);font-size:16px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.aside-head{padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);position:relative;}
.aside-amt{font-size:24px;font-weight:600;}
.aside-footer,.rc-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);box-shadow:0 -4px 12px rgba(0,0,0,.06);}
.mf-count{color:var(--text);}
.btn-att-reassign{background:var(--success)!important;}
.btn-att-reassign:hover{background:var(--success-hover)!important;}
.biz-ctx-nl-send,.btn-ctx-save,.btn-asave{background:var(--success)!important;}

/* review inbox — transaction-centric */
.rev-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.rev-summary-main{flex:1;min-width:200px;}
.rev-summary-title{font-size:15px;font-weight:600;margin-bottom:2px;}
.rev-summary-sub{font-size:14px;color:var(--muted);line-height:1.5;}
.rev-summary-stats{display:flex;gap:10px;flex-wrap:wrap;}
.rev-stat{font-size:14px;padding:4px 10px;border-radius:var(--r4);background:var(--stone20);color:var(--muted);}
.rev-stat strong{color:var(--text);}
.rev-stat-ready{background:var(--success-bg);color:var(--success);}
.rev-stat-changed{background:var(--warning-bg);color:var(--warning);}
.readiness-strip{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px;}
.rdim{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 6px;border-radius:var(--r4);border:1px solid transparent;white-space:nowrap;}
.rdim-ready{background:var(--success-bg);color:var(--success);border-color:var(--success-border);}
.rdim-pending{background:var(--stone20);color:var(--muted);border-color:var(--border);}
.rdim-changed{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border);}
.rdim-blocked{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border);}
.rdim-none{opacity:.35;background:var(--stone20);color:var(--muted);}
.rev-row-actions{display:flex;align-items:center;gap:6px;justify-content:flex-end;white-space:nowrap;}
.all-tbl th.agent-col-h{background:var(--brand-subtle);color:var(--purple);font-size:13px;text-transform:uppercase;letter-spacing:.04em;border-left:1px solid var(--lavender);}
.all-tbl td.agent-col{background:var(--stone20);border-left:1px solid var(--border);vertical-align:middle;padding:10px 12px!important;min-width:120px;overflow:visible;}
.all-tbl td.agent-col.agent-accepted{background:var(--success-bg);}
.all-tbl td.agent-col.agent-empty{background:var(--stone20);}
.agent-col-tag{display:inline-block;font-size:12px;font-weight:700;background:var(--purple);color:#fff;border-radius:var(--r99);padding:1px 5px;margin-left:4px;vertical-align:middle;letter-spacing:.03em;}
.rev-agent-cell{display:flex;flex-direction:column;gap:4px;min-width:0;}
.rev-agent-cell.rev-att-cell{flex-direction:row;align-items:center;gap:10px;}
.rev-agent-val{font-size:14px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;}
.rev-agent-sub{font-size:13px;color:var(--muted);line-height:1.35;overflow:hidden;text-overflow:ellipsis;}
.rev-agent-manual{font-size:13px;color:#bbb;font-style:italic;}
.rev-inline-btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r4);font-size:14px;font-weight:500;color:var(--purple);cursor:pointer;font-family:var(--font);white-space:nowrap;}
.rev-inline-btn:hover{background:var(--brand-subtle);border-color:var(--lavender);}
.rev-inline-sel{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:var(--r4);font-size:14px;font-family:var(--font);background:var(--surface);color:var(--text);cursor:pointer;}
.rev-mod-agent.rev-mod-manual{background:var(--surface);border:1px dashed var(--border);}
.rev-conf{display:inline-flex;align-items:center;gap:4px;margin-top:2px;}
.rev-conf-pct{font-size:12px;font-weight:700;cursor:help;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
.rev-att-preview{width:52px;height:60px;border-radius:6px;border:1px solid var(--border);overflow:hidden;background:#fff;flex-shrink:0;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.rev-att-preview:hover{border-color:var(--lavender);box-shadow:0 2px 6px rgba(0,0,0,.12);}
.rev-att-preview img{width:100%;height:100%;object-fit:cover;display:block;}
.rev-att-placeholder{width:52px;height:60px;border-radius:6px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:#ccc;flex-shrink:0;background:#fff;}
.rev-agent-acc{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--green);}
.btn-rev-reject{padding:5px 10px;background:var(--surface);color:var(--red);border:1px solid #fca5a5;border-radius:var(--r4);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);}
.btn-rev-reject:hover{background:#fff5f5;}
/* row exit — processing gradient then swipe left */
.all-tbl tr.tr-exiting,.rev-mod-row.tr-exiting{position:relative;z-index:3;overflow:hidden;will-change:transform,opacity;}
.all-tbl tr.tr-exiting::before,.rev-mod-row.tr-exiting::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:var(--accept-fill,0%);
  background:linear-gradient(90deg,rgba(34,197,94,.42) 0%,rgba(34,197,94,.18) 65%,transparent 100%);
  pointer-events:none;z-index:0;
}
.all-tbl tr.tr-exiting td,.rev-mod-row.tr-exiting>*{position:relative;z-index:2;}
.all-tbl tr.tr-exiting td{box-shadow:none!important;}
.all-tbl tr.tr-exiting.tr-exiting-processing td{background:var(--surface)!important;}
.all-tbl tr.tr-exiting:not(.tr-exiting-processing) td{background:linear-gradient(90deg,var(--success-bg) 0%,var(--surface) 40%)!important;}
.all-tbl tr.tr-exiting td:first-child{box-shadow:inset 3px 0 0 var(--success)!important;}
/* row reject — wipe AI suggestions in place (row stays for manual review) */
.all-tbl tr.tr-reject-wiping{position:relative;z-index:2;}
.all-tbl tr.tr-reject-wiping td:first-child{box-shadow:inset 3px 0 0 var(--red)!important;transition:box-shadow .15s;}
.all-tbl tr.tr-reject-wiping .rev-asm-cell.rev-asm-ai{position:relative;overflow:hidden;}
.all-tbl tr.tr-reject-wiping .rev-asm-cell.rev-asm-ai::after{
  content:'';position:absolute;inset:0;left:0;width:var(--reject-wipe,0%);
  background:linear-gradient(90deg,var(--surface) 0%,var(--surface) 72%,rgba(239,68,68,.12) 100%);
  z-index:4;pointer-events:none;
}
.all-tbl tr.tr-reject-wiping .rev-asm-cell.rev-asm-ai > *{position:relative;z-index:1;}
.all-tbl tr.tr-reject-wiping .rev-asm-cell.rev-asm-ai > *:not(.rev-asm-actions){
  opacity:calc(1 - var(--reject-wipe-num,0) * .92);
  transform:translateX(calc(var(--reject-wipe-num,0) * 8px));
}
.all-tbl tr.tr-reject-wiping .rev-asm-actions{
  opacity:calc(1 - min(1,var(--reject-wipe-num,0) * 2.5));
  pointer-events:none;
}
.rev-card{overflow:visible!important;}
.rev-card .all-tbl thead{position:relative;z-index:2;}
/* modern review list — Figma automatching row */
.rev-toolbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:12px;gap:8px;}
.rev-view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--r4);overflow:hidden;background:var(--surface);}
.rev-view-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;background:none;font-family:var(--font);font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;border-right:1px solid var(--border);}
.rev-view-btn:last-child{border-right:none;}
.rev-view-btn:hover{background:var(--stone20);color:var(--text);}
.rev-view-btn.act{background:var(--brand-subtle);color:var(--purple);font-weight:600;}
.rev-mod-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);overflow:visible;}
.rev-mod-head,.rev-mod-row{
  display:grid;
  grid-template-columns:32px minmax(200px,1.5fr) minmax(100px,.8fr) 72px minmax(440px,2.4fr) 24px;
  align-items:center;gap:12px;padding:10px 16px;
}
.rev-mod-wrap.show-src .rev-mod-head,
.rev-mod-wrap.show-src .rev-mod-row,
.scroll-ctx-mod-head.show-src{
  grid-template-columns:32px 44px minmax(200px,1.5fr) minmax(100px,.8fr) 72px minmax(440px,2.4fr) 24px;
}
.rev-mod-src-col,.rev-mod-src-h{display:flex;align-items:center;justify-content:center;}
.rev-mod-src-h{font-size:14px;font-weight:600;color:var(--muted);}
.rev-mod-head{font-size:16px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);padding-top:14px;padding-bottom:12px;background:var(--surface);}
.rev-mod-head .rev-mod-ai-head{display:grid;grid-template-columns:88px 1fr;gap:0;font-size:16px;font-weight:600;color:var(--text);}
.rev-mod-head .rev-mod-ai-head>div{padding-left:4px;}
.rev-mod-head .rev-mod-amt-h{text-align:right;}
.rev-mod-head .rev-mod-att-h{text-align:center;font-size:16px;font-weight:600;color:var(--muted);}
.rev-mod-att-col{display:flex;align-items:center;justify-content:center;padding:8px 4px;}
.rev-mod-att-cell{display:flex;align-items:center;justify-content:center;}
.rev-mod-row{border-bottom:1px solid var(--border);cursor:pointer;position:relative;min-height:113px;transition:transform .08s linear,opacity .08s linear,background .12s;}
.rev-mod-row:hover{background:var(--stone20);}
.rev-mod-row:last-child{border-bottom:none;}
.rev-mod-row.rev-mod-upd{background:linear-gradient(90deg,#fffbf0 0%,var(--surface) 44px);}
.rev-mod-row.is-done{background:var(--success-bg);box-shadow:inset 3px 0 0 var(--success);}
.rev-mod-row.is-done:hover{background:#e8f6ec;}
.rev-mod-row.is-done .rev-mod-desc{color:var(--muted);}
.rev-mod-match-sug.is-matched{background:var(--success-bg);border:1px solid var(--success-border);border-radius:8px;padding:8px 10px;}
.rev-mod-match-sug.is-matched .rev-mod-match-cat,.rev-mod-match-sug.is-matched .rev-mod-match-sub{color:var(--success);}
.rev-mod-row.is-done .rev-mod-chev{opacity:.35;}
.rev-mod-done-badge{
  display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:2px 7px;border-radius:var(--r99);
  font-size:12px;font-weight:700;color:var(--success);background:#dcfce7;letter-spacing:.02em;vertical-align:middle;
}
.rev-mod-ai-band.is-done{background:#eef9f1;border-color:#c6ead1;}
.rev-mod-ai-band.is-done .rev-mod-ai-col+.rev-mod-ai-col{border-left-color:#d9eee0;}
.all-tbl tr.tr-done{background:var(--success-bg);box-shadow:inset 3px 0 0 var(--success);}
.rev-row-done-label{font-size:13px;font-weight:600;color:var(--success);white-space:nowrap;}
.rev-mod-row.tr-exiting{background:linear-gradient(90deg,var(--success-bg) 0%,var(--surface) 28%);box-shadow:inset 3px 0 0 var(--success);}
.rev-mod-date{font-size:16px;font-weight:500;color:#45464a;line-height:1.35;white-space:nowrap;}
.rev-mod-date-group{border-bottom:1px solid var(--border);}
.rev-mod-date-group:last-child{border-bottom:none;}
.rev-mod-date-hd{
  padding:10px 16px 8px;font-size:14px;font-weight:700;color:var(--muted);
  letter-spacing:.02em;background:var(--stone20);border-bottom:1px solid var(--border);
}
.rev-mod-date-group .rev-mod-row{border-bottom:1px solid var(--border);}
.rev-mod-date-group .rev-mod-row:last-child{border-bottom:none;}
.rev-mod-tx{display:flex;align-items:flex-start;gap:10px;min-width:0;}
.rev-mod-vendor{width:34px;height:34px;border-radius:10px;background:#f7f6f2;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;font-weight:600;color:var(--text);line-height:1;overflow:hidden;}
.rev-mod-vendor.is-brand{font-weight:700;letter-spacing:-.02em;}
.rev-mod-vendor.is-customer{background:#e8f4ef;color:#0d7d4e;}
.rev-mod-vendor.is-supplier{background:#f7f6f2;color:var(--text);}
.rev-mod-ref{font-size:16px;font-weight:600;color:var(--text);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rev-mod-desc{font-size:16px;font-weight:500;color:#45464a;line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rev-mod-amt{text-align:right;font-size:16px;font-weight:400;color:var(--text);line-height:1.4;}
.rev-mod-chev{color:#ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rev-mod-empty{padding:48px 20px;text-align:center;color:var(--muted);}
/* AI suggestion band — tax + match only */
.rev-mod-ai-band{display:grid;grid-template-columns:88px 1fr;align-items:stretch;gap:4px;min-height:98px;border-radius:12px;border:1px solid transparent;position:relative;transition:border-color .12s,background .12s;}
.rev-mod-ai-band.has-ai{background:transparent;position:relative;overflow:visible;}
.rev-mod-row:hover .rev-mod-ai-band.has-ai::before{
  content:'';position:absolute;top:0;right:0;bottom:0;width:54%;border-radius:0 12px 12px 0;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(242,232,253,0) 0%,rgba(242,232,253,.45) 16%,rgba(255,255,255,.92) 38%,#fff 58%);
}
.rev-mod-ai-band.is-manual{background:transparent;border:none;min-height:98px;}
.rev-mod-ai-col{display:flex;flex-direction:column;justify-content:flex-start;padding:12px 10px 10px;position:relative;min-height:98px;z-index:2;border-radius:10px;overflow:visible;transition:background .12s,border-color .12s,box-shadow .12s;}
.rev-mod-ai-col.has-ai-sug{
  background:linear-gradient(180deg,var(--brand-subtle) 0%,var(--ai-bg) 100%);
  border:1px solid rgba(167,98,244,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
}
.rev-mod-row:hover .rev-mod-ai-col.has-ai-sug{
  background:linear-gradient(180deg,#f2e8fd 0%,#ead6ff 100%);
  border-color:rgba(123,20,239,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 0 0 1px rgba(123,20,239,.08);
}
.rev-mod-ai-col.has-ai-sug .rev-mod-conf{color:var(--ai-text);}
/* verify-by-exception — signals, dismissal */
.rev-ready-banner{background:linear-gradient(90deg,var(--brand-subtle),#fff);border:1px solid var(--lavender);border-radius:var(--r8);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.rev-ready-banner-main{flex:1;min-width:200px;}
.rev-ready-banner-title{font-size:16px;font-weight:600;color:var(--text);margin:0 0 4px;}
.rev-ready-banner-sub{font-size:14px;color:var(--muted);margin:0;}
.match-signals{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px;}
.match-signal-chip{font-size:12px;font-weight:500;padding:2px 8px;border-radius:9999px;background:var(--stone20);color:var(--text);line-height:1.35;}
.match-signal-chip.sig-strong{background:var(--success-bg);color:var(--success);}
.match-signal-chip.sig-rule{background:var(--ai-bg);color:var(--ai-text);}
.dismiss-menu-wrap{position:relative;display:inline-flex;}
.dismiss-menu{position:absolute;bottom:calc(100% + 6px);right:0;min-width:240px;background:#fff;border:1px solid var(--border);border-radius:var(--r8);box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;z-index:1200;display:none;}
.dismiss-menu.open{display:block;}
.dismiss-menu-opt{display:block;width:100%;text-align:left;padding:8px 10px;border:none;background:none;border-radius:var(--r4);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;font-family:var(--font);line-height:1.35;}
.dismiss-menu-opt:hover{background:var(--stone20);}
.dismiss-menu-opt small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px;}
.dismiss-menu-sep{height:1px;background:var(--border);margin:4px 6px;}
.rev-mod-act-verify{background:#fff;border:1px solid var(--success-border);color:#008536;}
.rev-mod-act-verify:hover{background:var(--success-bg);}
.rev-row-actions .rev-mod-act-verify{min-width:56px;}
.hidden-tx-pill{font-size:12px;font-weight:600;color:var(--muted);background:var(--stone20);padding:2px 8px;border-radius:var(--r4);}
.dismissed-log-row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
.dismissed-log-row:last-child{border-bottom:none;}
.dismissed-log-meta{flex:1;min-width:0;}
.dismissed-log-title{font-size:14px;font-weight:600;color:var(--text);margin:0 0 2px;}
.dismissed-log-sub{font-size:13px;color:var(--muted);margin:0;line-height:1.4;}

/* transaction pane — Gmail-style reading pane (All + Review tabs) */
.tx-pane-wrap{display:flex;min-height:520px;max-height:calc(100vh - 200px);border:1px solid var(--border);border-radius:var(--r8);overflow:hidden;background:var(--surface);}
.tx-pane-wrap.tx-layout-vertical{flex-direction:row;}
.tx-pane-wrap.tx-layout-horizontal{
  flex-direction:column;border:none;border-radius:0;background:transparent;
  overflow:visible;max-height:none;min-height:0;height:auto;gap:0;
}
.tx-pane-wrap.tx-layout-none-full{min-height:560px;}
.tx-pane-wrap.tx-layout-none-full .tx-pane-detail{flex:1;max-width:100%;}
.tx-pane-list{flex:0 0 var(--tx-pane-list-pct,38%);max-width:var(--tx-pane-list-pct,38%);min-width:200px;display:flex;flex-direction:column;background:var(--surface);}
.tx-layout-vertical .tx-pane-list{border-right:1px solid var(--border);}
/* horizontal — Outlook-style: rounded list card + flowing detail below */
.tx-pane-top-card{
  display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r8);
  overflow:hidden;min-height:140px;
}
.tx-layout-horizontal:not(.has-detail) .tx-pane-top-card{
  height:auto;max-height:75vh;min-height:360px;
}
.tx-layout-horizontal.has-detail .tx-pane-top-card{
  height:var(--tx-pane-top-h,42vh);max-height:75vh;flex-shrink:0;
}
.tx-pane-top-card .tx-pane-list-hd{border-radius:var(--r8) var(--r8) 0 0;}
.tx-pane-top-card .rev-mod-wrap,.tx-pane-top-card .rev-card{border:none;border-radius:0;box-shadow:none;}
.tx-pane-top-card .all-tbl-v2-wrap{border:none;border-radius:0;}
.tx-pane-bottom{
  flex-shrink:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r8);
  margin-top:10px;
}
.tx-table-shell.tx-pane-mode:has(.tx-layout-horizontal){overflow:visible;min-height:0;border:none;background:transparent;}
.tx-layout-horizontal .tx-pane-bottom .tx-pane-detail-inner{
  height:auto;overflow:visible;display:block;
}
.tx-layout-horizontal .tx-pane-bottom .tx-pane-detail-inner .aside-body{
  flex:none;overflow:visible;min-height:0;
}
.tx-layout-horizontal .tx-pane-bottom .match-footer,
.tx-layout-horizontal .tx-pane-bottom .aside-review-footer,
.tx-layout-horizontal .tx-pane-bottom .pane-sticky-foot{
  box-shadow:none;
}
.tx-layout-horizontal .tx-pane-bottom .pane-detail-shell{
  height:auto;overflow:visible;
}
.tx-layout-horizontal .tx-pane-bottom .pane-detail-body{
  flex:none;overflow:visible;min-height:0;
}
.tx-pane-row.sel,.rev-mod-row.sel{background:#d3e3fd;}
.rev-mod-row.sel{box-shadow:inset 3px 0 0 var(--purple);}
.all-tbl-v2 tbody tr.sel,.review-tbl tbody tr.sel{background:#d3e3fd;}
.tx-pane-list-hd{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;flex-wrap:wrap;}
.tx-pane-list-title{font-size:13px;color:var(--muted);flex:1;min-width:60px;}
.tx-pane-list-nav{display:inline-flex;align-items:center;gap:2px;}
.tx-pane-nav-btn{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--r4);background:#fff;color:var(--text);cursor:pointer;font-size:16px;line-height:1;font-family:var(--font);display:flex;align-items:center;justify-content:center;}
.tx-pane-nav-btn:hover:not(:disabled){background:var(--stone20);border-color:var(--lavender);}
.tx-pane-nav-btn:disabled{opacity:.35;cursor:not-allowed;}

  min-width:56px;padding:7px 10px;border-radius:6px;font-size:13px;font-weight:600;line-height:1.15;
  cursor:pointer;font-family:var(--font);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.rev-mod-act-accept svg,.rev-mod-act-reject svg{width:14px;height:14px;flex-shrink:0;}
.rev-mod-act-accept{background:#fff;border:1px solid var(--success-border);color:#008536;}
.rev-mod-act-accept:hover{background:var(--success-bg);}
.rev-mod-act-reject{background:#fff;border:1px solid #fca5a5;color:var(--red);}
.rev-mod-act-reject:hover{background:#fff5f5;}
.rev-mod-act-accept:disabled,.rev-mod-act-reject:disabled,.rev-mod-act-review:disabled{opacity:.45;cursor:not-allowed;}
.tr-exit-overlay{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);border:1px solid var(--success-border);border-radius:var(--r8);padding:8px 12px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:5;white-space:nowrap;}
.tr-exit-progress{width:72px;height:4px;background:var(--stone20);border-radius:99px;overflow:hidden;flex-shrink:0;}
.tr-exit-progress-fill{height:100%;background:var(--success);border-radius:99px;transition:width .08s linear;}
.tr-exit-label{font-size:13px;color:var(--muted);font-weight:500;}
.btn-rev-review{padding:5px 10px;background:var(--surface);color:var(--purple);border:1px solid var(--lavender);border-radius:var(--r4);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);}
.btn-rev-review:hover{background:var(--mauve);}
.btn-rev-ready{padding:5px 10px;background:var(--success);color:#fff;border:none;border-radius:var(--r4);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);}
.btn-rev-ready:hover{background:var(--success-hover);}
.btn-rev-ready:disabled{background:#ccc;cursor:not-allowed;}
/* aside — dimension sections */
.dim-section{border:1px solid var(--border);border-radius:var(--r8);margin-bottom:10px;overflow:hidden;}
.dim-section-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--stone20);border-bottom:1px solid var(--border);cursor:pointer;}
.dim-section-hd:hover{background:var(--mauve);}
.dim-section-title{font-size:14px;font-weight:600;flex:1;}
.dim-badge{font-size:12px;font-weight:600;padding:2px 7px;border-radius:var(--r4);}
.dim-badge-ready{background:var(--success-bg);color:var(--success);}
.dim-badge-pending{background:var(--ai-bg);color:var(--ai-text);}
.dim-badge-changed{background:var(--warning-bg);color:var(--warning);}
.dim-badge-blocked{background:var(--danger-bg);color:var(--danger);}
.dim-section-body{padding:12px 14px;font-size:14px;line-height:1.55;}
.dim-changed-banner{background:var(--warning-bg);border:1px solid var(--warning-border);border-radius:var(--r8);padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.55;}
.dim-changed-banner strong{color:var(--warning);display:block;margin-bottom:4px;}
.aside-review-footer{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;box-shadow:0 -4px 12px rgba(0,0,0,.06);}
.aside-review-footer-row{display:flex;align-items:center;gap:8px;}
.aside-review-footer-row .sp{flex:1;}
.btn-aside-ready{flex:1;padding:10px 14px;background:var(--success);color:#fff;border:none;border-radius:var(--r4);font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-aside-next{padding:10px 14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font);}
.btn-aside-partial{padding:10px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r4);font-size:15px;cursor:pointer;font-family:var(--font);}
/* activity + pre-bas pages */
.page-banner{background:var(--brand-subtle);border:1px solid var(--lavender);border-radius:var(--r8);padding:14px 18px;margin-bottom:20px;font-size:15px;line-height:1.55;}
.page-banner strong{color:var(--purple);}
.activity-list{display:flex;flex-direction:column;gap:10px;}
.activity-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.activity-item:hover{border-color:var(--lavender);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.activity-item.unread{border-left:3px solid var(--purple);}
.activity-ico{width:36px;height:36px;border-radius:var(--r8);background:var(--ai-bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.activity-body{flex:1;min-width:0;}
.activity-title{font-size:15px;font-weight:600;margin-bottom:2px;}
.activity-sub{font-size:14px;color:var(--muted);line-height:1.45;}
.activity-time{font-size:13px;color:var(--muted);flex-shrink:0;}
.prebas-banner{background:var(--warning-bg);border:1px solid var(--warning-border);border-radius:var(--r8);padding:14px 18px;margin-bottom:16px;}
.prebas-banner-title{font-size:16px;font-weight:600;color:var(--warning);margin-bottom:4px;}
.prebas-banner-sub{font-size:14px;color:var(--muted);line-height:1.5;}


/* ── Feelix v8.17 component primitives (from MCP) ── */
.fx-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r4);padding:8px 16px;font-size:16px;font-weight:500;font-family:var(--font);cursor:pointer;border:1px solid transparent;line-height:1.4;white-space:nowrap;}
.fx-btn-sm{padding:5px 12px;font-size:14px;}
.fx-btn-block{flex:1;}
.fx-btn-success{background:var(--success);color:#fff;border-color:var(--success);}
.fx-btn-success:hover{background:var(--success-hover);border-color:var(--success-hover);}
.fx-btn-success:disabled{opacity:.45;cursor:not-allowed;}
.fx-btn-neutral-ghost{background:var(--surface);color:var(--text);border-color:var(--border);}
.fx-btn-neutral-ghost:hover{background:var(--stone20);}
.fx-btn-brand-subtle{background:var(--brand-subtle);color:var(--purple);border-color:var(--lavender);}
.fx-btn-brand-subtle:hover{background:var(--mauve);}
.fx-textlink{background:none;border:none;padding:5px 10px;font-size:16px;font-weight:500;color:var(--purple);cursor:pointer;font-family:var(--font);}
.fx-textlink:hover{text-decoration:underline;}
/* Label type=boxed — tones from Feelix Label */
.fx-label{display:inline-flex;align-items:center;font-size:14px;font-weight:500;line-height:1.4;}
.fx-label-boxed{border-radius:var(--r4);padding:2px 8px;}
.fx-label-neutral{background:var(--stone20);color:var(--text);}
.fx-label-success{background:var(--success-bg);color:var(--success);}
.fx-label-warning{background:var(--warning-bg);color:var(--warning);}
.fx-label-danger{background:var(--danger-bg);color:var(--danger);}
.fx-label-info{background:var(--info-bg);color:var(--info);}
.fx-label-brand{background:var(--brand-subtle);color:var(--purple);}
.fx-label-ai{background:var(--ai-bg);color:var(--ai-text);}
.fx-label-dim{opacity:.35;}
/* SelectPill — Feelix filter pills (capsule + circular badge) */
.fx-pill-group{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border);}
.fx-pill{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:6px 16px 6px 18px;border:1px solid var(--border);border-radius:9999px;background:var(--surface);font-size:16px;font-weight:500;color:var(--text);cursor:pointer;font-family:var(--font);transition:background .12s,border-color .12s;white-space:nowrap;}
.fx-pill:hover{border-color:var(--lavender);background:var(--stone20);}
.fx-pill-checked{background:var(--brand-subtle);border-color:var(--lavender);}
.fx-pill-label{line-height:1.2;}
.fx-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:9999px;font-size:14px;font-weight:600;background:var(--purple);color:#fff;line-height:1;flex-shrink:0;}
.fx-pill-advanced{padding-left:14px;color:var(--text);}
.fx-pill-advanced svg{width:14px;height:14px;color:var(--muted);flex-shrink:0;}
/* Multi-select filter dropdown pill */
.fx-rev-filter-bar{align-items:center;padding:12px 16px 10px;}
/* Review filter composer — needs dropdown + source segment */
.rev-filter-composer{background:#fff;border:1px solid var(--border);border-radius:var(--r8);padding:12px 16px;margin-bottom:14px;}
.rev-filter-composer-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.rev-filter-composer-label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.rev-filter-needs,.rev-filter-source{display:flex;align-items:center;gap:8px;min-width:0;}
.rev-filter-composer-divider{width:1px;height:28px;background:var(--border);flex-shrink:0;}
.rev-filter-segment{display:inline-flex;background:var(--stone20);border-radius:var(--r4);padding:2px;gap:2px;flex-wrap:wrap;}
.rev-filter-seg-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;padding:6px 11px;border:none;background:transparent;border-radius:3px;cursor:pointer;color:var(--muted);font-family:var(--font);white-space:nowrap;}
.rev-filter-seg-btn:hover{color:var(--text);}
.rev-filter-seg-btn.act{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(35,36,40,.1);}
.rev-filter-seg-btn .fx-badge{font-size:11px;min-width:18px;height:18px;padding:0 5px;}
.rev-filter-composer-end{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.rev-filter-count{font-size:13px;color:var(--muted);white-space:nowrap;}
.rev-filter-clear{font-size:13px;color:var(--purple);background:none;border:none;cursor:pointer;font-family:var(--font);font-weight:500;padding:0;}
.rev-filter-clear:hover{text-decoration:underline;}
.rev-origin-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:14px;background:var(--brand-subtle);border:1px solid var(--lavender);border-radius:var(--r8);font-size:13px;color:var(--text);}
.rev-origin-bar button{background:none;border:none;padding:0;color:var(--purple);font-weight:600;cursor:pointer;font-family:var(--font);font-size:13px;}
.fx-ms-pill-wrap{position:relative;display:inline-flex;}
.fx-ms-pill{gap:8px;padding-right:14px;}
.fx-ms-pill-chev{font-size:12px;color:var(--muted);line-height:1;flex-shrink:0;}
.fx-ms-menu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:50;min-width:260px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);
  box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;
}
.fx-ms-opt{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r4);
  cursor:pointer;font-size:16px;font-weight:500;color:var(--text);
}
.fx-ms-opt:hover{background:var(--stone20);}
.fx-ms-opt input{width:14px;height:14px;accent-color:var(--purple);flex-shrink:0;cursor:pointer;margin:0;}
.fx-ms-opt-label{flex:1;line-height:1.2;}
.fx-ms-opt .fx-badge{margin-left:auto;}
.fx-ms-adv{

.fx-ms-adv:hover{background:var(--stone20);color:var(--purple);}
.fx-ms-adv svg{color:var(--muted);flex-shrink:0;}

.fx-alert-body{color:var(--text);}

.fx-alert-warning{background:var(--warning-bg);border-color:var(--warning-border);color:var(--text);}

.recon-todo-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.35;font-family:var(--font-heading);}

  display:inline-flex;align-items:center;gap:4px;padding:8px 14px;

.all-tbl tr.tr-focus{box-shadow:inset 3px 0 0 var(--purple);background:var(--brand-subtle);}
.rev-focus-banner{

}
.rev-focus-banner strong{font-family:var(--font-heading);font-weight:600;}
.tab:disabled{opacity:.45;cursor:not-allowed;color:var(--muted);}
.fx-tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-left:6px;padding:0 6px;border-radius:var(--r4);font-size:13px;font-weight:600;background:var(--brand-subtle);color:var(--purple);}
.tab.act .fx-tab-count,.tx-nav-tab.act .fx-tab-count{background:var(--purple);color:#fff;}
.tx-nav-tab .fx-tab-count{margin-left:0;min-width:16px;height:16px;padding:0 5px;font-size:12px;}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn .2s ease;}
.divider{height:1px;background:var(--border);margin:10px 0;}
.match-link{color:var(--purple);text-decoration:none;font-weight:500;}
.match-link:hover{text-decoration:underline;}

.ctx-banner-body,.dim-section-body,.ai-split-banner-body,.ar-card-body,
thead th,.inp,.sel,.acct-menu-meta,.tab-ct,.tab-ct-m,.src,.chip{line-height:1.45;}

const COL_NON_RESIZABLE={
  all:new Set(['chk','att']),
  review:new Set(['chk','att']),
};
function ensureColWidths(){
  if(!S.colWidths) S.colWidths={all:{...COL_WIDTH_DEFAULTS.all},review:{...COL_WIDTH_DEFAULTS.review}};

function buildTableColgroup(tableKey,cols){
  ensureColWidths();
  return `<colgroup>${cols.map(c=>`<col data-col="${c}" style="width:${S.colWidths[tableKey][c]}px">`).join('')}</colgroup>`;
}
function thResize(tableKey,colKey,labelHtml,cls=''){
  const fixed=COL_NON_RESIZABLE[tableKey]?.has(colKey);
  const handle=fixed?'':`<span class="col-resize-handle" data-table="${tableKey}" data-col="${colKey}" role="separator" aria-label="Resize column"></span>`;
  return `<th class="${cls}${fixed?' col-fixed':''}" data-col="${colKey}"><span class="th-label">${labelHtml}</span>${handle}</th>`;
}
function applyColWidths(tableKey,selector){
  const table=document.querySelector(selector);
  if(!table) return;
  ensureColWidths();
  const widths=S.colWidths[tableKey];
  COL_NON_RESIZABLE[tableKey]?.forEach(c=>{widths[c]=COL_WIDTH_DEFAULTS[tableKey][c];});
  table.querySelectorAll('[data-col]').forEach(el=>{
    const col=el.dataset.col;
    if(col&&widths[col]!=null) el.style.width=widths[col]+'px';
  });
  const cols=table.querySelectorAll('colgroup col[data-col]');
  cols.forEach(col=>{
    const key=col.dataset.col;
    if(key&&widths[key]!=null) col.style.width=widths[key]+'px';
  });
}
function initResizableTables(){
  ensureColWidths();
  applyColWidths('all','.all-tbl-v2');
  applyColWidths('review','.review-tbl');
  document.querySelectorAll('.col-resize-handle').forEach(handle=>{
    if(handle._bound) return;
    handle._bound=true;
    handle.addEventListener('mousedown',startColResize);
  });
  document.querySelectorAll('.all-tbl-v2 thead th[data-col]:not(.col-fixed), .review-tbl thead th[data-col]:not(.col-fixed)').forEach(th=>{
    if(th._edgeBound) return;
    th._edgeBound=true;
    th.addEventListener('mousemove',onColHeaderMouseMove);
    th.addEventListener('mouseleave',onColHeaderMouseLeave);
    th.addEventListener('mousedown',onColHeaderMouseDown);
  });
}
function colResizeCursor(){return 'var(--cursor-col-resize, ew-resize)';}
function isNearColResizeEdge(th,clientX){return clientX>=th.getBoundingClientRect().right-12;}
function onColHeaderMouseMove(e){
  const th=e.currentTarget;
  th.style.cursor=isNearColResizeEdge(th,e.clientX)?colResizeCursor():'';
}
function onColHeaderMouseLeave(e){
  e.currentTarget.style.cursor='';
}
function onColHeaderMouseDown(e){
  const th=e.currentTarget;
  if(!isNearColResizeEdge(th,e.clientX)) return;
  const handle=th.querySelector('.col-resize-handle');
  if(!handle) return;
  e.preventDefault();
  e.stopPropagation();
  beginColResize(handle,e.clientX);
}
function startColResize(e){
  e.preventDefault();
  e.stopPropagation();
  beginColResize(e.currentTarget,e.clientX);
}
function beginColResize(handle,startX){
  const tableKey=handle.dataset.table;
  const colKey=handle.dataset.col;
  if(COL_NON_RESIZABLE[tableKey]?.has(colKey)) return;
  const th=handle.closest('th');
  if(!th) return;
  const table=th.closest('table');
  const startW=th.getBoundingClientRect().width;
  ensureColWidths();
  document.body.classList.add('col-resizing');
  setColResizeActive(table,colKey,true);
  handle.classList.add('is-active');
  updateColResizeGuide(table,th);
  function onMove(ev){
    const newW=Math.max(48,Math.round(startW+(ev.clientX-startX)));
    S.colWidths[tableKey][colKey]=newW;
    applyColWidths(tableKey,tableKey==='all'?'.all-tbl-v2':'.review-tbl');
    syncReviewTableHeadWidths();
    const activeTh=table?.querySelector(`thead th[data-col="${colKey}"]`);
    if(activeTh) updateColResizeGuide(table,activeTh);
  }
  function onUp(){
    document.body.classList.remove('col-resizing');
    setColResizeActive(table,colKey,false);
    handle.classList.remove('is-active');
    hideColResizeGuide();
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}
function setColResizeActive(table,colKey,active){
  if(!table) return;
  table.querySelectorAll(`th[data-col="${colKey}"], td[data-col="${colKey}"]`).forEach(el=>{
    el.classList.toggle('col-resize-active',active);
  });
}
function ensureColResizeGuide(){
  let guide=document.getElementById('col-resize-guide');
  if(!guide){
    guide=document.createElement('div');
    guide.id='col-resize-guide';
    guide.className='col-resize-guide';
    guide.setAttribute('aria-hidden','true');
    document.body.appendChild(guide);
  }
  return guide;
}
function updateColResizeGuide(table,th){
  const guide=ensureColResizeGuide();
  const wrap=table?.closest('.all-tbl-v2-wrap')||table?.closest('.rev-tbl-scroll')||table?.parentElement;
  if(!wrap||!th) return;
  const wrapRect=wrap.getBoundingClientRect();
  const thRect=th.getBoundingClientRect();
  guide.style.display='block';
  guide.style.left=(thRect.right-1)+'px';
  guide.style.top=wrapRect.top+'px';
  guide.style.height=wrapRect.height+'px';
}
function hideColResizeGuide(){
  const guide=document.getElementById('col-resize-guide');
  if(guide) guide.style.display='none';
}

function dimStatus(tx,dim){
  if(tx.status==='awaiting') return dim==='match'?'blocked':'none';
  if(dim==='receipt'){
    if(!tx.attach&&!tx.ai.file.val) return 'none';
    if(txHasChanged(tx)&&tx.attach>0) return 'changed';
    if(tx.ai.file.st==='accepted'||(tx.attach>0&&tx.ai.file.val)) return tx.ai.file.st==='accepted'?'ready':'pending';
    if(tx.attach>0) return 'pending';
    return 'none';
  }
  const field=dim==='category'?'cat':dim==='gst'?'tax':dim;
  const f=tx.ai[field]; if(!f) return 'none';
  if(f.st==='rejected') return 'blocked';
  if(f.st==='accepted') return 'ready';
  if(dim==='match'&&(!f.val&&!(MATCHES[tx.id]&&MATCHES[tx.id].length))) return 'none';
  if(txHasChanged(tx)&&(field==='cat'||field==='tax'||field==='match')&&f.st==='idle'&&f.val) return 'changed';
  if(f.val&&f.st==='idle') return 'pending';
  if(dim==='match'&&MATCHES[tx.id]&&MATCHES[tx.id].length&&f.st==='idle') return 'pending';
  return 'none';
}

function txIsReadyForBulk(tx){
  if(txReviewDone(tx)) return false;
  if(tx.status==='awaiting'||tx.status==='accepted'||tx.status==='coded') return false;
  if(txHasChanged(tx)) return false;
  return txDimensions(tx).some(d=>{const s=dimStatus(tx,d);return s==='pending';})&&
    !txDimensions(tx).some(d=>dimStatus(tx,d)==='blocked');
}
function txReadyScore(tx){
  const dims=txDimensions(tx);

  return ready/active.length;
}
function txIsBlocked(tx){return txDimensions(tx).some(d=>dimStatus(tx,d)==='blocked')||tx.status==='awaiting';}
function txHasReceiptMatchSuggestions(tx){
  if(txReviewDone(tx)) return false;
  const hasAttach=tx.attach>0||dimStatus(tx,'receipt')==='pending'||dimStatus(tx,'receipt')==='changed';
  if(!hasAttach) return false;
  return ['cat','match','tax','file'].some(f=>{const a=tx.ai[f];return a&&a.val&&a.st==='idle';})
    ||(tx.attach>0&&ATTACH_DATA[tx.id]);
}
function txNeedsReceiptReview(tx){

function txNeedsCategoryReview(tx){

function txNeedsTaxReview(tx){

function txNeedsMatchReview(tx){

function txHasAiSuggestion(tx){
  if(txReviewDone(tx)) return false;

function filterReviewList(list,filter){
  if(filter==='all') return list;

  else if(filter==='revisions') filtered=list.filter(t=>t.ctxOld&&t.ctxNew);
  else if(filter==='receipt') filtered=list.filter(t=>dimStatus(t,'receipt')==='pending'||dimStatus(t,'receipt')==='changed');
  else if(filter==='category') filtered=list.filter(t=>dimStatus(t,'category')==='pending'||dimStatus(t,'category')==='changed');
  else if(filter==='receiptmatch') filtered=list.filter(txHasReceiptMatchSuggestions);
  else if(filter==='match') filtered=list.filter(t=>dimStatus(t,'match')==='pending');
  else if(filter==='gst') filtered=list.filter(t=>dimStatus(t,'gst')==='pending'||dimStatus(t,'gst')==='changed');
  else if(filter==='blocked') filtered=list.filter(txIsBlocked);

function sortReviewList(list){
  return [...list].sort((a,b)=>{
    const da=txReviewDone(a)?1:0, db=txReviewDone(b)?1:0;
    if(da!==db) return da-db;
    const va=txVerifyRank(a), vb=txVerifyRank(b);
    if(va!==vb) return vb-va;
    const ca=txHasChanged(a)?0:1, cb=txHasChanged(b)?0:1;
    if(ca!==cb) return ca-cb;
    return b.date.localeCompare(a.date);
  });
}

function getWhy(tx, field){
  const f=tx.ai[field]; if(!f||!f.val) return '';
  const vend=tx.desc.split(/\s[–\-]/)[0].trim();
  const c=f.conf; const cw=c>=90?'high':c>=75?'moderate':'lower';
  if(field==='cat'){
    if(c>=90) return `"${vend}" matches a saved rule or has been coded as "${f.val}" 3+ times recently. ${c}% confidence.`;
    return `Keywords in "${vend}" suggest "${f.val}". ${cw.charAt(0).toUpperCase()+cw.slice(1)} confidence — review before accepting.`;
  }
  if(field==='match') return `An open MYOB record was found matching the amount and date. Vendor name "${vend}" confirmed the link at ${c}% confidence.`;
  if(field==='tax'){
    if(c>=90) return `"${f.val}" applied from a saved rule or prior transactions with this vendor. Consistent coding pattern found.`;
    return `"${f.val}" inferred from the category default. ${cw.charAt(0).toUpperCase()+cw.slice(1)} confidence — verify if correct.`;
  }
  if(field==='job') return `Job "${f.val}" was active on the most recent similar transaction.${c<75?' Multiple active jobs reduce certainty.':' Confirmed by recent coding history.'}`;
  return 'AI suggestion based on transaction history and matching patterns.';
}
function getWhyFile(tx){
  const att=ATTACH_DATA[tx.id]?.[0];
  if(!att) return tx.attach>0?'Receipt attached — link or scan to enable AI extraction.':'';
  const c=att.confidence;
  return `Receipt from ${att.vendor} scanned. Extracted $${att.extractedAmt.toFixed(2)} (${att.extractedTax}), category "${att.extractedCat}". Vendor and amount match this transaction at ${c}% confidence.`;
}

function txTopMatchConf(tx){

function txVerifyRank(tx){

}
function getMatchSignals(tx,field){
  const vend=tx.desc.split(/\s[–\-]/)[0].trim();
  const f=tx.ai[field];
  const signals=[];
  if(field==='match'){
    if(Math.abs(tx.amount)>0) signals.push({label:'Amount match',tone:'strong'});
    signals.push({label:'Date within window',tone:''});
    if(vend.length>2) signals.push({label:`Supplier: ${vend.split(' ')[0]}`,tone:''});
    if(S.memory.some(m=>m.active&&m.memType==='match'&&vend.includes(m.entity.split(' ')[0]))) signals.push({label:'Bank rule',tone:'rule'});
    if(MATCHES[tx.id]?.length) signals.push({label:'Open record found',tone:'strong'});
  }else if(field==='cat'){
    if(S.memory.some(m=>m.active&&m.source==='rule'&&vend.includes(m.entity.split(' ')[0]))) signals.push({label:'Saved rule',tone:'rule'});
    else signals.push({label:'Keyword match',tone:''});
    if((f?.conf||0)>=90) signals.push({label:'Prior coding pattern',tone:'strong'});
  }else if(field==='tax'){
    if((f?.conf||0)>=90) signals.push({label:'Vendor tax history',tone:'strong'});
    else signals.push({label:'Category default',tone:''});
    if(tx.ai.cat?.val) signals.push({label:'Linked to category',tone:''});
  }
  return signals;
}

}
function declinePatternKey(tx,field){

function bumpDeclineCount(tx,field){

function maybeElevationPrompt(tx,field){

function clearFieldSuggestion(tx,field){

function addDismissLogEntry(tx,field,type,note){
