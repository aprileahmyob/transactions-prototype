<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Transactions – MYOB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --purple:#7B14EF;--lavender:#C497FE;--mauve:#EBDCFD;
  --white:#fff;--bg:#F5F4F2;--border:#E2E0DB;--text:#1A1A1A;--muted:#6B6B6B;
  --green:#0D7D4E;--green-bg:#E6F4EE;--green-border:#c3e6d5;
  --red:#C0392B;--red-bg:#FDECEA;
  --blue:#1A6EBE;--blue-bg:#E8F0FB;
  --amber:#B45309;--amber-bg:#FEF3C7;--amber-border:#fde68a;
  --stone:#E6E0D1;--stone20:#F7F6F1;
  --pink:#FE02A7;
  --font:'Inter',Arial,sans-serif;
  --r4:4px;--r8:8px;--r99:999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);display:flex;height:100vh;overflow:hidden;}

/* sidebar */
.sb{width:56px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;flex-shrink:0;}
.sb-logo{width:32px;height:32px;background:var(--purple);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;font-family:Georgia,serif;font-style:italic;margin-bottom:6px;}
.sb-exp{width:22px;height:22px;background:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;cursor:pointer;margin-bottom:4px;}
.sb-i{width:38px;height:38px;border-radius:var(--r8);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;}
.sb-i:hover,.sb-i.act{background:var(--mauve);color:var(--purple);}
.sb-i svg{width:18px;height:18px;}

/* layout */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{height:50px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;z-index:150;}
.tb-sp{flex:1;}
.tb-link{font-size:12px;color:var(--purple);font-weight:500;cursor:pointer;padding:5px 10px;border-radius:var(--r4);border:1px solid var(--lavender);}
.tb-link:hover{background:var(--mauve);}
.tb-av{width:26px;height:26px;background:var(--mauve);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--purple);}
.tb-user{display:flex;align-items:center;gap:7px;cursor:pointer;padding:4px 8px;border-radius:var(--r8);}
.tb-user:hover{background:var(--stone20);}

.content{flex:1;overflow-y:auto;padding:22px 24px 40px;transition:padding-right .25s ease;}
.content.aside-open{padding-right:448px;}

/* aside */
.aside-backdrop{position:fixed;inset:50px 0 0 56px;background:rgba(0,0,0,.12);z-index:149;display:none;}
.aside-backdrop.show{display:block;}
.aside{position:fixed;right:0;top:50px;bottom:0;width:428px;background:#fff;border-left:1px solid var(--border);z-index:150;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;}
.aside.open{transform:translateX(0);}

/* page header */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ph-l{display:flex;align-items:center;gap:10px;}
.ph-title{font-size:19px;font-weight:600;}
.acct-pill{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:var(--r99);padding:4px 10px 4px 6px;cursor:pointer;font-size:13px;font-weight:500;}
.acct-pill:hover{border-color:var(--lavender);}
.acct-ico{width:21px;height:21px;background:linear-gradient(135deg,var(--purple),var(--pink));border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;}
.acct-count{font-size:10px;background:var(--mauve);color:var(--purple);border-radius:var(--r99);padding:1px 6px;font-weight:700;margin-left:2px;}
.ph-r{display:flex;align-items:center;gap:8px;}
.btn-smart{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border:none;border-radius:var(--r99);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-sm-more{width:30px;height:30px;background:#fff;border:1px solid var(--border);border-radius:var(--r8);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}

/* tabs */
.tabs{display:flex;align-items:center;gap:4px;margin-bottom:14px;}
.tab{padding:7px 18px;border-radius:var(--r99);font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border:none;background:none;font-family:var(--font);}
.tab:hover{color:var(--purple);background:var(--mauve);}
.tab.act{background:var(--purple);color:#fff;font-weight:600;}
.tab-ct{background:rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;}
.tab-ct-m{background:#eee;color:var(--muted);border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;}

/* card wrapper */
.card{background:#fff;border-radius:var(--r8);border:1px solid var(--border);overflow:hidden;}

/* balance bar — multi-account */
.bal{padding:12px 18px;border-bottom:1px solid var(--border);}
.bal-top{display:flex;align-items:center;gap:14px;margin-bottom:8px;font-size:13px;}
.bal-label{color:var(--muted);}
.bal-val{font-weight:600;}
.bal-diff{font-weight:600;color:var(--red);}
.bal-sep{color:var(--border);}
.bal-accounts{display:flex;gap:6px;flex-wrap:wrap;}
.acct-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--r99);font-size:11px;cursor:pointer;background:#fff;font-family:var(--font);}
.acct-chip:hover{border-color:var(--lavender);}
.acct-chip.sel{border-color:var(--purple);background:var(--mauve);color:var(--purple);font-weight:600;}
.acct-dot{width:7px;height:7px;border-radius:50%;}

/* filter bar */
.fbar{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.srch{position:relative;flex:0 0 185px;}
.srch svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#bbb;pointer-events:none;}
.inp{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-family:var(--font);outline:none;color:var(--text);}
.inp:focus{border-color:var(--lavender);}
.inp::placeholder{color:#bbb;}
.sel-w{position:relative;}
.sel{padding:6px 24px 6px 9px;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-family:var(--font);appearance:none;cursor:pointer;outline:none;color:var(--muted);background:#fff;}
.sel:focus{border-color:var(--lavender);}
.sel-arr{position:absolute;right:7px;top:50%;transform:translateY(-50%);pointer-events:none;color:#aaa;}
.fb-sp{flex:1;}
.btn-ref{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;background:none;border:none;cursor:pointer;font-family:var(--font);padding:5px 7px;border-radius:var(--r4);}
.btn-ref:hover{background:var(--stone20);color:var(--purple);}
.ico-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);cursor:pointer;}
.ico-btn:hover{border-color:var(--lavender);color:var(--purple);}

/* source badges */
.src{display:inline-flex;align-items:center;gap:3px;border-radius:var(--r99);padding:2px 7px;font-size:10px;font-weight:600;white-space:nowrap;}
.src-bank{background:var(--blue-bg);color:var(--blue);}
.src-myob{background:var(--mauve);color:var(--purple);}
.src-both{background:var(--green-bg);color:var(--green);}

/* table */
.tbl-w{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;}
thead th.r{text-align:right;}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
tbody tr:hover{background:#f7f5ff;}
tbody tr.tr-acc{background:var(--green-bg);}
tbody tr.tr-acc:hover{background:#d4eddf;}
tbody tr.tr-upd{background:#fffbf0;}
tbody tr.tr-upd:hover{background:#fff8e6;}
tbody td{padding:10px 10px;font-size:13px;vertical-align:middle;}

/* attach badge */
.att-w{display:flex;align-items:center;gap:2px;color:var(--purple);}
.att-ct{font-size:10px;font-weight:700;background:var(--mauve);color:var(--purple);border-radius:8px;padding:0 5px;min-width:16px;text-align:center;line-height:16px;}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r99);padding:2px 8px;font-size:10px;font-weight:600;white-space:nowrap;}
.chip-pend{background:var(--mauve);color:var(--purple);}
.chip-acc{background:var(--green-bg);color:var(--green);}
.chip-wait{background:var(--amber-bg);color:var(--amber);}
.chip-match{background:var(--green-bg);color:var(--green);}
.chip-upd{background:#fef08a;color:#713f12;}

/* ── REVIEW TAB ──────────────────────────────────── */
.rev-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.rev-count{font-size:13px;color:var(--muted);flex:1;}
/* view toggle */
.vt-wrap{display:flex;border:1px solid var(--border);border-radius:var(--r4);overflow:hidden;background:#fff;}
.vt-btn{width:30px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);border:none;background:none;font-family:var(--font);border-right:1px solid var(--border);}
.vt-btn:last-child{border-right:none;}
.vt-btn:hover{background:var(--stone20);color:var(--purple);}
.vt-btn.act{background:var(--purple);color:#fff;}
/* review table */
.rtbl-card{background:#fff;border-radius:var(--r8);border:1px solid var(--border);overflow:hidden;}
.rtbl-w{overflow-x:auto;}
.rtbl-w table thead th{background:#fff;}
.rtbl-w tbody tr.tr-upd{background:#fffbf0;}
.rtbl-w tbody tr.tr-upd td:first-child{border-left:3px solid var(--amber);}
.rtbl-w tbody tr.tr-done{background:var(--green-bg);}
/* AI table cells */
td.aitd{padding:7px 10px!important;vertical-align:middle;min-width:130px;}
.aitd-inner{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;}
.aitd-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.aitd-val{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;}
.aitd-pct{font-size:10px;color:var(--muted);flex-shrink:0;}
.aitd-btns{display:flex;gap:3px;margin-top:3px;}
.btn-aitd-ok{height:20px;padding:0 7px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:var(--r4);font-size:10px;font-weight:600;cursor:pointer;font-family:var(--font);white-space:nowrap;}
.btn-aitd-ok:hover{background:var(--green-border);}
.btn-aitd-ok.done{background:var(--green);color:#fff;border-color:var(--green);}
.btn-aitd-ed{height:20px;padding:0 7px;background:var(--stone20);color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:10px;cursor:pointer;font-family:var(--font);}
.btn-aitd-ed:hover{background:var(--mauve);color:var(--purple);}
.aitd-none{font-size:11px;color:#bbb;font-style:italic;}
.aitd-acc-wrap{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--green);}
td.aitd.aitd-accepted{background:var(--green-bg);}
td.aitd.aitd-empty{background:var(--stone20);}
/* bulk bar */
.bulk-bar{display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--mauve);border-bottom:1px solid var(--lavender);font-size:12px;font-weight:500;color:var(--purple);}
.btn-bulk-ok{padding:4px 12px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-bulk-ok:hover{background:#6810cc;}
.bulk-sp{flex:1;}
.btn-acc-sel{padding:6px 14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-acc-sel:hover{background:#6810cc;}

.rev-list{display:flex;flex-direction:column;gap:10px;}

/* review card */
.rc{background:#fff;border:1px solid var(--border);border-radius:var(--r8);overflow:hidden;transition:border-color .15s;}
.rc:hover{border-color:var(--lavender);}
.rc.rc-done{border-color:var(--green-border);background:#fafffe;}
.rc.rc-upd{border-color:#fde68a;}

.rc-head{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--border);}
.rc-head:hover{background:var(--stone20);}
.rc-head-info{flex:1;min-width:0;}
.rc-head-desc{font-weight:600;font-size:14px;margin-bottom:1px;}
.rc-head-sub{font-size:11px;color:var(--muted);}
.rc-head-right{text-align:right;flex-shrink:0;}
.rc-head-amt{font-size:18px;font-weight:700;}
.amt-neg{color:var(--text);}
.amt-pos{color:var(--green);}

/* new context banner */
.ctx-banner{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;background:#fffbf0;border-bottom:1px solid var(--amber-border);}
.ctx-banner-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.ctx-banner-body{flex:1;font-size:12px;line-height:1.6;}
.ctx-banner-title{font-weight:600;color:var(--amber);margin-bottom:2px;}
.ctx-change{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px;}
.ctx-old{color:var(--muted);text-decoration:line-through;}
.ctx-new{color:var(--green);font-weight:600;}
.ctx-actions{display:flex;gap:6px;margin-top:8px;}
.btn-ctx-acc{padding:4px 12px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-ctx-keep{padding:4px 10px;background:#fff;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);}
.btn-ctx-rev{padding:4px 10px;background:#fff;color:var(--amber);border:1px solid var(--amber-border);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);}

/* action cards row */
.ac-row{display:flex;gap:8px;padding:10px 16px;}
.ac{flex:1;border:1.5px solid var(--border);border-radius:var(--r8);padding:10px 12px;transition:border-color .15s;min-width:0;}
.ac.ac-acc{border-color:var(--green-border);background:var(--green-bg);}
.ac.ac-editing{border-color:#fde68a;background:#fffbf0;}
.ac.ac-none{border-style:dashed;border-color:#ddd;background:var(--stone20);}
.ac-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:flex;align-items:center;gap:4px;}
.ac-ai{font-size:10px;color:var(--purple);background:var(--mauve);border-radius:var(--r99);padding:1px 5px;font-weight:600;}
.ac-val{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.3;}
.ac-val.none{font-size:12px;font-weight:400;color:#bbb;font-style:italic;}
.ac-conf{display:flex;align-items:center;gap:4px;margin-bottom:8px;}
.conf-bar{height:3px;border-radius:2px;flex:1;background:#eee;max-width:60px;}
.conf-fill{height:100%;border-radius:2px;}
.fill-hi{background:var(--green);}
.fill-md{background:#d97706;}
.fill-lo{background:#ef4444;}
.conf-pct{font-size:10px;color:var(--muted);cursor:help;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
/* confidence "why" tooltip */
.why-wrap{position:relative;display:inline-flex;align-items:center;}
.why-tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#1C1C1E;color:#f0f0f0;font-size:11.5px;line-height:1.5;
  padding:10px 12px;border-radius:8px;width:230px;white-space:normal;
  pointer-events:none;opacity:0;transition:opacity .15s;z-index:500;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
}
.why-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1C1C1E;}
.why-wrap:hover .why-tip{opacity:1;pointer-events:auto;}
.why-tip-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:5px;}
/* reject button */
.btn-arej{height:24px;padding:0 8px;background:none;border:1px solid #fca5a5;color:var(--red);border-radius:var(--r4);font-size:11px;cursor:pointer;font-family:var(--font);}
.btn-arej:hover{background:var(--red-bg);}
/* rejected card state */
.ac.ac-rej{border-color:#fca5a5!important;background:#fff8f8!important;}
.ac-rej-label{font-size:11px;color:var(--red);font-weight:600;display:flex;align-items:center;gap:3px;margin-bottom:4px;}
/* table rejected cell */
.btn-aitd-rej{height:20px;padding:0 6px;background:none;border:1px solid #fca5a5;color:var(--red);border-radius:var(--r4);font-size:10px;cursor:pointer;font-family:var(--font);}
.btn-aitd-rej:hover{background:var(--red-bg);}
td.aitd.aitd-rejected{background:#fff8f8;}
.aitd-rej-wrap{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--red);}
/* rule rejection badge */
.badge-rej{font-size:10px;background:#fff0f0;color:var(--red);border:1px solid #fca5a5;border-radius:var(--r99);padding:1px 7px;font-weight:600;}
.ac-foot{display:flex;gap:4px;flex-wrap:wrap;}
.btn-aok{height:24px;padding:0 8px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:var(--r4);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-aok:hover{background:var(--green-border);}
.btn-aok.done{background:var(--green);color:#fff;border-color:var(--green);}
.btn-aedit{height:24px;padding:0 8px;background:var(--stone20);color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:11px;cursor:pointer;font-family:var(--font);}
.btn-aedit:hover{background:var(--mauve);color:var(--purple);}
.btn-aup{height:24px;padding:0 8px;background:var(--mauve);color:var(--purple);border:1px solid var(--lavender);border-radius:var(--r4);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);}
.ac-input{width:100%;padding:5px 7px;border:1px solid var(--lavender);border-radius:var(--r4);font-size:12px;font-family:var(--font);outline:none;margin-bottom:6px;}
.btn-asave{padding:3px 8px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-acancel{padding:3px 7px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:11px;cursor:pointer;font-family:var(--font);}
.ac-acc-label{font-size:11px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:3px;}
.btn-aundo{font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:var(--font);text-decoration:underline;}

/* review footer */
.rc-foot{display:flex;align-items:center;gap:8px;padding:9px 16px;border-top:1px solid var(--border);background:var(--stone20);}
.rc-progress{font-size:11px;color:var(--muted);}
.btn-rc-accall{padding:5px 14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-rc-accall:hover{background:#6810cc;}
.btn-rc-detail{padding:5px 11px;background:#fff;color:var(--purple);border:1px solid var(--lavender);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);}
.btn-rc-detail:hover{background:var(--mauve);}
.btn-rc-skip{padding:5px 10px;background:#fff;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);}
.btn-rc-done-msg{color:var(--green);font-size:12px;font-weight:500;}
.rc-foot-sp{flex:1;}

/* ── ASIDE ───────────────────────────────────────── */
.aside-head{padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.aside-close{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);line-height:1;margin-top:-1px;}
.aside-close:hover{color:var(--text);}
.aside-amt{font-size:26px;font-weight:700;line-height:1;margin:5px 0 2px;}
.aside-desc{font-size:14px;font-weight:600;margin-bottom:2px;}
.aside-meta{font-size:11px;color:var(--muted);}
.at-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.at{flex:1;padding:10px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer;border:none;background:none;font-family:var(--font);border-bottom:2px solid transparent;}
.at:hover{color:var(--purple);}
.at.act{color:var(--purple);border-bottom-color:var(--purple);}
.aside-body{flex:1;overflow-y:auto;padding:16px 18px;}
.aside-section{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;}
.aside-section:first-child{margin-top:0;}

/* aside match item */
.mi{border:1px solid var(--border);border-radius:var(--r8);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:flex-start;gap:8px;}
.mi:hover{border-color:var(--purple);}
.mi.best{border-color:var(--lavender);background:#fdfbff;}
.mi.mi-sel{border-color:var(--purple);background:var(--mauve);}
.mi-body{flex:1;min-width:0;}
.mi-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px;}
.mi-name{font-weight:600;font-size:13px;}
.mi-conf{font-size:10px;font-weight:700;border-radius:var(--r99);padding:2px 7px;}
.mi-conf.hi{background:var(--green-bg);color:var(--green);}
.mi-conf.md{background:var(--amber-bg);color:var(--amber);}
.mi-sub{font-size:11px;color:var(--muted);}
/* record checkbox circle */
.rec-chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;transition:all .15s;flex-shrink:0;margin-top:2px;}
.rec-chk.on{border-color:var(--purple);background:var(--purple);color:#fff;}
/* ri selected */
.ri.ri-sel{background:var(--mauve);}
.ri.ri-sel:hover{background:var(--mauve);}
/* match confirm footer */
.match-footer{border-top:2px solid var(--purple);padding:12px 16px;background:var(--mauve);flex-shrink:0;}
.mf-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.mf-count{font-size:13px;font-weight:700;color:var(--purple);}
.mf-names{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-confirm-match{padding:8px 18px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;flex-shrink:0;}
.btn-confirm-match:hover{background:#6810cc;}

/* aside form */
.frm-row{margin-bottom:10px;}
.frm-label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block;}
.frm-sel{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r4);font-size:13px;font-family:var(--font);outline:none;appearance:none;background:#fff;}
.frm-sel:focus{border-color:var(--lavender);}
.frm-inp{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r4);font-size:13px;font-family:var(--font);outline:none;}
.frm-inp:focus{border-color:var(--lavender);}
.btn-frm-save{width:100%;padding:8px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);margin-top:4px;}
.btn-frm-save:hover{background:#6810cc;}

/* aside create */
.create-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.create-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border:1px solid var(--border);border-radius:var(--r8);cursor:pointer;background:#fff;font-family:var(--font);transition:all .15s;}
.create-btn:hover{border-color:var(--purple);background:var(--mauve);}
.create-icon{font-size:20px;}
.create-label{font-size:11px;font-weight:600;}
.create-sub{font-size:10px;color:var(--muted);}

/* detail rows */
.dr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.dr:last-child{border-bottom:none;}
.dr-l{color:var(--muted);}
.dr-v{font-weight:500;}
/* aside search */
.aside-search-wrap{position:relative;margin-bottom:12px;}
.aside-search{width:100%;padding:7px 9px 7px 32px;border:1px solid var(--border);border-radius:var(--r8);font-size:13px;font-family:var(--font);outline:none;background:#fff;box-sizing:border-box;}
.aside-search:focus{border-color:var(--lavender);}
.aside-search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
/* record list item (non-AI) */
.ri{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--r4);cursor:pointer;transition:background .12s;}
.ri:hover{background:var(--stone20);}
.ri-icon{width:28px;height:28px;border-radius:var(--r4);background:var(--mauve);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px;}
.ri-body{flex:1;min-width:0;}
.ri-ref{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ri-sub{font-size:11px;color:var(--muted);}
.ri-amt{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;}
.btn-ri{padding:3px 9px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);margin-top:3px;}
.btn-ri:hover{background:#6810cc;}
/* split lines */
.split-total-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--border);margin-top:4px;font-size:12px;}
.split-rem{font-weight:600;}
.split-rem.ok{color:var(--green);}
.split-rem.over{color:var(--red);}
.split-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:var(--stone20);border-radius:var(--r8);margin-bottom:6px;position:relative;}
.split-row-num{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;}
.split-inp{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-family:var(--font);outline:none;background:#fff;box-sizing:border-box;}
.split-inp:focus{border-color:var(--lavender);}
.split-inp.full{grid-column:1/-1;}
.split-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0;}
.split-del:hover{color:var(--red);}
.btn-add-line{padding:5px 12px;background:#fff;color:var(--purple);border:1px solid var(--lavender);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);width:100%;margin:4px 0 10px;}
.btn-add-line:hover{background:var(--mauve);}
.btn-commit{width:100%;padding:10px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:8px;}
.btn-commit:hover{background:#6810cc;}
.ai-split-banner{background:var(--mauve);border:1px solid var(--lavender);border-radius:var(--r8);padding:10px 12px;margin-bottom:12px;}
.ai-split-banner-head{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:3px;}
.ai-split-banner-body{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:8px;}
.ai-split-btns{display:flex;gap:6px;}
.btn-asp-acc{padding:4px 11px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-asp-dis{padding:4px 10px;background:#fff;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:11px;cursor:pointer;font-family:var(--font);}
/* attachment panel — pinned bottom of aside */
.attach-panel{border-top:1px solid var(--border);background:#fff;flex-shrink:0;}
.attach-panel-hd{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;cursor:pointer;user-select:none;}
.attach-panel-hd:hover{background:var(--stone20);}
.attach-panel-title{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
.attach-chev{font-size:10px;color:var(--muted);transition:transform .2s;}
.attach-chev.open{transform:rotate(180deg);}
.attach-panel-body{padding:0 16px 12px;display:flex;flex-direction:column;gap:7px;}
.attach-file{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r8);background:var(--stone20);}
.attach-file-icon{width:28px;height:28px;border-radius:var(--r4);background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.attach-file-name{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attach-file-badge{font-size:9px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);border-radius:var(--r99);padding:1px 5px;font-weight:600;flex-shrink:0;}
.btn-att-prev{padding:3px 8px;background:#fff;border:1px solid var(--border);border-radius:var(--r4);font-size:11px;cursor:pointer;font-family:var(--font);flex-shrink:0;}
.btn-att-prev:hover{border-color:var(--purple);color:var(--purple);}
.attach-upload{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1.5px dashed var(--border);border-radius:var(--r8);color:var(--muted);font-size:12px;cursor:pointer;margin-top:2px;}
.attach-upload:hover{border-color:var(--purple);color:var(--purple);background:var(--mauve);}
/* attach preview modal overlay */
.att-prev-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;display:flex;align-items:center;justify-content:center;}
.att-prev-card{background:#fff;border-radius:12px;padding:20px;width:340px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.att-prev-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.att-prev-title{font-size:14px;font-weight:600;}
.att-prev-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
.att-prev-body{background:var(--stone20);border-radius:var(--r8);padding:24px;text-align:center;margin-bottom:12px;}
.att-prev-foot{display:flex;justify-content:flex-end;gap:8px;}
.btn-att-dl{padding:5px 12px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-att-can{padding:5px 11px;background:#fff;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);}

/* toast action buttons */
.toast-title{font-weight:600;font-size:13px;margin-bottom:3px;}
.toast-msg{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4;}
.toast-foot{display:flex;gap:6px;margin-top:6px;}
.btn-toast-yes{padding:4px 12px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-toast-yes:hover{background:#6810cc;}
.btn-toast-no{padding:4px 10px;background:#fff;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);}

/* ── SETTINGS ────────────────────────────────────── */
.stg{max-width:700px;}
.stg-back{display:flex;align-items:center;gap:6px;color:var(--purple);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:18px;}
.stg-back:hover{text-decoration:underline;}
.stg-title{font-size:22px;font-weight:700;margin-bottom:4px;}
.stg-sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
/* automatch master block */
/* settings overview */
.stg-overview-list{background:#fff;border:1px solid var(--border);border-radius:var(--r8);overflow:hidden;margin-bottom:24px;}
.stg-ov-item{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border);}
.stg-ov-item:last-child{border-bottom:none;}
.stg-ov-item:hover{background:var(--stone20);}
.stg-ov-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;}
.stg-ov-icon.purple{background:var(--mauve);}
.stg-ov-icon.blue{background:#E8F0FB;}
.stg-ov-icon.green{background:var(--green-bg);}
.stg-ov-body{flex:1;min-width:0;}
.stg-ov-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;}
.stg-ov-desc{font-size:12px;color:var(--muted);line-height:1.4;}
.stg-ov-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.stg-ov-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.stg-ov-pill.on{background:var(--green-bg);color:var(--green);}
.stg-ov-pill.off{background:var(--stone20);color:var(--muted);}
.stg-ov-pill.count{background:var(--mauve);color:var(--purple);}
.stg-ov-chev{color:var(--muted);font-size:13px;}
.stg-overview-intro{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
/* sub-page back nav */
.stg-sub-back{display:flex;align-items:center;gap:6px;color:var(--purple);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:18px;}
.stg-sub-back:hover{text-decoration:underline;}
.am-block{background:#fff;border:1px solid var(--border);border-radius:var(--r8);margin-bottom:22px;overflow:hidden;}
.am-master-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:18px 20px;}
.am-master-left{flex:1;min-width:0;}
.am-master-title{font-size:15px;font-weight:700;margin-bottom:5px;color:var(--text);}
.am-master-desc{font-size:13px;color:var(--muted);line-height:1.55;}
.am-master-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px;}
.am-tog-label{font-size:13px;color:var(--muted);font-weight:500;}
.am-tog-label.on{color:var(--purple);font-weight:600;}
/* bigger toggle for master */
.tog-lg{position:relative;width:44px;height:24px;flex-shrink:0;}
.tog-lg input{opacity:0;width:0;height:0;}
.tog-lg .tog-s{position:absolute;inset:0;border-radius:12px;cursor:pointer;transition:.2s;}
.tog-lg input:not(:checked)+.tog-s{background:#ccc;}
.tog-lg input:checked+.tog-s{background:var(--purple);}
.tog-lg .tog-s::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tog-lg input:checked+.tog-s::before{transform:translateX(20px);}
/* sub-toggle rows */
.am-divider{border:none;border-top:1px solid var(--border);margin:0;}
.am-sub-section{padding:4px 0;}
.am-sub-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px 20px;}
.am-sub-row+.am-sub-row{border-top:1px solid var(--border);}
.am-sub-left{flex:1;}
.am-sub-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
.am-sub-desc{font-size:12px;color:var(--muted);line-height:1.45;}
.am-sub-row.am-dim{opacity:.4;pointer-events:none;}
/* dim entire detail section when master off */
.am-detail-dim{opacity:.35;pointer-events:none;user-select:none;}
/* save settings footer */
.stg-footer{display:flex;justify-content:flex-end;padding-top:20px;border-top:1px solid var(--border);margin-top:24px;}
.btn-save-stg{padding:9px 22px;background:var(--green);color:#fff;border:none;border-radius:var(--r4);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-save-stg:hover{background:#0a6640;}
/* context cards */
.ctx-empty{text-align:center;padding:36px 20px;color:var(--muted);}
.ctx-empty-icon{font-size:28px;margin-bottom:8px;}
.ctx-empty-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;}
.ctx-empty-sub{font-size:12px;line-height:1.5;}
.ctx-card{background:#fff;border:1px solid var(--border);border-radius:var(--r8);padding:14px 16px;margin-bottom:10px;}
.ctx-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.ctx-entity{font-size:14px;font-weight:700;color:var(--text);margin-left:6px;}
.ctx-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ctx-count{font-size:11px;font-weight:700;background:var(--mauve);color:var(--purple);padding:2px 7px;border-radius:var(--r99);}
.ctx-val{font-size:13px;color:var(--text);margin-bottom:4px;}
.ctx-val strong{color:var(--purple);}
.ctx-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ctx-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.ctx-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
.ctx-edit-form{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.ctx-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.ctx-edit-label{font-size:11px;font-weight:600;color:var(--muted);width:56px;flex-shrink:0;text-transform:uppercase;letter-spacing:.03em;}
.ctx-edit-inp{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-family:var(--font);outline:none;}
.ctx-edit-inp:focus{border-color:var(--lavender);}
.ctx-edit-btns{display:flex;gap:6px;justify-content:flex-end;}
.btn-ctx-save{padding:5px 12px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-ctx-cancel{padding:5px 10px;background:#fff;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);color:var(--text);}
.ctx-intro{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:16px;padding:10px 12px;background:var(--mauve);border:1px solid var(--lavender);border-radius:var(--r8);}
/* ─── Receipt thumbnail ─── */
.att-thumb-wrap{display:flex;align-items:center;gap:6px;position:relative;}
.att-thumb{width:44px;height:56px;background:#fff;border:1px solid var(--border);border-radius:4px;overflow:hidden;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-shrink:0;position:relative;}
.att-thumb:hover{border-color:var(--lavender);box-shadow:0 2px 8px rgba(123,20,239,.15);}
.att-thumb-inner{padding:3px;font-size:0;line-height:1;}
.att-line{height:2px;background:#e5e5e5;border-radius:1px;margin-bottom:2px;}
.att-line.dark{background:#999;}
.att-line.short{width:60%;}
.att-line.hl{background:#fde047;}
.att-line.hl-green{background:#86efac;}
.att-more{font-size:10px;font-weight:600;color:var(--purple);cursor:pointer;white-space:nowrap;}
.att-hover-tip{position:absolute;top:-8px;left:52px;z-index:200;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;width:240px;box-shadow:0 8px 24px rgba(0,0,0,.15);pointer-events:none;}
.att-hover-tip.show{pointer-events:auto;}
.att-hov-receipt{width:100%;height:120px;background:#fafafa;border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:8px;overflow:hidden;}
.att-hov-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:2px;}
.att-hov-fields{display:flex;flex-direction:column;gap:2px;}
.att-hov-field{display:flex;align-items:center;gap:6px;font-size:11px;}
.att-hov-lbl{color:var(--muted);width:52px;flex-shrink:0;}
.att-hov-val{font-weight:500;color:var(--text);}
.att-hov-match{font-size:10px;color:var(--green);font-weight:600;}
/* ─── Attachment modal ─── */
.att-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:310;display:flex;align-items:center;justify-content:center;padding:24px;}
.att-modal{background:#fff;border-radius:14px;width:820px;max-height:90vh;display:flex;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25);}
.att-modal-left{flex:1;padding:28px;overflow-y:auto;border-right:1px solid var(--border);}
.att-modal-right{width:300px;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex-shrink:0;}
.att-modal-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:var(--stone20);border:none;cursor:pointer;font-size:18px;color:var(--muted);}
.receipt-full{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:16px;font-size:12px;line-height:1.7;position:relative;}
.rcpt-vendor{font-size:14px;font-weight:700;text-align:center;margin-bottom:4px;}
.rcpt-addr{font-size:11px;color:var(--muted);text-align:center;margin-bottom:12px;}
.rcpt-divider{border:none;border-top:1px dashed var(--border);margin:8px 0;}
.rcpt-row{display:flex;justify-content:space-between;font-size:12px;padding:1px 0;}
.rcpt-row.hl{background:#fef9c3;border-radius:3px;padding:2px 4px;margin:0 -4px;}
.rcpt-row.hl-green{background:#dcfce7;border-radius:3px;padding:2px 4px;margin:0 -4px;}
.rcpt-total{font-size:14px;font-weight:700;display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:2px solid var(--text);}
.rcpt-hl-badge{position:absolute;right:-10px;background:var(--purple);color:#fff;font-size:9px;font-weight:700;border-radius:var(--r99);padding:1px 6px;white-space:nowrap;}
.att-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;}
.att-extracted-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.att-extracted-row:last-child{border-bottom:none;}
.att-extracted-lbl{color:var(--muted);font-size:12px;}
.att-extracted-val{font-weight:600;}
.att-match-status{background:var(--green-bg);border:1px solid var(--green-border);border-radius:8px;padding:10px 12px;}
.att-match-status.warn{background:var(--amber-bg);border-color:var(--amber-border);}
.att-reassign-opts{display:flex;flex-direction:column;gap:6px;}
.btn-att-confirm{padding:8px 14px;background:var(--green);color:#fff;border:none;border-radius:var(--r8);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);text-align:left;}
.btn-att-confirm:hover{background:#0a6640;}
.btn-att-reassign{padding:8px 14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r8);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);text-align:left;}
.btn-att-reassign:hover{background:#6309d4;}
.btn-att-invoice{padding:8px 14px;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:var(--r8);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);text-align:left;}
.btn-att-invoice:hover{background:var(--stone20);}
.btn-att-reject{padding:8px 14px;background:var(--red-bg);color:var(--red);border:1px solid #fca5a5;border-radius:var(--r8);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);text-align:left;}
.btn-att-reject:hover{background:#fee2e2;}
/* ─── Rule detail modal ─── */
.rdm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.rdm{background:#fff;border-radius:14px;width:700px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.22);overflow:hidden;}
.rdm-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.rdm-head-left{flex:1;}
.rdm-rule-name{font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;}
.rdm-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--stone20);cursor:pointer;font-size:18px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rdm-close:hover{background:var(--border);}
.rdm-body{flex:1;overflow-y:auto;padding:24px;}
.rdm-section{margin-bottom:24px;}
.rdm-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;}
.rdm-cond-grid{display:flex;flex-direction:column;gap:6px;}
.rdm-cond-row{display:flex;align-items:center;gap:6px;}
.rdm-cond-lbl{font-size:11px;font-weight:700;color:var(--muted);width:44px;text-transform:uppercase;letter-spacing:.04em;}
/* activity table */
.act-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.act-head{display:grid;grid-template-columns:180px 130px 1fr 1fr;gap:0;padding:8px 14px;background:var(--stone20);border-bottom:1px solid var(--border);}
.act-head span{font-size:11px;font-weight:600;color:var(--muted);}
.act-row{display:grid;grid-template-columns:180px 130px 1fr 1fr;gap:0;padding:11px 14px;border-bottom:1px solid var(--border);align-items:flex-start;}
.act-row:last-child{border-bottom:none;}
.act-row:hover{background:var(--stone20);}
.act-cell{font-size:12px;color:var(--text);line-height:1.4;padding-right:10px;}
.act-cell.muted{color:var(--muted);}
.act-datetime{display:flex;flex-direction:column;gap:1px;}
.act-date{font-size:12px;font-weight:500;}
.act-time-sched{font-size:11px;color:var(--muted);}
.act-user-sys{display:flex;align-items:center;gap:5px;}
.act-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.act-dot.system{background:var(--purple);}
.act-dot.user{background:var(--green);}
.act-tx-link{color:var(--purple);text-decoration:underline;cursor:pointer;font-weight:500;}
.act-tx-link:hover{color:#5a0cb5;}
.act-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px;}
/* ─── Settings hub ─── */
.hub{padding:0;}
.hub-header{padding:22px 24px 0;margin-bottom:20px;}
.hub-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;}
.hub-sub{font-size:13px;color:var(--muted);}
.hub-sections{display:flex;flex-direction:column;gap:24px;padding:0 24px 40px;}
.hub-group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;}
.hub-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.hub-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px;}
.hub-card:hover{border-color:var(--lavender);box-shadow:0 2px 12px rgba(123,20,239,.08);}
.hub-card.ai-card{border-color:var(--lavender);background:linear-gradient(135deg,#fff 60%,var(--mauve));}
.hub-card-icon{font-size:20px;margin-bottom:2px;}
.hub-card-title{font-size:14px;font-weight:600;color:var(--text);}
.hub-card-desc{font-size:12px;color:var(--muted);line-height:1.5;}
.hub-card-meta{font-size:11px;color:var(--purple);font-weight:500;margin-top:2px;}
.hub-placeholder{background:#fff;border-radius:12px;border:1px solid var(--border);padding:40px;text-align:center;color:var(--muted);}
.hub-placeholder-icon{font-size:32px;margin-bottom:10px;}
/* ─── Business context page ─── */
.biz-ctx-page{max-width:680px;}
.biz-ctx-header{display:flex;align-items:baseline;gap:10px;margin-bottom:20px;}
.biz-ctx-title{font-size:22px;font-weight:700;color:var(--text);}
.biz-ctx-updated{font-size:12px;color:var(--muted);}
.biz-ctx-intro{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:24px;padding:12px 14px;background:var(--mauve);border:1px solid var(--lavender);border-radius:10px;}
.biz-ctx-sections{display:flex;flex-direction:column;gap:0;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.biz-ctx-section{padding:18px 20px;border-bottom:1px solid var(--border);position:relative;}
.biz-ctx-section:last-child{border-bottom:none;}
.biz-ctx-section:hover .biz-ctx-edit-btn{opacity:1;}
.biz-ctx-sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;}
.biz-ctx-sec-text{font-size:13px;color:#3a3a3a;line-height:1.65;}
.biz-ctx-edit-btn{position:absolute;top:14px;right:16px;opacity:0;transition:opacity .15s;padding:3px 10px;font-size:11px;background:#fff;border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-family:var(--font);}
.biz-ctx-edit-btn:hover{color:var(--purple);border-color:var(--lavender);}
.biz-ctx-edit-area{width:100%;margin-top:8px;padding:8px 10px;font-size:13px;font-family:var(--font);border:1px solid var(--lavender);border-radius:8px;line-height:1.6;resize:vertical;min-height:80px;outline:none;color:var(--text);box-sizing:border-box;}
.biz-ctx-edit-area:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--mauve);}
.biz-ctx-edit-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;}
.biz-ctx-nl-bar{background:#fff;border:1px solid var(--border);border-radius:12px;padding:4px 4px 4px 16px;display:flex;align-items:center;gap:8px;transition:border-color .15s;}
.biz-ctx-nl-bar:focus-within{border-color:var(--lavender);box-shadow:0 0 0 3px var(--mauve);}
.biz-ctx-nl-inp{flex:1;border:none;outline:none;font-size:13px;font-family:var(--font);color:var(--text);background:transparent;padding:8px 0;}
.biz-ctx-nl-inp::placeholder{color:#aaa;}
.biz-ctx-nl-send{width:34px;height:34px;border-radius:50%;background:var(--purple);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.biz-ctx-nl-send:hover{background:#6309d4;}
.biz-ctx-nl-send svg{width:14px;height:14px;fill:#fff;}
.biz-ctx-nl-hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center;}
.biz-ctx-thinking{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--purple);padding:10px 14px;background:var(--mauve);border-radius:8px;margin-bottom:10px;}
/* ─── Preferences section (Figma) ─── */
.pref-section{background:#fff;border-radius:12px;padding:20px;margin-bottom:28px;}
.pref-master{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:16px;}
.pref-master-left{flex:1;}
.pref-master-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px;}
.pref-master-desc{font-size:14px;color:var(--muted);line-height:1.55;max-width:640px;}
.pref-master-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px;}
.pref-tog-label{font-size:13px;color:var(--muted);}
.pref-tog-label.on{color:var(--text);font-weight:500;}
.pref-divider{border:none;border-top:1px solid var(--border);margin:0 0 20px;}
.pref-sub-rows{display:flex;flex-direction:column;gap:20px;}
.pref-sub-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
.pref-sub-row.dim{opacity:.4;pointer-events:none;}
.pref-sub-left{flex:1;max-width:640px;}
.pref-sub-name{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px;}
.pref-new-badge{font-size:11px;font-weight:500;background:#c5fbdf;color:#006629;padding:2px 8px;border-radius:10px;}
.pref-help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:10px;font-weight:700;cursor:help;flex-shrink:0;}
.pref-sub-desc{font-size:13px;color:var(--muted);line-height:1.5;}
.pref-sub-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px;}
.pref-footer{display:flex;justify-content:flex-end;padding-top:20px;border-top:1px solid var(--border);margin-top:24px;}

/* ─── AI memory section ─── */
.mem-section-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:14px;letter-spacing:.01em;}
.mem-filter-row{display:flex;align-items:center;gap:6px;margin-bottom:14px;}
.mem-fc{padding:5px 14px;border:1px solid var(--border);border-radius:20px;background:#fff;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .12s;}
.mem-fc:hover{background:var(--stone20);}
.mem-fc.act{background:var(--purple);color:#fff;border-color:var(--purple);}
.mem-list{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.mem-entry{padding:16px 20px;border-bottom:1px solid var(--border);}
.mem-entry:last-child{border-bottom:none;}
.mem-entry.inactive{opacity:.55;}
.mem-entry-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.mem-entry-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mem-src-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.mem-src-badge.rule{background:var(--mauve);color:var(--purple);}
.mem-src-badge.learned{background:var(--green-bg);color:var(--green);}
.mem-src-badge.rejected{background:#FDECEA;color:var(--red);}
.mem-entity{font-size:14px;font-weight:600;color:var(--text);}
.mem-action-summary{font-size:13px;color:var(--muted);}
.mem-entry-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.mem-applied{font-size:11px;color:var(--muted);white-space:nowrap;}
.mem-cond-block{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.mem-cond-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.mem-cond-label{font-size:11px;font-weight:600;color:var(--muted);width:44px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;}
.mem-pill{font-size:11px;padding:2px 8px;background:var(--stone20);border:1px solid var(--border);border-radius:4px;color:var(--text);white-space:nowrap;}
.mem-pill.rejected-val{background:#FDECEA;border-color:#fca5a5;color:var(--red);text-decoration:line-through;}
.mem-pill-op{font-size:10px;font-weight:700;padding:2px 6px;background:#fff;border:1px solid var(--border);border-radius:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.mem-entry-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.mem-edit-form{background:var(--stone20);border-radius:8px;padding:12px;margin-top:10px;}
.mem-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.mem-edit-label{font-size:11px;font-weight:600;color:var(--muted);width:64px;flex-shrink:0;text-transform:uppercase;letter-spacing:.03em;}
.mem-edit-inp{flex:1;padding:6px 9px;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-family:var(--font);outline:none;background:#fff;}
.mem-edit-inp:focus{border-color:var(--lavender);}
.mem-edit-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;}
.mem-empty{text-align:center;padding:40px 20px;color:var(--muted);}
.mem-empty-icon{font-size:28px;margin-bottom:8px;}

/* ─── Action required section ─── */
.ar-section{margin-bottom:20px;}
.ar-heading{font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px;}
.ar-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.ar-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s;}
.ar-card:hover{border-color:var(--lavender);}
.ar-card-dim{opacity:.55;cursor:default;}
.ar-card-dim:hover{border-color:var(--border);}
.ar-card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
.ar-card-body{font-size:12px;color:var(--muted);line-height:1.55;}
.ar-card-cta{font-size:12px;font-weight:600;color:var(--purple);margin-top:6px;}
/* ─── Shared filter bar ─── */
.fbar2{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.fbar2-search{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border:1px solid var(--border);border-radius:var(--r8);flex:0 0 220px;}
.fbar2-search input{border:none;outline:none;font-size:12px;font-family:var(--font);color:var(--text);background:transparent;width:100%;}
.fbar2-date{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border:1px solid var(--border);border-radius:var(--r8);font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.fbar2-reset{font-size:12px;color:var(--purple);cursor:pointer;font-weight:500;padding:4px;}
.fbar2-sp{flex:1;}
.fbar2-ico{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border:1px solid var(--border);background:#fff;}
.fbar2-ico:hover{background:var(--stone20);}
.fpill-row{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.fpill{padding:5px 12px;border:1px solid var(--border);border-radius:var(--r99);background:#fff;font-size:12px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;}
.fpill:hover{background:var(--stone20);}
.fpill .arr{opacity:.5;}
/* ─── Scope pills (review tab) ─── */
.scope-pill-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.scope-pill{padding:5px 14px;border:1px solid var(--border);border-radius:var(--r99);background:#fff;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .12s;}
.scope-pill:hover{background:var(--stone20);}
.scope-pill.act{background:var(--purple);color:#fff;border-color:var(--purple);}
.scope-pill .scope-ct{font-size:11px;background:rgba(255,255,255,.25);border-radius:var(--r99);padding:0px 6px;font-weight:600;}
.scope-pill:not(.act) .scope-ct{background:var(--mauve);color:var(--purple);}
/* ─── All-tab table ─── */
.all-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.all-tbl th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:#fff;}
.all-tbl th.r{text-align:right;}
.all-tbl th .sort-ico{display:inline-block;margin-left:3px;opacity:.5;font-size:9px;}
.all-tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.all-tbl tr:last-child td{border-bottom:none;}
.all-tbl tr:hover td{background:var(--stone20);cursor:pointer;}
.all-tbl tr:hover .unmatch-btn{opacity:1;pointer-events:auto;}
.unmatch-btn{opacity:0;pointer-events:none;transition:opacity .15s;padding:3px 9px;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:var(--r4);color:var(--muted);cursor:pointer;font-family:var(--font);white-space:nowrap;}
.unmatch-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);}
.status-cell{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tx-ref{font-size:13px;font-weight:600;color:var(--text);}
.tx-bank{font-size:11px;color:var(--muted);margin-top:1px;}
.tx-icon{width:30px;height:30px;border-radius:8px;background:var(--mauve);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.tx-icon.green{background:var(--green-bg);}
.tax-cell{font-size:12px;color:var(--muted);}
.tax-code{font-weight:600;color:var(--text);}
.match-cell{font-size:12px;color:var(--muted);}
.match-val{font-size:13px;font-weight:500;color:var(--text);}
.match-acct{font-size:11px;color:var(--muted);margin-top:1px;}
/* Status pills */
.sp{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r99);font-size:11px;font-weight:600;white-space:nowrap;}
.sp.matched{background:var(--green-bg);color:var(--green);}
.sp.match-found{background:var(--mauve);color:var(--purple);}
.sp.awaiting{background:var(--amber-bg);color:var(--amber);}
.sp.coded{background:var(--green-bg);color:var(--green);}
/* ─── Review-tab suggestion cell ─── */
.sug-cell{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;position:relative;min-width:220px;}
.sug-conf{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--purple);font-weight:500;margin-bottom:4px;}
.sug-conf-star{font-size:10px;}
.sug-why{color:var(--purple);text-decoration:underline;cursor:pointer;font-weight:600;}
.sug-name{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:4px;}
.sug-acct{font-size:11px;color:var(--muted);margin-top:2px;}
.sug-actions{display:flex;gap:6px;margin-top:8px;}
.btn-sug-acc{padding:3px 10px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-sug-acc:hover{background:#c3e6d5;}
.btn-sug-rej{padding:3px 10px;background:var(--red-bg);color:var(--red);border:1px solid #f5a9a2;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-sug-rej:hover{background:#f7c7c3;}

/* rule wizard */
.rwiz{max-width:560px;}
.rwiz-steps{display:flex;align-items:center;margin-bottom:28px;}
.rwiz-step{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.rwiz-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.rwiz-num.done{background:var(--green);color:#fff;}
.rwiz-num.active{background:var(--purple);color:#fff;}
.rwiz-num.idle{background:var(--stone20);color:var(--muted);border:1px solid var(--border);}
.rwiz-label{font-size:12px;font-weight:500;}
.rwiz-label.active{color:var(--text);font-weight:600;}
.rwiz-label.done{color:var(--green);}
.rwiz-label.idle{color:var(--muted);}
.rwiz-connector{flex:1;height:1px;background:var(--border);margin:0 8px;min-width:12px;}
.rwiz-connector.done{background:var(--green);}
/* step 1 type cards */
.rtype-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px;}
.rtype-card{background:#fff;border:2px solid var(--border);border-radius:var(--r8);padding:20px 14px 16px;cursor:pointer;text-align:center;transition:all .15s;}
.rtype-card:hover{border-color:var(--lavender);background:var(--mauve);}
.rtype-card.sel{border-color:var(--purple);background:var(--mauve);}
.rtype-icon{font-size:26px;margin-bottom:8px;}
.rtype-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;}
.rtype-desc{font-size:11px;color:var(--muted);line-height:1.45;}
/* step 2 conditions */
.cond-and-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
.cond-and{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;background:var(--stone20);border-radius:4px;flex-shrink:0;}
.cond-row{display:flex;align-items:center;gap:7px;background:var(--stone20);border:1px solid var(--border);border-radius:var(--r8);padding:10px 12px;}
.cond-sel{padding:5px 7px;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-family:var(--font);background:#fff;cursor:pointer;outline:none;color:var(--text);}
.cond-sel:focus{border-color:var(--lavender);}
.cond-inp{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-family:var(--font);outline:none;background:#fff;min-width:0;}
.cond-inp:focus{border-color:var(--lavender);}
.cond-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px;line-height:1;flex-shrink:0;}
.cond-del:hover{color:var(--red);}
.btn-add-cond{background:none;border:none;color:var(--purple);font-size:12px;font-weight:600;cursor:pointer;padding:8px 0 0;font-family:var(--font);display:block;}
.btn-add-cond:hover{text-decoration:underline;}
/* step 3 action */
.act-field{margin-bottom:16px;}
.act-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.03em;}
.act-sel,.act-inp{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r4);font-size:13px;font-family:var(--font);background:#fff;outline:none;box-sizing:border-box;}
.act-sel:focus,.act-inp:focus{border-color:var(--lavender);}
/* step 4 review */
.rwiz-summary{background:var(--stone20);border:1px solid var(--border);border-radius:var(--r8);padding:16px 18px;margin-bottom:20px;}
.rwiz-sum-row{display:flex;gap:12px;margin-bottom:8px;font-size:13px;line-height:1.45;}
.rwiz-sum-row:last-child{margin-bottom:0;}
.rwiz-sum-label{font-weight:700;color:var(--muted);width:44px;flex-shrink:0;padding-top:1px;}
.rwiz-sum-val{color:var(--text);}
.rwiz-name-input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r4);font-size:14px;font-weight:600;font-family:var(--font);outline:none;box-sizing:border-box;margin-bottom:16px;}
.rwiz-name-input:focus{border-color:var(--lavender);}
/* wizard footer */
.rwiz-footer{display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--border);margin-top:24px;}
.btn-wiz-cancel{padding:8px 16px;background:#fff;border:1px solid var(--border);border-radius:var(--r4);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);color:var(--text);}
.btn-wiz-cancel:hover{background:var(--stone20);}
.btn-wiz-back{padding:8px 16px;background:#fff;border:1px solid var(--border);border-radius:var(--r4);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);color:var(--purple);}
.btn-wiz-back:hover{background:var(--mauve);}
.btn-wiz-next{padding:8px 22px;background:var(--purple);color:#fff;border:none;border-radius:var(--r4);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-wiz-next:hover{background:#6810cc;}
.btn-wiz-next:disabled{opacity:.35;cursor:not-allowed;}
.btn-wiz-save{padding:8px 22px;background:var(--green);color:#fff;border:none;border-radius:var(--r4);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}

.stg-tab:hover{color:var(--text);}
.stg-tab.act{background:var(--purple);color:#fff;}
.stg-tab-ct{font-size:11px;padding:1px 6px;border-radius:var(--r99);background:rgba(255,255,255,.25);font-weight:700;}
.stg-tab:not(.act) .stg-tab-ct{background:var(--mauve);color:var(--purple);}

.cl-future{margin-top:8px;padding:8px 10px;background:#fffbf0;border:1px solid #fde68a;border-radius:var(--r4);font-size:11px;color:#92400e;line-height:1.5;}

.tog-s::before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;}
.tog input:checked+.tog-s{background:var(--purple);}

@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn .2s ease;}
.divider{height:1px;background:var(--border);margin:10px 0;}
.match-link{color:var(--purple);text-decoration:none;font-weight:500;}

      const amt=Math.abs(tx.amount);
      const gst=+(amt/11).toFixed(2);
      entries.push({
        id:`att-${tx.id}-${i}`,
        name:names[i%names.length],
        vendor,
        extractedAmt:amt,
        extractedGst:gst,
        extractedDate:tx.date,

        confidence:88+((tx.id+i)%10),
        fields:['vendor','amount','date','gst'], // highlighted fields in preview
      });
    }
    ATTACH_DATA[tx.id]=entries;
  });
}

function fmt(n){const a=Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');return n<0?`-$${a}`:`+$${a}`;}
function fmtAbs(n){return '$'+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function ftx(id){return TX.find(t=>t.id===id);}
function confCls(c){return c>=85?'fill-hi':c>=65?'fill-md':'fill-lo';}
function confPct(c){return c>=85?'hi':'md';}
function srcBadge(src){
  if(src==='bank') return `<span class="src src-bank">⬡ Bank feed</span>`;
  if(src==='myob') return `<span class="src src-myob">m MYOB record</span>`;
  return `<span class="src src-both">✓ Matched</span>`;
}
function statusChip(tx){
  if(tx.status==='accepted'||tx.status==='coded') return `<span class="chip chip-acc">✓ Coded</span>`;
  if(tx.status==='awaiting') return `<span class="chip chip-wait">⏳ Awaiting bank</span>`;
  if(tx.newContext) return `<span class="chip chip-upd">⚡ Receipt received</span>`;
  const hasM=MATCHES[tx.id]&&MATCHES[tx.id].length;
  return hasM?`<span class="chip chip-match">≈ Match found</span>`:`<span class="chip chip-pend">· Not matched</span>`;
}
function bankLabel(b){
  const acc=BANKS.find(a=>a.id===b);
  return acc?`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)"><span style="width:7px;height:7px;border-radius:50%;background:${acc.dot};flex-shrink:0"></span>${acc.label}</span>`:'';
}
function pendingList(){return TX.filter(t=>t.status==='pending'&&(S.bankFilter==='all'||t.bank===S.bankFilter));}
function ctxList(){return TX.filter(t=>t.newContext&&!S.dismissedCtx.has(t.id)&&(S.bankFilter==='all'||t.bank===S.bankFilter));}
function allPending(){return TX.filter(t=>t.status==='pending').length;}
function ctxCount(){return TX.filter(t=>t.newContext&&!S.dismissedCtx.has(t.id)).length;}
function reviewCount(){return pendingList().length + ctxList().length;}

/* ── Rule wizard ── */
function startCreateRule(){
  S.ruleWiz={step:1,type:null,conditions:[{id:1,field:'payee',op:'contains',val:''}],action:{cat:'',tax:'GST',entity:''},name:'',nameAuto:true};
  render();
}
function wizNext(){if(S.ruleWiz)S.ruleWiz.step=Math.min(S.ruleWiz.step+1,4);render();}
function wizBack(){
  if(!S.ruleWiz)return;
  if(S.ruleWiz.step===1){S.ruleWiz=null;}
  else{S.ruleWiz.step--;}
  render();
}
function wizSetType(t){S.ruleWiz.type=t;wizNext();}
function wizAddCond(){S.ruleWiz.conditions.push({id:Date.now(),field:'payee',op:'contains',val:''});render();}
function wizRemoveCond(id){S.ruleWiz.conditions=S.ruleWiz.conditions.filter(c=>c.id!==id);render();}
function wizUpdateCond(id,key,val){
  const c=S.ruleWiz.conditions.find(c=>c.id===id);
  if(!c)return;
  c[key]=val;
  if(key==='field'){c.op=val==='amount'?'eq':'contains';}
  if(S.ruleWiz.nameAuto)wizAutoName();
  render();
}
function wizUpdateCondVal(id,val){
  const c=S.ruleWiz.conditions.find(c=>c.id===id);
  if(c)c.val=val;
  if(S.ruleWiz.nameAuto)wizAutoName();
  // no re-render — fires on change/blur
}
function wizUpdateAction(key,val){
  S.ruleWiz.action[key]=val;
  if(S.ruleWiz.nameAuto)wizAutoName();
  // no re-render for text inputs; selects call render manually
}
function wizUpdateActionRender(key,val){wizUpdateAction(key,val);render();}
function wizAutoName(){
  const w=S.ruleWiz;
  const pc=w.conditions.find(c=>c.field==='payee'&&c.val);
  const vend=pc?pc.val:'';
  if(w.type==='category'&&w.action.cat&&vend)      w.name=`${vend} → ${w.action.cat}`;
  else if(w.type==='invoice'&&w.action.entity)      w.name=`${w.action.entity} → Invoice match`;
  else if(w.type==='bill'&&w.action.entity)         w.name=`${w.action.entity} → Bill match`;
  else if(vend)                                     w.name=`Rule for ${vend}`;
  const el=document.getElementById('rwiz-name-inp');
  if(el)el.value=w.name;
}
function saveRule(){
  const w=S.ruleWiz;
  const nameEl=document.getElementById('rwiz-name-inp');
  if(nameEl)w.name=nameEl.value.trim();
  const condDesc=w.conditions.filter(c=>c.val).map(c=>{
    const fl={payee:'Payee',desc:'Description',amount:'Amount',account:'Bank account'}[c.field]||c.field;
    const ol={contains:'contains',is:'is exactly',starts:'starts with',eq:'=',gt:'>',lt:'<'}[c.op]||c.op;
    return `${fl} ${ol} "${c.val}"`;
  }).join(' AND ')||'(any transaction)';
  let action='';
  if(w.type==='category') action=`Assign "${w.action.cat||'?'}"${w.action.tax?' · '+w.action.tax:''}`;
  else if(w.type==='invoice') action=`Match to invoices${w.action.entity?' from '+w.action.entity:''}`;
  else action=`Match to bills${w.action.entity?' from '+w.action.entity:''}`;
  const newRule={
    id:Date.now(),name:w.name||'New rule',type:w.type,
    entity:w.type==='invoice'?'customer':'supplier',
    active:true,suggested:false,applied:0,last:'—',
    trigger:condDesc,action,rejections:0
  };
  S.rules.push(newRule);
  S.memory.push({id:newRule.id+1,source:'rule',memType:w.type==='category'?'category':'match',active:true,entity:w.conditions.find(c=>c.field==='payee')?.val||w.name,conditions:w.conditions,action:w.action,count:0,last:'—',note:''});

}

function getWhy(tx, field){
  const f=tx.ai[field]; if(!f||!f.val) return '';
  const vend=tx.desc.split(/\s[–\-]/)[0].trim();
  const c=f.conf; const cw=c>=90?'high':c>=75?'moderate':'lower';
  if(field==='cat'){
    if(c>=90) return `"${vend}" matches a saved rule or has been coded as "${f.val}" 3+ times recently. ${c}% confidence.`;
    return `Keywords in "${vend}" suggest "${f.val}". ${cw.charAt(0).toUpperCase()+cw.slice(1)} confidence — review before accepting.`;
  }
  if(field==='match') return `An open MYOB record was found matching the amount and date. Vendor name "${vend}" confirmed the link at ${c}% confidence.`;
  if(field==='tax'){
    if(c>=90) return `"${f.val}" applied from a saved rule or prior transactions with this vendor. Consistent coding pattern found.`;
    return `"${f.val}" inferred from the category default. ${cw.charAt(0).toUpperCase()+cw.slice(1)} confidence — verify if correct.`;
  }
  if(field==='job') return `Job "${f.val}" was active on the most recent similar transaction.${c<75?' Multiple active jobs reduce certainty.':' Confirmed by recent coding history.'}`;
  return 'AI suggestion based on transaction history and matching patterns.';
}

}

function rejectAC(txId, field){
  const tx=ftx(txId); if(!tx) return;
  const f=tx.ai[field];
  f.rejectedVal=f.val; f.st='rejected';
  // update matching rule rejection count if one exists
  const d=tx.desc.toLowerCase();
  const ruleMatch=S.rules.find(r=>{
    const kw=(r.trigger.match(/"([^"]+)"/)||[])[1];
    return kw&&d.includes(kw.toLowerCase());
  });
  if(ruleMatch){ ruleMatch.rejections=(ruleMatch.rejections||0)+1; ruleMatch.lastRejected=tx.date; }

  // Two-button persistent toast
  const toastId='rej'+Date.now();
  const typeLabel=field==='match'?'match suggestion':'category suggestion';
  const valLabel=f.rejectedVal||'this suggestion';
  const el=document.createElement('div');
  el.className='toast'; el.id=toastId;
  el.innerHTML=`
    <div class="toast-body" style="flex:1">
      <div class="toast-title">Suggestion rejected</div>
      <div class="toast-msg">Clear <strong>"${valLabel}"</strong> so it won't appear again for this transaction?</div>
      <div class="toast-foot">
        <button class="btn-toast-yes" onclick="addToClearList(${txId},'${field}');document.getElementById('${toastId}').remove()">Yes, clear it</button>
        <button class="btn-toast-no" onclick="document.getElementById('${toastId}').remove()">Not now</button>
      </div>
    </div>
    <button class="toast-x" onclick="document.getElementById('${toastId}').remove()">✕</button>`;
  document.getElementById('toasts').appendChild(el);
  render();
}

function undoRejectAC(txId, field){

function addToClearList(txId, field){

function addToContext(txId, field){
  const tx=ftx(txId); if(!tx) return;
  const f=tx.ai[field]; if(!f||!f.val) return;
  if(field!=='cat'&&field!=='match') return;
  const entity=tx.desc.split(/\s[–\-]/)[0].trim();
  const today=new Date();
  const ds=`${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
  const existing=S.context.find(c=>c.entity===entity&&c.learnedField===field);
  if(existing){existing.count++;existing.lastSeen=ds;existing.learnedVal=f.val;if(tx.ref&&!existing.txRefs.includes(tx.ref))existing.txRefs.push(tx.ref);}
  else{S.context.push({id:Date.now(),type:field==='cat'?'category':'match',entity,learnedVal:f.val,learnedField:field,tax:field==='cat'?(tx.ai.tax?.val||''):null,count:1,lastSeen:ds,active:true,note:'',txRefs:tx.ref?[tx.ref]:[]});}
  const memType=field==='cat'?'category':'match';
  const memEx=S.memory.find(m=>m.source==='learned'&&m.entity===entity&&m.memType===memType);
  if(memEx){memEx.count++;memEx.last=ds;if(memEx.memType==='category')memEx.action.cat=f.val;else memEx.action.entity=f.val;}
  else{S.memory.push({id:Date.now()+1,source:'learned',memType,active:true,entity,conditions:[{field:'payee',op:'contains',val:entity}],action:field==='cat'?{cat:f.val,tax:tx.ai.tax?.val||''}:{entity:f.val,matchType:'invoice'},count:1,last:ds,note:''});}
}

function acceptAC(txId,field){
  const tx=ftx(txId);
  const wasIdle=tx.ai[field].st==='idle';
  tx.ai[field].st='accepted';
  const allDone=Object.entries(tx.ai).every(([k,f])=>!f.val||f.st==='accepted'||k==='file');
  if(allDone) tx.status='coded';
  S.editingCard=null;
  if(wasIdle){addToContext(txId,field);showContextToast();}
  render();
  if(S.asideId===txId) setTimeout(()=>{document.getElementById('aside-inner').innerHTML=buildAsideContent();},30);
}

}

function acceptAllTx(txId){
  const tx=ftx(txId);
  let anyNew=false;
  Object.entries(tx.ai).forEach(([field,f])=>{
    if(f.val&&f.st!=='accepted'){addToContext(txId,field);anyNew=true;}
    if(f.val) f.st='accepted';
  });
  tx.status='coded';
  if(anyNew) showContextToast();
  render();
}

    return `<span style="color:#ccc">—</span>`;
  };
  const txIcon=tx=>{
    const first=tx.desc.charAt(0).toUpperCase();
    const isPos=tx.amount>0;
    return `<div class="tx-icon${isPos?' green':''}">${first}</div>`;
  };
  const sortIco=`<span class="sort-ico">↕</span>`;
  const needReview=pendingList().length;
  const summaryBanner=needReview>0?`
  <div style="background:var(--mauve);border:1px solid var(--lavender);border-radius:10px;padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px">
    <span style="font-size:13px">✦ <strong>${needReview} transactions</strong> need review — ${TX.filter(t=>t.ai.cat.val||t.ai.match.val).length} have AI suggestions ready</span>
    <button class="tb-link" style="margin-left:auto;flex-shrink:0" onclick="setTab('review')">Go to Review →</button>
  </div>`:''
  return `
  <div class="fade-in">
    ${summaryBanner}
    ${buildFilterBar()}
    <div class="card" style="padding:0;overflow:hidden">
      <table class="all-tbl">
        <thead>
          <tr>
            <th style="width:36px;padding:8px 12px"><input type="checkbox" style="width:13px;height:13px;accent-color:var(--purple)"></th>
            <th style="width:96px">Date ${sortIco}</th>
            <th>Transaction ${sortIco}</th>
            <th class="r" style="width:110px">Amount ($) ${sortIco}</th>
            <th style="width:36px;text-align:center">📎</th>
            <th style="width:80px">Tax ${sortIco}</th>
            <th style="width:200px">Match ${sortIco}</th>
            <th style="width:150px">Reconciled status ${sortIco}</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(tx=>`
          <tr onclick="openAside(${tx.id},'all','${(!tx.ai.match.val&&!tx.ai.cat.val)||tx.status==='coded'?'matches':'matches'}')">
            <td style="padding:8px 12px" onclick="event.stopPropagation()"><input type="checkbox" style="width:13px;height:13px;accent-color:var(--purple);cursor:pointer"></td>
            <td style="color:var(--muted);font-size:12px;white-space:nowrap">${tx.date}</td>
            <td>
              <div style="display:flex;align-items:center;gap:10px">
                ${txIcon(tx)}
                <div>
                  <div class="tx-ref">${tx.ref||tx.desc}</div>
                  <div class="tx-bank">${tx.desc}</div>
                </div>
              </div>
            </td>
            <td style="text-align:right"><span class="${tx.amount<0?'amt-neg':'amt-pos'}">${fmt(tx.amount)}</span></td>
            <td style="text-align:center">${attach(tx)}</td>
            <td class="tax-cell">
              <div class="tax-code">${tx.ai.tax.val||'—'}</div>
              ${tx.ai.tax.val&&tx.amount?`<div style="font-size:11px">${fmt(Math.abs(tx.amount)*0.1)}</div>`:''}
            </td>
            <td>${matchCell(tx)}</td>
            <td>${statusPill(tx)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

    ?`<div class="att-w"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.5 5.5l-4 4A2.8 2.8 0 112.5 5.5l4-4a1.5 1.5 0 012.1 2.1L4.5 7.7a.3.3 0 01-.4-.4l3.5-3.5"/></svg><span class="att-ct">${tx.attach}</span></div>`
