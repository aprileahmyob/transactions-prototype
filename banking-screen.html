.badge-sug{font-size:11px;background:var(--warning-bg);color:var(--warning);border-radius:var(--r4);padding:2px 8px;font-weight:600;}
.stg-sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.stg-sec-title{font-size:15px;font-weight:600;}
.btn-add-rule{padding:8px 16px;background:var(--success);color:#fff;border:none;border-radius:var(--r4);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);}

/* toast — Feelix inverse (Figma Smart Rec) */
.toast-container{position:fixed;bottom:24px;left:24px;z-index:300;display:flex;flex-direction:column-reverse;gap:12px;align-items:flex-start;pointer-events:none;}
.toast-container>*{pointer-events:auto;}
.fx-toast-inverse{background:#232428;color:#fff;border-radius:4px;min-width:200px;max-width:310px;width:max-content;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastIn .28s ease;font-family:var(--font);}
.fx-toast-inverse-row{display:flex;align-items:flex-start;gap:10px;padding:8px 8px 12px 12px;}
.fx-toast-inverse-ico{flex-shrink:0;padding-top:2px;line-height:0;}
.fx-toast-inverse-text{flex:1;margin:0;font-size:14px;line-height:20px;letter-spacing:.24px;color:#fff;font-weight:400;word-break:break-word;}
.fx-toast-inverse-link{background:none;border:none;padding:0;margin-left:6px;font-size:14px;line-height:20px;font-weight:500;color:#fff;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-family:var(--font);}
.fx-toast-inverse-link:hover{color:#e8e8ea;}
.fx-toast-inverse-close{background:none;border:none;color:#fff;opacity:.75;cursor:pointer;padding:2px;line-height:0;flex-shrink:0;border-radius:4px;}
.fx-toast-inverse-close:hover{opacity:1;background:rgba(255,255,255,.08);}
.fx-toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);padding:12px 16px;max-width:380px;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5;animation:toastIn .28s ease;}
.toast{background:#fff;border:1px solid var(--border);border-radius:var(--r8);padding:12px 16px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;align-items:flex-start;gap:10px;font-size:13px;animation:toastIn .28s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(8px);}}
.toast.toast-out{animation:toastOut .2s ease forwards;}
.toast-icon{font-size:16px;flex-shrink:0;}
.toast-body{flex:1;}
.toast-title{font-weight:600;margin-bottom:3px;}
.toast-foot{display:flex;gap:6px;margin-top:6px;}
.btn-ty{padding:6px 12px;background:var(--success);color:#fff;border:none;border-radius:var(--r4);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);}
.btn-tn{padding:4px 8px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font);}
.toast-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;}


/* ── Feelix alignment utilities ── */
.fx-label-ai{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--r4);background:var(--ai-bg);color:var(--ai-text);}
.btn-save-stg,.btn-att-confirm,.btn-toast-yes,.btn-att-dl,.btn-wiz-next,.btn-asp-acc{background:var(--success)!important;color:#fff!important;border:none!important;}
.btn-save-stg:hover,.btn-att-confirm:hover,.btn-toast-yes:hover,.btn-att-dl:hover,.btn-wiz-next:hover,.btn-asp-acc:hover{background:var(--success-hover)!important;}
.btn-asp-dis,.btn-att-can,.btn-att-invoice,.btn-ctx-cancel,.btn-ctx-keep,.btn-rc-skip,.btn-rc-detail{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--border)!important;}
.btn-att-reassign,.btn-asave,.btn-ctx-save{background:var(--success)!important;color:#fff!important;border:none!important;}
.btn-add-line,.btn-rc-detail{color:var(--purple)!important;border-color:var(--lavender)!important;background:var(--surface)!important;}
.mem-fc.act,.mem-fc.act:hover{background:var(--brand-subtle)!important;color:var(--purple)!important;border-color:var(--purple)!important;}
.rtbl-w tbody tr.tr-upd,.rtbl-w tbody tr.tr-done{background:transparent!important;}
.all-tbl th{font-size:12px;padding:10px 12px;}
.all-tbl td{padding:12px;font-size:14px;}
.hub-title,.stg-title,.biz-ctx-title,.pref-master-title{font-size:24px;font-family:var(--font-heading);font-weight:600;line-height:.95;}

.btn-asave,.btn-asp-acc,.btn-att-dl,.btn-toast-yes,.btn-wiz-next,.btn-add-rule,.btn-ty{background:var(--success)!important;color:#fff!important;}
.btn-toast-yes:hover,.btn-wiz-next:hover{background:var(--success-hover)!important;}
.stg-tabs,.stg-tab{display:flex;gap:0;border-bottom:1px solid var(--border);}
.stg-tab{padding:12px 16px;border:none;background:none;font-family:var(--font);font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.aside-head{padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
.aside-amt{font-size:24px;font-weight:600;}
.aside-footer,.rc-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);box-shadow:0 -4px 12px rgba(0,0,0,.06);}
.mf-count{color:var(--text);}
.btn-att-reassign{background:var(--success)!important;}
.btn-att-reassign:hover{background:var(--success-hover)!important;}
.biz-ctx-nl-send,.btn-ctx-save,.btn-asave{background:var(--success)!important;}

/* review inbox — transaction-centric */
.rev-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.rev-summary-main{flex:1;min-width:200px;}
.rev-summary-title{font-size:15px;font-weight:600;margin-bottom:2px;}
.rev-summary-sub{font-size:12px;color:var(--muted);line-height:1.5;}
.rev-summary-stats{display:flex;gap:10px;flex-wrap:wrap;}
.rev-stat{font-size:12px;padding:4px 10px;border-radius:var(--r4);background:var(--stone20);color:var(--muted);}
.rev-stat strong{color:var(--text);}
.rev-stat-ready{background:var(--success-bg);color:var(--success);}
.rev-stat-changed{background:var(--warning-bg);color:var(--warning);}
.readiness-strip{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px;}
.rdim{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:var(--r4);border:1px solid transparent;white-space:nowrap;}
.rdim-ready{background:var(--success-bg);color:var(--success);border-color:var(--success-border);}
.rdim-pending{background:var(--stone20);color:var(--muted);border-color:var(--border);}
.rdim-changed{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border);}
.rdim-blocked{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border);}
.rdim-none{opacity:.35;background:var(--stone20);color:var(--muted);}
.rev-row-actions{display:flex;align-items:center;gap:6px;justify-content:flex-end;white-space:nowrap;}
.all-tbl th.agent-col-h{background:var(--brand-subtle);color:var(--purple);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-left:1px solid var(--lavender);}
.all-tbl td.agent-col{background:var(--stone20);border-left:1px solid var(--border);vertical-align:middle;padding:10px 12px!important;min-width:120px;overflow:visible;}
.all-tbl td.agent-col.agent-accepted{background:var(--success-bg);}
.all-tbl td.agent-col.agent-empty{background:var(--stone20);}
.agent-col-tag{display:inline-block;font-size:9px;font-weight:700;background:var(--purple);color:#fff;border-radius:var(--r99);padding:1px 5px;margin-left:4px;vertical-align:middle;letter-spacing:.03em;}
.rev-agent-cell{display:flex;flex-direction:column;gap:4px;min-width:0;}
.rev-agent-cell.rev-att-cell{flex-direction:row;align-items:center;gap:10px;}
.rev-agent-val{font-size:12px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;}
.rev-agent-sub{font-size:11px;color:var(--muted);line-height:1.35;overflow:hidden;text-overflow:ellipsis;}
.rev-agent-manual{font-size:11px;color:#bbb;font-style:italic;}
.rev-inline-btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-weight:500;color:var(--purple);cursor:pointer;font-family:var(--font);white-space:nowrap;}
.rev-inline-btn:hover{background:var(--brand-subtle);border-color:var(--lavender);}
.rev-inline-sel{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:var(--r4);font-size:12px;font-family:var(--font);background:var(--surface);color:var(--text);cursor:pointer;}
.rev-mod-agent.rev-mod-manual{background:var(--surface);border:1px dashed var(--border);}
.rev-conf{display:inline-flex;align-items:center;gap:4px;margin-top:2px;}
.rev-conf-pct{font-size:10px;font-weight:700;cursor:help;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
.rev-att-preview{width:52px;height:60px;border-radius:6px;border:1px solid var(--border);overflow:hidden;background:#fff;flex-shrink:0;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.rev-att-preview:hover{border-color:var(--lavender);box-shadow:0 2px 6px rgba(0,0,0,.12);}
.rev-att-preview img{width:100%;height:100%;object-fit:cover;display:block;}
.rev-att-placeholder{width:52px;height:60px;border-radius:6px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:#ccc;flex-shrink:0;background:#fff;}
.rev-agent-acc{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--green);}
.btn-rev-reject{padding:5px 10px;background:var(--surface);color:var(--red);border:1px solid #fca5a5;border-radius:var(--r4);font-size:11px;font-weight:500;cursor:pointer;font-family:var(--font);}
.btn-rev-reject:hover{background:#fff5f5;}
/* row exit — processing gradient then swipe left */
.all-tbl tr.tr-exiting,.rev-mod-row.tr-exiting{position:relative;z-index:3;overflow:hidden;will-change:transform,opacity;}
.all-tbl tr.tr-exiting::before,.rev-mod-row.tr-exiting::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:var(--accept-fill,0%);
  background:linear-gradient(90deg,rgba(34,197,94,.42) 0%,rgba(34,197,94,.18) 65%,transparent 100%);
  pointer-events:none;z-index:0;
}
.all-tbl tr.tr-exiting td,.rev-mod-row.tr-exiting>*{position:relative;z-index:2;}
.all-tbl tr.tr-exiting td{box-shadow:none!important;}
.all-tbl tr.tr-exiting.tr-exiting-processing td{background:var(--surface)!important;}
.all-tbl tr.tr-exiting:not(.tr-exiting-processing) td{background:linear-gradient(90deg,var(--success-bg) 0%,var(--surface) 40%)!important;}
.all-tbl tr.tr-exiting td:first-child{box-shadow:inset 3px 0 0 var(--success)!important;}
.rev-card{overflow:visible!important;}
.rev-card .all-tbl thead{position:relative;z-index:2;}
/* modern review list — Figma automatching row */
.rev-toolbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:12px;gap:8px;}
.rev-view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--r4);overflow:hidden;background:var(--surface);}
.rev-view-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;background:none;font-family:var(--font);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-right:1px solid var(--border);}
.rev-view-btn:last-child{border-right:none;}
.rev-view-btn:hover{background:var(--stone20);color:var(--text);}
.rev-view-btn.act{background:var(--brand-subtle);color:var(--purple);font-weight:600;}
.rev-mod-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r8);overflow:visible;}
.rev-mod-head,.rev-mod-row{
  display:grid;
  grid-template-columns:32px minmax(200px,1.5fr) minmax(100px,.8fr) minmax(540px,2.8fr) 24px;
  align-items:center;gap:12px;padding:10px 16px;
}
.rev-mod-head{font-size:14px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);padding-top:14px;padding-bottom:12px;background:var(--surface);}
.rev-mod-head .rev-mod-ai-head{display:grid;grid-template-columns:72px 88px 1fr;gap:0;font-size:14px;font-weight:600;color:var(--text);}
.rev-mod-head .rev-mod-ai-head>div{padding-left:4px;}
.rev-mod-head .rev-mod-amt-h{text-align:right;}
.rev-mod-row{border-bottom:1px solid var(--border);cursor:pointer;position:relative;min-height:113px;transition:transform .08s linear,opacity .08s linear,background .12s;}
.rev-mod-row:hover{background:var(--stone20);}
.rev-mod-row:last-child{border-bottom:none;}
.rev-mod-row.rev-mod-upd{background:linear-gradient(90deg,#fffbf0 0%,var(--surface) 44px);}
.rev-mod-row.is-done{background:var(--success-bg);box-shadow:inset 3px 0 0 var(--success);}
.rev-mod-row.is-done:hover{background:#e8f6ec;}
.rev-mod-row.is-done .rev-mod-desc{color:var(--muted);}
.rev-mod-row.is-done .rev-mod-chev{opacity:.35;}
.rev-mod-done-badge{
  display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:2px 7px;border-radius:var(--r99);
  font-size:10px;font-weight:700;color:var(--success);background:#dcfce7;letter-spacing:.02em;vertical-align:middle;
}
.rev-mod-ai-band.is-done{background:#eef9f1;border-color:#c6ead1;}
.rev-mod-ai-band.is-done .rev-mod-ai-col+.rev-mod-ai-col{border-left-color:#d9eee0;}
.all-tbl tr.tr-done{background:var(--success-bg);box-shadow:inset 3px 0 0 var(--success);}
.rev-row-done-label{font-size:11px;font-weight:600;color:var(--success);white-space:nowrap;}
.rev-mod-row.tr-exiting{background:linear-gradient(90deg,var(--success-bg) 0%,var(--surface) 28%);box-shadow:inset 3px 0 0 var(--success);}
.rev-mod-date{font-size:14px;font-weight:500;color:#45464a;line-height:1.35;white-space:nowrap;}
.rev-mod-date-group{border-bottom:1px solid var(--border);}
.rev-mod-date-group:last-child{border-bottom:none;}
.rev-mod-date-hd{
  padding:10px 16px 8px;font-size:12px;font-weight:700;color:var(--muted);
  letter-spacing:.02em;background:var(--stone20);border-bottom:1px solid var(--border);
}
.rev-mod-date-group .rev-mod-row{border-bottom:1px solid var(--border);}
.rev-mod-date-group .rev-mod-row:last-child{border-bottom:none;}
.rev-mod-tx{display:flex;align-items:flex-start;gap:10px;min-width:0;}
.rev-mod-vendor{width:34px;height:34px;border-radius:10px;background:#f7f6f2;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:600;color:var(--text);line-height:1;overflow:hidden;}
.rev-mod-vendor.is-brand{font-weight:700;letter-spacing:-.02em;}
.rev-mod-vendor.is-customer{background:#e8f4ef;color:#0d7d4e;}
.rev-mod-vendor.is-supplier{background:#f7f6f2;color:var(--text);}
.rev-mod-ref{font-size:14px;font-weight:600;color:var(--text);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rev-mod-desc{font-size:14px;font-weight:500;color:#45464a;line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rev-mod-amt{text-align:right;font-size:14px;font-weight:400;color:var(--text);line-height:1.4;}
.rev-mod-chev{color:#ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rev-mod-empty{padding:48px 20px;text-align:center;color:var(--muted);}
/* AI suggestion band */
.rev-mod-ai-band{display:grid;grid-template-columns:72px 88px 1fr;align-items:stretch;min-height:98px;border-radius:12px;border:1px solid transparent;position:relative;transition:border-color .12s,background .12s;}
.rev-mod-ai-band.has-ai{background:#f7f6f2;position:relative;overflow:visible;}
.rev-mod-row:hover .rev-mod-ai-band.has-ai{background:#f2e8fd;border-color:#a762f4;}
.rev-mod-row:hover .rev-mod-ai-band.has-ai::before{
  content:'';position:absolute;top:0;right:0;bottom:0;width:54%;border-radius:0 12px 12px 0;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(242,232,253,0) 0%,rgba(242,232,253,.55) 16%,rgba(255,255,255,.92) 38%,#fff 58%);
}
.rev-mod-ai-band.is-manual{background:transparent;border:none;min-height:98px;}
.rev-mod-ai-col{display:flex;flex-direction:column;justify-content:flex-start;padding:12px 10px 10px;position:relative;min-height:98px;}
.rev-mod-ai-band.has-ai .rev-mod-ai-col+.rev-mod-ai-col{border-left:1px solid #e5e5e5;}
.rev-mod-ai-band.is-manual .rev-mod-ai-col{padding:8px 4px;min-height:98px;}
.rev-mod-ai-band.is-manual .rev-mod-ai-col+.rev-mod-ai-col{border-left:none;}
.rev-mod-ai-col-file{overflow:visible;}
.rev-mod-file-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:8px;height:100%;overflow:visible;}
.rev-mod-file-thumb{
  position:relative;width:42px;height:40px;border-radius:4px;border:1px solid var(--border);
  overflow:visible;background:#fff;flex-shrink:0;cursor:pointer;padding:0;font-family:var(--font);
}
.rev-mod-file-thumb:hover{border-color:var(--lavender);box-shadow:0 0 0 2px rgba(123,20,239,.08);}
.rev-mod-file-thumb--linked:hover{border-color:var(--success);box-shadow:0 0 0 2px rgba(0,133,54,.12);}
.rev-mod-file-thumb-img{display:block;width:100%;height:100%;border-radius:3px;overflow:hidden;background:#fff;}
.rev-mod-file-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.rev-mod-file-link-ico{
  position:absolute;right:3px;bottom:3px;width:15px;height:15px;border-radius:4px;
  background:rgba(255,255,255,.95);color:var(--purple);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:2;pointer-events:none;
}
.rev-mod-file-linked-ico{
  position:absolute;right:3px;bottom:3px;width:15px;height:15px;border-radius:4px;
  background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:2;pointer-events:none;border:1px solid var(--success-border);
}
.rev-mod-file-badge{
  position:absolute;top:3px;right:3px;min-width:14px;height:14px;padding:0 3px;border-radius:10px;
  background:#232428;color:#fff;font-size:8px;font-weight:600;line-height:14px;text-align:center;
  box-sizing:border-box;z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none;
}
.rev-mod-upload{width:53px;height:81px;border:2px dashed #e5e5e5;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;color:#74767b;cursor:pointer;padding:0;flex-shrink:0;}
.rev-mod-upload:hover{border-color:var(--lavender);color:var(--purple);background:var(--brand-subtle);}
.rev-mod-tax-sug,.rev-mod-match-sug{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.rev-mod-tax-code{font-size:14px;font-weight:600;line-height:1.35;color:var(--text);}
.rev-mod-tax-amt{font-size:14px;font-weight:600;line-height:1.35;color:var(--text);}
.rev-mod-match-cat{font-size:14px;font-weight:500;line-height:1.35;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rev-mod-match-sub{font-size:14px;font-weight:400;line-height:1.35;color:#74767b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rev-mod-conf{margin-top:auto;padding-top:8px;font-size:12px;font-weight:400;line-height:1;color:#008536;text-decoration:underline;text-underline-offset:2px;cursor:help;}
.rev-mod-combo{display:flex;height:34px;width:100%;border:1px solid #ccc;border-radius:4px;overflow:hidden;background:#fff;cursor:pointer;}
.rev-mod-combo-field{flex:1;display:flex;align-items:center;padding:0 9px;font-size:14px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rev-mod-combo-field.is-empty{color:#74767b;}
.rev-mod-combo-chev{width:34px;border-left:1px solid #ccc;display:flex;align-items:center;justify-content:center;color:#74767b;flex-shrink:0;}
.rev-mod-combo:hover{border-color:var(--lavender);}
.rev-mod-find-match{
  display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:10px 12px;
  border:1.5px dashed var(--border);border-radius:var(--r8);background:var(--surface);
  cursor:pointer;font-family:var(--font);text-align:left;
  transition:border-color .12s,background .12s,box-shadow .12s;

function txHasChanged(tx){return tx.newContext&&!S.dismissedCtx.has(tx.id);}
function dimKey(field){return field==='file'?'receipt':field==='cat'?'category':field;}
function dimStatus(tx,dim){
  if(tx.status==='awaiting') return dim==='match'?'blocked':'none';
  if(dim==='receipt'){
    if(!tx.attach&&!tx.ai.file.val) return 'none';
    if(txHasChanged(tx)&&tx.attach>0) return 'changed';
    if(tx.ai.file.st==='accepted'||(tx.attach>0&&tx.ai.file.val)) return tx.ai.file.st==='accepted'?'ready':'pending';
    if(tx.attach>0) return 'pending';
    return 'none';
  }
  const field=dim==='category'?'cat':dim==='gst'?'tax':dim;
  const f=tx.ai[field]; if(!f) return 'none';
  if(f.st==='rejected') return 'blocked';
  if(f.st==='accepted') return 'ready';
  if(dim==='match'&&(!f.val&&!(MATCHES[tx.id]&&MATCHES[tx.id].length))) return 'none';
  if(txHasChanged(tx)&&(field==='cat'||field==='tax')&&f.st==='idle'&&f.val) return 'changed';
  if(f.val&&f.st==='idle') return 'pending';
  if(dim==='match'&&MATCHES[tx.id]&&MATCHES[tx.id].length&&f.st==='idle') return 'pending';
  return 'none';
}
function txDimensions(tx){return['receipt','match','category','gst'];}
function txIsReadyForBulk(tx){
  if(txReviewDone(tx)) return false;
  if(tx.status==='awaiting'||tx.status==='accepted'||tx.status==='coded') return false;
  if(txHasChanged(tx)) return false;
  return txDimensions(tx).some(d=>{const s=dimStatus(tx,d);return s==='pending';})&&
    !txDimensions(tx).some(d=>dimStatus(tx,d)==='blocked');
}
function txReadyScore(tx){
  const dims=txDimensions(tx);
  const active=dims.filter(d=>dimStatus(tx,d)!=='none');
  if(!active.length) return 0;
  const ready=active.filter(d=>dimStatus(tx,d)==='ready').length;
  return ready/active.length;
}
function txIsBlocked(tx){return txDimensions(tx).some(d=>dimStatus(tx,d)==='blocked')||tx.status==='awaiting';}
function filterReviewList(list,filter){
  if(filter==='all') return list;
  if(filter==='ready') return list.filter(txIsReadyForBulk);
  if(filter==='newcontext') return list.filter(txHasChanged);
  if(filter==='receipt') return list.filter(t=>dimStatus(t,'receipt')==='pending'||dimStatus(t,'receipt')==='changed');
  if(filter==='match') return list.filter(t=>dimStatus(t,'match')==='pending');
  if(filter==='gst') return list.filter(t=>dimStatus(t,'gst')==='pending'||dimStatus(t,'gst')==='changed');
  if(filter==='blocked') return list.filter(txIsBlocked);
  return list;
}
function filterCount(filter){return filterReviewList(reviewInboxList(),filter).length;}
function sortReviewList(list){
  return [...list].sort((a,b)=>{
    const da=txReviewDone(a)?1:0, db=txReviewDone(b)?1:0;
    if(da!==db) return da-db;
    const ca=txHasChanged(a)?0:1, cb=txHasChanged(b)?0:1;
    if(ca!==cb) return ca-cb;
    const ra=txIsReadyForBulk(a)?0:1, rb=txIsReadyForBulk(b)?0:1;
    if(ra!==rb) return ra-rb;
    return b.date.localeCompare(a.date);
  });
}
function preBasList(){

}

function getWhy(tx, field){
  const f=tx.ai[field]; if(!f||!f.val) return '';
  const vend=tx.desc.split(/\s[–\-]/)[0].trim();
  const c=f.conf; const cw=c>=90?'high':c>=75?'moderate':'lower';
  if(field==='cat'){
    if(c>=90) return `"${vend}" matches a saved rule or has been coded as "${f.val}" 3+ times recently. ${c}% confidence.`;
    return `Keywords in "${vend}" suggest "${f.val}". ${cw.charAt(0).toUpperCase()+cw.slice(1)} confidence — review before accepting.`;
  }
  if(field==='match') return `An open MYOB record was found matching the amount and date. Vendor name "${vend}" confirmed the link at ${c}% confidence.`;
  if(field==='tax'){
    if(c>=90) return `"${f.val}" applied from a saved rule or prior transactions with this vendor. Consistent coding pattern found.`;
    return `"${f.val}" inferred from the category default. ${cw.charAt(0).toUpperCase()+cw.slice(1)} confidence — verify if correct.`;
  }
  if(field==='job') return `Job "${f.val}" was active on the most recent similar transaction.${c<75?' Multiple active jobs reduce certainty.':' Confirmed by recent coding history.'}`;
  return 'AI suggestion based on transaction history and matching patterns.';
}
function getWhyFile(tx){
  const att=ATTACH_DATA[tx.id]?.[0];
  if(!att) return tx.attach>0?'Receipt attached — link or scan to enable AI extraction.':'';
  const c=att.confidence;
  return `Receipt from ${att.vendor} scanned. Extracted $${att.extractedAmt.toFixed(2)} (${att.extractedTax}), category "${att.extractedCat}". Vendor and amount match this transaction at ${c}% confidence.`;
}
function revConfBadge(conf,why){
  if(!conf||conf<1) return '';
  const col=conf>=85?'var(--green)':conf>=65?'#d97706':'var(--red)';
  return `<span class="why-wrap rev-conf">
    <span class="rev-conf-pct" style="color:${col}">${conf}%</span>
    ${why?`<div class="why-tip" style="width:220px"><div class="why-tip-head">Why this suggestion?</div>${why}</div>`:''}
  </span>`;
}
function revAttachInner(tx, includePreview=true){
  const previewImg='assets/receipt-officeworks.png';
  const preview=includePreview?(tx.attach>0
    ?`<div class="rev-att-preview" onclick="event.stopPropagation();openAttachModal(${tx.id},0)" title="View receipt"><img src="${previewImg}" alt="Receipt preview"></div>`
    :`<div class="rev-att-placeholder" title="No attachment"><svg width="16" height="16" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.5 5.5l-4 4A2.8 2.8 0 112.5 5.5l4-4a1.5 1.5 0 012.1 2.1L4.5 7.7a.3.3 0 01-.4-.4l3.5-3.5"/></svg></div>`):'';
  const f=tx.ai.file, att=ATTACH_DATA[tx.id]?.[0];
  const manualBtn=`<button type="button" class="rev-inline-btn" onclick="event.stopPropagation();openInlineAttach(${tx.id})">${tx.attach?'Link receipt':'Find or upload'}</button>`;
  if(!tx.attach) return {html:manualBtn,cls:'rev-mod-agent-empty rev-mod-manual'};
  if(f&&f.st==='accepted') return {html:`${preview}<div class="rev-agent-acc"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>Linked</div>`,cls:'rev-mod-agent-acc'};
  if(f&&f.val&&f.st==='idle') return {html:`${preview}<div><div class="rev-agent-val">${f.val.replace(/\.(pdf|jpg|png)$/i,'')}</div>${revConfBadge(f.conf||att?.confidence||88,getWhyFile(tx))}</div>`,cls:''};
  if(att) return {html:`${preview}<div><div class="rev-agent-val">${att.vendor.split(' ')[0]}</div>${revConfBadge(att.confidence,getWhyFile(tx))}</div>`,cls:''};
  return {html:`${preview}${manualBtn}`,cls:'rev-mod-agent-empty rev-mod-manual'};
}
function revTaxInner(tx){
  const f=tx.ai.tax;
  const manualSel=`<select class="rev-inline-sel" onclick="event.stopPropagation()" onchange="setInlineTax(${tx.id},this.value)"><option value="">Select tax code</option><option value="GST"${f?.val==='GST'?' selected':''}>GST</option><option value="N-T"${f?.val==='N-T'?' selected':''}>N-T (GST free)</option><option value="CAP"${f?.val==='CAP'?' selected':''}>CAP</option></select>`;
  if(!f||(!f.val&&f.st!=='rejected')) return {html:manualSel,cls:'rev-mod-agent-empty rev-mod-manual'};
  if(f.st==='accepted') return {html:`<div class="rev-agent-acc"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>${f.val}</div>`,cls:'rev-mod-agent-acc'};
  if(f.st==='rejected') return {html:manualSel,cls:'rev-mod-agent-empty rev-mod-manual'};
  return {html:`<div class="rev-agent-val">${f.val}</div>${revConfBadge(f.conf,getWhy(tx,'tax'))}`,cls:''};
}
function revCodingInner(tx){
  const cat=tx.ai.cat, match=tx.ai.match;
  const catOk=cat&&cat.val&&cat.st!=='rejected', matchOk=match&&match.val&&match.st!=='rejected';
  const catAcc=cat&&cat.st==='accepted', matchAcc=match&&match.st==='accepted';
  const manualBtn=`<button type="button" class="rev-inline-btn" onclick="event.stopPropagation();openAside(${tx.id},'review','matches')">Find match or code</button>`;
  if(catAcc||matchAcc){
    return {html:`${catAcc?`<div class="rev-agent-acc"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>${cat.val}</div>`:''}${matchAcc?`<div class="rev-agent-sub">${match.val}</div>`:''}`,cls:'rev-mod-agent-acc'};
  }
  if(!catOk&&!matchOk) return {html:manualBtn,cls:'rev-mod-agent-empty rev-mod-manual'};
  const conf=catOk?cat.conf:(matchOk?match.conf:0);
  const why=[catOk?getWhy(tx,'cat'):'',matchOk?getWhy(tx,'match'):''].filter(Boolean).join(' ');
  return {html:`${catOk?`<div class="rev-agent-val">${cat.val}</div>`:''}${matchOk?`<div class="rev-agent-sub">${match.val}</div>`:''}${revConfBadge(conf,why)}`,cls:''};
}

    el.innerHTML=`<div class="fx-toast-inverse-row"><p class="fx-toast-inverse-text">${html}</p><button type="button" class="fx-toast-inverse-close" aria-label="Dismiss" onclick="dismissToast('${id}')"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/></svg></button></div>`;

    el.innerHTML=`<div class="fx-toast-body">${html}</div><button type="button" class="fx-toast-dismiss" aria-label="Dismiss" onclick="dismissToast('${id}')">✕</button>`;

}

      </div>

function runToastUndo(id){
  const fn=S.toastUndo[id];
  if(fn) fn();
  delete S.toastUndo[id];
  dismissToast(id);
}
function dismissToast(id){
  const el=document.getElementById(id);
  if(!el) return;
  delete S.toastUndo[id];
  el.classList.add('toast-out');
  setTimeout(()=>el.remove(),200);
}
const ROW_EXIT_PROCESS_MS=900;
const ROW_EXIT_SWIPE_MS=2400;
function snapshotTx(tx){
  return{
    id:tx.id,status:tx.status,newContext:tx.newContext,
    ai:JSON.parse(JSON.stringify(tx.ai)),
    dismissedCtx:S.dismissedCtx.has(tx.id),
    matchSel:S.matchSel[tx.id]?{...S.matchSel[tx.id]}:null,
  };
}
function restoreTx(snapshot){
  const tx=ftx(snapshot.id); if(!tx) return;
  tx.status=snapshot.status;
  tx.newContext=snapshot.newContext;
  tx.ai=JSON.parse(JSON.stringify(snapshot.ai));
  if(snapshot.dismissedCtx) S.dismissedCtx.add(snapshot.id);
  else S.dismissedCtx.delete(snapshot.id);
  if(snapshot.matchSel) S.matchSel[snapshot.id]=snapshot.matchSel;
  else delete S.matchSel[snapshot.id];
  unmarkTxReviewDone(snapshot.id);
}
function applyAcceptAll(txId){
  const tx=ftx(txId); if(!tx) return false;
  let anyNew=false;
  if(tx.attach>0&&ATTACH_DATA[txId]&&!tx.ai.file.val){
    tx.ai.file.val=ATTACH_DATA[txId][0].name;
    tx.ai.file.conf=ATTACH_DATA[txId][0].confidence;
  }
  Object.entries(tx.ai).forEach(([field,f])=>{
    if(f.val&&f.st!=='accepted'){addToContext(txId,field);anyNew=true;}
    if(f.val) f.st='accepted';
  });
  if(txHasChanged(tx)) S.dismissedCtx.add(txId);
  tx.status='coded';
  markTxReviewDone(txId);
  return anyNew;
}
function updateRowExitDOM(e){
  const row=document.querySelector(`tr[data-exit-id="${e.txId}"], .rev-mod-row[data-exit-id="${e.txId}"]`);
  if(!row) return;
  row.style.setProperty('--accept-fill',`${(e.phase==='processing'?e.progress:100).toFixed(1)}%`);
  row.classList.toggle('tr-exiting-processing',e.phase==='processing');
  if(e.phase==='swiping'){
    row.style.transform=`translateX(${(-e.progress*110).toFixed(1)}%)`;
    row.style.opacity=String(Math.max(0,1-e.progress*0.92));
  }else{
    row.style.transform='translateX(0)';
    row.style.opacity='1';
  }
  const fill=row.querySelector('.tr-exit-progress-fill');
  if(fill) fill.style.width=`${(e.phase==='processing'?e.progress:e.progress)*100}%`;
  const label=row.querySelector('.tr-exit-label');
  if(label) label.textContent=e.paused?'Paused':(e.phase==='processing'?'Processing…':'Accepted');
}
function tickRowExit(now){
  const e=S.rowExit; if(!e) return;
  if(e.paused){e.rafId=requestAnimationFrame(tickRowExit);return;}
  const elapsed=now-e.phaseStart-e.pauseAccum;
  if(e.phase==='processing'){
    e.progress=Math.min(1,elapsed/ROW_EXIT_PROCESS_MS);
    updateRowExitDOM(e);
    if(e.progress>=1){
      applyAcceptAll(e.txId);
      e.applied=true;
      e.phase='swiping';
      e.phaseStart=performance.now();
      e.progress=0;
      e.pauseAccum=0;
    }
  }else{
    e.progress=Math.min(1,elapsed/ROW_EXIT_SWIPE_MS);
    updateRowExitDOM(e);
    if(e.progress>=1){completeRowExit();return;}
  }
  e.rafId=requestAnimationFrame(tickRowExit);
}
function startRowExit(txId){
  if(S.rowExit) return;
  const tx=ftx(txId); if(!tx) return;
  const snapshot=snapshotTx(tx);
  S.rowExit={
    txId,snapshot,phase:'processing',applied:false,paused:false,progress:0,
    phaseStart:performance.now(),pauseAccum:0,pauseStarted:null,rafId:null,hadContext:false,
  };
  render();
  requestAnimationFrame(()=>{
    if(!S.rowExit) return;
    S.rowExit.rafId=requestAnimationFrame(tickRowExit);
  });
}
function pauseRowExit(){
  const e=S.rowExit; if(!e) return;
  if(!e.paused){
    e.paused=true;
    e.pauseStarted=performance.now();
  }else{
    e.paused=false;
    e.pauseAccum+=performance.now()-e.pauseStarted;
    e.pauseStarted=null;
  }
  const tr=document.querySelector(`tr[data-exit-id="${e.txId}"], .rev-mod-row[data-exit-id="${e.txId}"]`);
  if(tr){
    const btn=tr.querySelector('.tr-exit-overlay .fx-btn');
    if(btn) btn.textContent=e.paused?'Resume':'Pause';
    const label=tr.querySelector('.tr-exit-label');
    if(label) label.textContent=e.paused?'Paused':(e.phase==='processing'?'Processing…':'Accepted');
  }
}
function undoRowExit(){
  const e=S.rowExit; if(!e) return;
  if(e.rafId) cancelAnimationFrame(e.rafId);
  if(e.applied) restoreTx(e.snapshot);
  S.rowExit=null;
  render();
  showToast('Transaction restored to review',4000,'inverse');
}
function completeRowExit(){
  const e=S.rowExit; if(!e) return;
  if(e.rafId) cancelAnimationFrame(e.rafId);
  const {txId,snapshot,applied}=e;
  const tx=ftx(txId);
  if(applied) e.hadContext=true;
  S.rowExit=null;
  render();
  showSuccessToast({
    title:'Transaction accepted',
    message:`${tx?.ref||'Transaction'} accepted`,
    undo:()=>{restoreTx(snapshot);render();},
  });
}

function rejectAC(txId, field){
  const tx=ftx(txId); if(!tx) return;
  const f=tx.ai[field];
  f.rejectedVal=f.val; f.st='rejected';
  // update matching rule rejection count if one exists
  const d=tx.desc.toLowerCase();
  const ruleMatch=S.rules.find(r=>{
    const kw=(r.trigger.match(/"([^"]+)"/)||[])[1];
    return kw&&d.includes(kw.toLowerCase());
  });
  if(ruleMatch){ ruleMatch.rejections=(ruleMatch.rejections||0)+1; ruleMatch.lastRejected=tx.date; }

  // Two-button persistent toast
  const toastId='rej'+Date.now();
  const typeLabel=field==='match'?'match suggestion':'category suggestion';
  const valLabel=f.rejectedVal||'this suggestion';
  const el=document.createElement('div');
  el.className='fx-toast fx-toast-inverse'; el.id=toastId;
  el.innerHTML=`
    <div class="fx-toast-body" style="flex:1">
      <div class="toast-title">Suggestion rejected</div>
      <div class="toast-msg">Clear <strong>"${valLabel}"</strong> so it won't appear again for this transaction?</div>
      <div class="toast-foot">
        <button class="btn-toast-yes" onclick="addToClearList(${txId},'${field}');dismissToast('${toastId}')">Yes, clear it</button>
        <button class="btn-toast-no" onclick="dismissToast('${toastId}')">Not now</button>
      </div>
    </div>
    <button type="button" class="fx-toast-dismiss" aria-label="Dismiss" onclick="dismissToast('${toastId}')">✕</button>`;
  document.getElementById('toasts').appendChild(el);
  render();
}

function undoRejectAC(txId, field){
  const tx=ftx(txId); if(!tx) return;
  const f=tx.ai[field]; f.st='idle'; delete f.rejectedVal; render();
}

function addToClearList(txId, field){
  const tx=ftx(txId); if(!tx) return;
  const f=tx.ai[field];
  // Don't add duplicates
  const exists=S.clearList.find(e=>e.txRef===tx.ref&&e.rejectedField===field);
  if(exists){ showToast('Already in your clear list.',2000); return; }
  S.clearList.push({
    id: Date.now(),
    type: field==='match'?'match':'category',
    txRef: tx.ref,
    txDesc: tx.desc,
    txId: tx.id,
    rejectedField: field,
    rejectedVal: f.rejectedVal||f.val,
    date: new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric'}),
    scope: 'transaction',
    note: '',
  });
  showToast(`✓ Cleared — <a href="#" onclick="event.preventDefault();S.stgTab='clearlist';goSettings();goStgSection('transactions')" style="color:var(--lavender);text-decoration:underline">View in settings →</a>`, 4000);
}

function removeClearEntry(id){
  S.clearList=S.clearList.filter(e=>e.id!==id);
  render();
}

function toggleRevSel(id){if(S.reviewSel.has(id))S.reviewSel.delete(id);else S.reviewSel.add(id);render();}
function toggleRevSelAll(ids){const all=ids.every(id=>S.reviewSel.has(id));ids.forEach(id=>all?S.reviewSel.delete(id):S.reviewSel.add(id));render();}
function bulkAcceptAll(){bulkAcceptReadyOnly();}
function bulkAcceptReadyOnly(){
  const targets=S.reviewSel.size?Array.from(S.reviewSel):filterReviewList(reviewInboxList(),'ready').map(t=>t.id);
  const snapshots=targets.map(id=>{const tx=ftx(id);return tx&&txIsReadyForBulk(tx)?snapshotTx(tx):null;}).filter(Boolean);
  let n=0;
  targets.forEach(id=>{const tx=ftx(id);if(tx&&txIsReadyForBulk(tx)){applyAcceptAll(id);n++;}});
  S.reviewSel=new Set();
  render();
  if(n){
    showSuccessToast({
      title:`${n} transaction${n>1?'s':''} accepted`,
      message:'All ready AI suggestions applied — accepted rows stay visible below.',
      undo:()=>{snapshots.forEach(s=>{restoreTx(s);});render();},
    });
  }
}
function acceptAllReadyTx(txId){
  const tx=ftx(txId); if(!tx||!txIsReadyForBulk(tx)) return;
  acceptAllTx(txId);
}
function acceptAllReadyInAside(txId){
  const tx=ftx(txId); if(!tx) return;
  ['cat','match','tax','file'].forEach(f=>{
    const field=tx.ai[f]; if(!field) return;
    if(field.val&&field.st==='idle') field.st='accepted';
    if(f==='file'&&tx.attach>0&&field.st==='idle'){field.val=field.val||'receipt.pdf';field.st='accepted';}
  });
  if(txHasChanged(tx)) S.dismissedCtx.add(txId);
  const allDone=Object.entries(tx.ai).every(([k,f])=>!f.val||f.st==='accepted'||k==='job');
  if(allDone){tx.status='coded';markTxReviewDone(txId);}
  showToast('✓ All ready dimensions accepted',2500);
  renderAside();
  render();
}
function acceptAndNext(txId){
  acceptAllReadyInAside(txId);
  const list=sortReviewList(filterReviewList(reviewInboxList(),S.revFilter));
  const idx=list.findIndex(t=>t.id===txId);
  const next=list.slice(idx+1).find(t=>t.status!=='coded'&&t.status!=='accepted')||list.find(t=>t.status!=='coded'&&t.status!=='accepted');
  if(next&&next.id!==txId) openAside(next.id,S.asideFrom||'review','matches');
  else closeAside();
}
function savePartialAside(txId){
  showToast('✓ Partial progress saved — return anytime to finish',3000);
  closeAside();
  render();
}

function openAside(id,from='all',tab='matches'){
  S.asideId=id;S.asideFrom=from;S.asideTab=tab;
  S.asideSearch='';
  // Pre-populate AI-suggested match shortlist if not already set
  if(!S.matchSel[id]&&AI_PRESEL[id]){
    const presel=AI_PRESEL[id];
    const allRecs=[...(MATCHES[id]||[]),...ALL_RECORDS];
    S.matchSel[id]={};
    presel.forEach(ref=>{
      const rec=allRecs.find(r=>r.ref===ref);
      if(rec) S.matchSel[id][ref]=rec.name;
    });
  }
  document.getElementById('aside-inner').innerHTML=buildAsideContent();
  document.getElementById('aside').classList.add('open');
  document.getElementById('aside-bd').classList.add('show');
  document.getElementById('content').classList.add('aside-open');
  syncScrollCtxAside(true);
}
function closeAside(){
  S.asideId=null;
  document.getElementById('aside').classList.remove('open');
  document.getElementById('aside-bd').classList.remove('show');
  document.getElementById('content').classList.remove('aside-open');
  syncScrollCtxAside(false);
}
function setAsideTab(t){S.asideTab=t;document.getElementById('aside-inner').innerHTML=buildAsideContent();}
/* ── Context learning ── */
function addToContext(txId, field){
  const tx=ftx(txId); if(!tx) return;
  const f=tx.ai[field]; if(!f||!f.val) return;
  if(field!=='cat'&&field!=='match') return;
  const entity=tx.desc.split(/\s[–\-]/)[0].trim();
  const today=new Date();
  const ds=`${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
  const existing=S.context.find(c=>c.entity===entity&&c.learnedField===field);
  if(existing){existing.count++;existing.lastSeen=ds;existing.learnedVal=f.val;if(tx.ref&&!existing.txRefs.includes(tx.ref))existing.txRefs.push(tx.ref);}
  else{S.context.push({id:Date.now(),type:field==='cat'?'category':'match',entity,learnedVal:f.val,learnedField:field,tax:field==='cat'?(tx.ai.tax?.val||''):null,count:1,lastSeen:ds,active:true,note:'',txRefs:tx.ref?[tx.ref]:[]});}
  const memType=field==='cat'?'category':'match';
  const memEx=S.memory.find(m=>m.source==='learned'&&m.entity===entity&&m.memType===memType);
  if(memEx){memEx.count++;memEx.last=ds;if(memEx.memType==='category')memEx.action.cat=f.val;else memEx.action.entity=f.val;}
  else{S.memory.push({id:Date.now()+1,source:'learned',memType,active:true,entity,conditions:[{field:'payee',op:'contains',val:entity}],action:field==='cat'?{cat:f.val,tax:tx.ai.tax?.val||''}:{entity:f.val,matchType:'invoice'},count:1,last:ds,note:''});}
}

function setupScrollCtxWatch(){
  const scrollRoot=document.querySelector('.main');
  const content=document.getElementById('content');
  const bar=document.getElementById('scroll-ctx');
  if(!scrollRoot||!content||!bar) return;
  if(window._scrollCtxObs){window._scrollCtxObs.disconnect();window._scrollCtxObs=null;}
  const anchor=content.querySelector('[data-scroll-table-head]')||content.querySelector('[data-scroll-ctx-anchor]');
  if(!anchor) return;
  const apply=show=>{if(S.page==='main') setScrollCtxVisible(show);};
  window._scrollCtxObs=new IntersectionObserver(([entry])=>{
    apply(!entry.isIntersecting);
  },{root:scrollRoot,threshold:0});
  window._scrollCtxObs.observe(anchor);
  if(!scrollRoot.dataset.scrollCtxScrollBound){
    scrollRoot.dataset.scrollCtxScrollBound='1';
    scrollRoot.addEventListener('scroll',()=>{
      if(S.page!=='main') return;
      apply(scrollRoot.scrollTop>48);
    },{passive:true});
  }
  apply(scrollRoot.scrollTop>48);
}
function updateScrollCtxBar(){

    bar.innerHTML='';
    if(window._scrollCtxObs){window._scrollCtxObs.disconnect();window._scrollCtxObs=null;}
    return;
  }
  bar.innerHTML=buildScrollCtxBar();
  syncScrollCtxAside(content.classList.contains('aside-open'));
  setupScrollCtxWatch();
  bindReviewTableHeadSync();
  requestAnimationFrame(()=>requestAnimationFrame(syncReviewTableHeadWidths));
}

function reconTodoCounts(){
  const inbox=reviewInboxList();
  const bankOk=t=>S.bankFilter==='all'||t.bank===S.bankFilter;
  const receiptIds=new Set();
  filterReviewList(inbox,'receipt').filter(bankOk).forEach(t=>receiptIds.add(t.id));
  filterReviewList(inbox,'newcontext').filter(bankOk).forEach(t=>receiptIds.add(t.id));
  const receipts=receiptIds.size;
  const bas=preBasList().filter(bankOk).length;
  const suggestedRules=S.rules.filter(r=>r.suggested&&r.active!==false).length;
  const learnedPatterns=S.memory.filter(m=>m.source==='learned'&&m.active).length;
  const patterns=suggestedRules+learnedPatterns;
  return {receipts,bas,patterns};
}
function reconTodoScrollTo(target){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const scrollRoot=document.querySelector('.main');
    const el=document.querySelector('[data-recon-target="'+target+'"]');
    if(!el||!scrollRoot) return;
    const top=el.getBoundingClientRect().top-scrollRoot.getBoundingClientRect().top+scrollRoot.scrollTop-12;
    scrollRoot.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  }));
}
function reconTodoReview(kind){
  if(kind==='receipts'){
    S.page='main';S.preBasMode=false;S.tab='review';S.revFilter='receipt';S.reviewSel=new Set();closeAside();render();
    reconTodoScrollTo('review-list');
    const first=filterReviewList(reviewInboxList(),'receipt')[0];
    if(first) openAside(first.id,'review','matches');
  }else if(kind==='bas'){
    S.page='prebas';S.preBasMode=true;S.revFilter='gst';closeAside();render();
    reconTodoScrollTo('prebas-list');
  }else if(kind==='patterns'){
    S.memFilter='all';
    S.page='settings';S.stgSection='all';S.ruleWiz=null;S.asideId=null;S.hubSection=null;closeAside();render();

function revExitStyle(txId){
  const e=S.rowExit;
  if(!e||e.txId!==txId) return '';
  if(e.phase==='swiping') return `transform:translateX(${(-e.progress*110).toFixed(1)}%);opacity:${Math.max(0,1-e.progress*0.92).toFixed(2)};`;
  return `--accept-fill:${(e.progress*100).toFixed(1)}%;`;
}
function revExitRowCls(txId,isCtx,modern){
  const e=S.rowExit;
  const exitActive=e?.txId===txId;
  const cls=[isCtx?(modern?'rev-mod-upd':'tr-upd'):''];
  if(exitActive){
    cls.push('tr-exiting');
    if(e.phase==='processing') cls.push('tr-exiting-processing');
    if(e.paused) cls.push('tr-exiting-paused');
  }
  return cls.filter(Boolean).join(' ');
}
function buildReviewExitOverlay(txId){
  const e=S.rowExit;
  if(!e||e.txId!==txId) return '';
  const label=e.paused?'Paused':(e.phase==='processing'?'Processing…':'Accepted');
  return `
  <div class="tr-exit-overlay" onclick="event.stopPropagation()">
    <div class="tr-exit-progress" aria-hidden="true"><div class="tr-exit-progress-fill" style="width:${(e.progress*100).toFixed(1)}%"></div></div>
    <span class="tr-exit-label">${label}</span>
    <button type="button" class="fx-btn fx-btn-neutral-ghost fx-btn-sm" onclick="pauseRowExit()">${e.paused?'Resume':'Pause'}</button>
    <button type="button" class="fx-textlink" onclick="undoRowExit()">Undo</button>
  </div>`;
}
function buildReviewRowActions(tx, exitActive){
  if(txReviewDone(tx)) return `<span class="rev-row-done-label"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg> Accepted</span>`;
  const hasSuggestions=['cat','match','tax','file'].some(f=>{const a=tx.ai[f];return a&&a.val&&a.st==='idle';})||(tx.attach>0&&ATTACH_DATA[tx.id]);
  return `
  <div class="rev-row-actions" onclick="event.stopPropagation()">
    <button class="fx-btn fx-btn-success fx-btn-sm" ${hasSuggestions&&!exitActive?'':'disabled'} onclick="event.stopPropagation();acceptAllTx(${tx.id})" title="Accept all AI suggestions">Accept all</button>
    <button class="fx-btn fx-btn-neutral-ghost fx-btn-sm" ${exitActive?'disabled':''} onclick="openAside(${tx.id},'review','matches')">Review</button>
    <button class="btn-rev-reject" ${exitActive?'disabled':''} onclick="rejectAllSuggestions(${tx.id})" title="Clear AI suggestions">Reject</button>
  </div>`;
}
function revModConfHtml(conf,why){
  if(!conf||conf<1) return '';
  return `<span class="why-wrap rev-mod-conf">${conf}%${why?`<div class="why-tip" style="width:220px"><div class="why-tip-head">Why this suggestion?</div>${why}</div>`:''}</span>`;
}
function revModFieldSuggest(f){
  return !!(f&&f.val&&f.st==='idle'&&(f.conf||0)>=1);
}
function revModFileSuggest(tx){
  const f=tx.ai.file;
  if(f&&f.st==='accepted') return false;
  return revModFieldSuggest(f);
}
function revModTaxSuggest(tx){
  const f=tx.ai.tax;
  if(f&&f.st==='accepted') return false;
  return revModFieldSuggest(f);
}
function revModMatchSuggest(tx){
  const cat=tx.ai.cat, match=tx.ai.match;
  if((cat&&cat.st==='accepted')||(match&&match.st==='accepted')) return false;
  return revModFieldSuggest(cat)||revModFieldSuggest(match);
}
function revModHasAnyAi(tx){
  return revModFileSuggest(tx)||revModTaxSuggest(tx)||revModMatchSuggest(tx);
}
function revModIsFullManual(tx){
  return !revModHasAnyAi(tx);
}
function revModGstAmount(tx){
  const f=tx.ai.tax;
  if(!f||!f.val||f.val==='N-T') return null;
  return fmtAbs(Math.abs(tx.amount)/11);
}
function revModTxDesc(tx){
  const parts=tx.desc.split(/\s[–\-]\s*/);
  return parts.length>1?parts.slice(1).join(' – '):tx.desc;
}
function revModPartyName(tx){
  return tx.desc.split(/\s[–\-]/)[0].trim();
}
function revModIsCustomer(tx){
  if(tx.amount>0) return true;
  const m=tx.ai?.match?.val;
  if(m&&/invoice/i.test(m)) return true;
  const cat=tx.ai?.cat?.val;
  if(cat&&/sales|income|revenue/i.test(cat)) return true;
  return false;
}
function revModFindSupplierBrand(name){
  const n=name.toLowerCase();
  return AU_SUPPLIER_BRANDS.find(b=>b.keys.some(k=>n.includes(k)));
}
function revModPartyInitial(name){
  const w=name.replace(/^the\s+/i,'').trim();
  return(w.charAt(0)||'?').toUpperCase();
}
function revModVendorLogo(tx){
  const name=revModPartyName(tx);
  if(revModIsCustomer(tx)){
    return `<div class="rev-mod-vendor is-customer" title="${name}">${revModPartyInitial(name)}</div>`;
  }
  const brand=revModFindSupplierBrand(name);
  if(brand){
    const fs=brand.fs||13;
    return `<div class="rev-mod-vendor is-brand" style="background:${brand.bg};color:${brand.fg};font-size:${fs}px" title="${brand.name||name}">${brand.label}</div>`;
  }
  return `<div class="rev-mod-vendor is-supplier" title="${name}">${revModPartyInitial(name)}</div>`;
}

function revModFileCell(tx){
  const f=tx.ai.file, att=ATTACH_DATA[tx.id]?.[0], previewImg='assets/receipt-officeworks.png';
  if(f&&f.st==='accepted'){
    const badge=tx.attach>1?`<span class="rev-mod-file-badge">${tx.attach}</span>`:'';
    return `<div class="rev-mod-file-wrap">
      ${revModFileThumbBtn(tx.id,previewImg,badge,true)}
      <div class="rev-mod-agent-acc"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>Linked</div>
    </div>`;
  }
  if(revModFileSuggest(tx)){
    const conf=f?.conf||att?.confidence||88;
    const badge=tx.attach>1?`<span class="rev-mod-file-badge">${tx.attach}</span>`:'';
    return `<div class="rev-mod-file-wrap">
      ${revModFileThumbBtn(tx.id,previewImg,badge)}
      ${revModConfHtml(conf,getWhyFile(tx))}
    </div>`;
  }
  return revModFileManual(tx);
}
function revModTaxCell(tx){
  const f=tx.ai.tax;
  if(f&&f.st==='accepted'){
    return `<div class="rev-mod-agent-acc"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>${f.val}</div>`;
  }
  if(revModTaxSuggest(tx)){
    const gst=revModGstAmount(tx);
    return `<div class="rev-mod-tax-sug">
      <div class="rev-mod-tax-code">${f.val}</div>
      ${gst?`<div class="rev-mod-tax-amt">${gst}</div>`:''}
      ${revModConfHtml(f.conf,getWhy(tx,'tax'))}
    </div>`;
  }
  return revModTaxManual(tx);
}
function revModMatchCell(tx){
  const cat=tx.ai.cat, match=tx.ai.match;
  if((cat&&cat.st==='accepted')||(match&&match.st==='accepted')){
    return `<div class="rev-mod-match-sug">
      ${cat&&cat.st==='accepted'?`<div class="rev-mod-match-cat">${cat.val}</div>`:''}
      ${match&&match.st==='accepted'?`<div class="rev-mod-match-sub">${match.val}</div>`:''}
    </div>`;
  }
  if(revModMatchSuggest(tx)){
    const conf=revModFieldSuggest(cat)?cat.conf:(match?.conf||0);
    const why=[revModFieldSuggest(cat)?getWhy(tx,'cat'):'',revModFieldSuggest(match)?getWhy(tx,'match'):''].filter(Boolean).join(' ');
    return `<div class="rev-mod-match-sug">
      ${revModFieldSuggest(cat)?`<div class="rev-mod-match-cat">${cat.val}</div>`:''}
      ${revModFieldSuggest(match)?`<div class="rev-mod-match-sub">${match.val}</div>`:''}
      ${revModConfHtml(conf,why)}
    </div>`;
  }
  return revModMatchManual(tx);
}
function buildRevModAiBand(tx,exitActive){
  const isDone=txReviewDone(tx);
  const hasAi=revModHasAnyAi(tx);
  const manual=revModIsFullManual(tx);
  const hasSuggestions=['cat','match','tax','file'].some(f=>{const a=tx.ai[f];return a&&a.val&&a.st==='idle';})||(tx.attach>0&&ATTACH_DATA[tx.id]);
  const actions=hasAi&&!exitActive&&!isDone?`
    <div class="rev-mod-ai-actions" onclick="event.stopPropagation()">
      <button type="button" class="rev-mod-act-review" onclick="openAside(${tx.id},'review','matches')">Review</button>

      <button type="button" class="rev-mod-act-reject" onclick="rejectAllSuggestions(${tx.id})"><svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg><span>Reject</span></button>

  return `
  <div class="rev-mod-ai-band${hasAi&&!isDone?' has-ai':''}${manual&&!isDone?' is-manual':''}${isDone?' is-done':''}">

}

function buildReviewTable(pending, ctxItems){
  const all=[...ctxItems,...pending];
  if(!all.length) return `<div style="padding:48px;text-align:center;color:var(--muted)"><div style="font-size:32px;margin-bottom:8px">✓</div><div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">All caught up</div><div>No transactions need review right now.</div></div>`;
  const sel=S.reviewSel;
  const allChk=all.length>0&&all.every(t=>sel.has(t.id));
  const bulkBar=sel.size>0?`
    <div class="bulk-bar">
      <span>${sel.size} selected</span>
      <div class="bulk-sp"></div>
      <button class="btn-bulk-ok" onclick="bulkAcceptAll()">✓ Accept all AI suggestions</button>
    </div>`:'';

  function aiTd(tx, field){
    const f=tx.ai[field];
    if(!f||!f.val) return `<td class="aitd aitd-empty"><span class="aitd-none">No suggestion</span></td>`;
    if(f.st==='rejected') return `<td class="aitd aitd-rejected"><div class="aitd-rej-wrap"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>${f.rejectedVal||f.val}</div><button class="btn-aitd-ed" style="margin-top:3px" onclick="event.stopPropagation();undoRejectAC(${tx.id},'${field}')">Undo</button></td>`;
    if(f.st==='accepted') return `<td class="aitd aitd-accepted"><div class="aitd-acc-wrap"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>${f.val}</div></td>`;
    const dot=f.conf>=85?'#22c55e':f.conf>=65?'#f59e0b':'#ef4444';
    const why=getWhy(tx,field);
    return `<td class="aitd">
      <div class="aitd-inner">
        <span class="aitd-dot" style="background:${dot}"></span>
        <span class="aitd-val" title="${f.val}">${f.val}</span>
        <span class="why-wrap">
          <span class="aitd-pct">${f.conf}%</span>
          ${why?`<div class="why-tip" style="width:210px"><div class="why-tip-head">Why this suggestion?</div>${why}</div>`:''}
        </span>
      </div>
      <div class="aitd-btns">
        <button class="btn-aitd-ok" onclick="event.stopPropagation();acceptAC(${tx.id},'${field}')">✓ Accept</button>
        <button class="btn-aitd-ed" onclick="event.stopPropagation();openAside(${tx.id},'review','categorise')">✏ Edit</button>
        <button class="btn-aitd-rej" onclick="event.stopPropagation();rejectAC(${tx.id},'${field}')" title="Reject suggestion">✕</button>
      </div>
    </td>`;
  }

  const rows=all.map(tx=>{
    const isCtx=tx.newContext;
    const isDone=tx.status==='accepted'||tx.status==='coded';
    const rowCls=isDone?'tr-done':isCtx?'tr-upd':'';
    const amtCls=tx.amount<0?'amt-neg':'amt-pos';
    const checked=sel.has(tx.id)?'checked':'';
    const ctxTag=isCtx?`<span style="font-size:11px;background:var(--warning-bg);color:var(--warning);border-radius:var(--r4);padding:1px 6px;font-weight:600;margin-left:4px">⚡</span>`:'';
    const attach=tx.attach>0?`<div class="att-w"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.5 5.5l-4 4A2.8 2.8 0 112.5 5.5l4-4a1.5 1.5 0 012.1 2.1L4.5 7.7a.3.3 0 01-.4-.4l3.5-3.5"/></svg><span class="att-ct">${tx.attach}</span></div>`:
      `<span style="color:#ddd"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.5 5.5l-4 4A2.8 2.8 0 112.5 5.5l4-4a1.5 1.5 0 012.1 2.1L4.5 7.7a.3.3 0 01-.4-.4l3.5-3.5"/></svg></span>`;
    const accBtn=!isDone?`<button class="btn-aok" style="font-size:11px;height:24px;padding:0 10px" onclick="event.stopPropagation();acceptAllTx(${tx.id})">✓ All</button>`:`<span style="font-size:11px;color:var(--green);font-weight:600">✓ Coded</span>`;
    return `
    <tr class="${rowCls}" style="cursor:pointer" onclick="openAside(${tx.id},'review','matches')">
      <td onclick="event.stopPropagation()" style="padding:8px 12px;text-align:center">
        <input type="checkbox" style="width:13px;height:13px;accent-color:var(--purple);cursor:pointer" ${checked}
          onclick="event.stopPropagation();toggleRevSel(${tx.id})">
      </td>
      <td style="padding:8px 10px">${bankLabel(tx.bank)}</td>
      <td style="padding:8px 10px;font-size:12px;color:var(--muted);white-space:nowrap">${tx.date}</td>
      <td style="padding:8px 10px;font-weight:500;min-width:160px">${tx.desc}${ctxTag}</td>
      <td style="padding:8px 10px;text-align:right"><span class="${amtCls}">${fmt(tx.amount)}</span></td>
      <td style="padding:8px 10px;text-align:center">${attach}</td>
      ${aiTd(tx,'cat')}
      ${aiTd(tx,'match')}
      ${aiTd(tx,'tax')}
      <td style="padding:8px 10px;text-align:right;white-space:nowrap">${accBtn}</td>
    </tr>`;
  }).join('');

  return `
  ${bulkBar}
  <div class="rtbl-card">
    <div class="rtbl-w">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr>
            <th style="width:32px;padding:8px 12px;text-align:center;border-bottom:1px solid var(--border)">
              <input type="checkbox" style="width:13px;height:13px;accent-color:var(--purple);cursor:pointer" ${allChk?'checked':''}
                onclick="toggleRevSelAll(${JSON.stringify(all.map(t=>t.id))})">
            </th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Account</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Date</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em">Description</th>
            <th style="padding:8px 10px;text-align:right;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em">Amount</th>
            <th style="padding:8px 10px;text-align:center;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px">📎</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--purple);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em">AI Category</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--purple);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em">AI Match</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--purple);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em">Tax</th>
            <th style="padding:8px 10px;text-align:right;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em">Action</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
  </div>`;
}

function buildReviewCard(tx, isCtx){
  const done=Object.values(tx.ai).every(f=>!f.val||f.st==='accepted');

    {key:'cat',  label:'Category', icon:'📁'},

  const totalWithVal=Object.values(tx.ai).filter(f=>f.val).length;

  return `
  <div class="rc${done?' rc-done':''}${isCtx?' rc-upd':''}" id="rc-${tx.id}">
    <div class="rc-head" onclick="openAside(${tx.id},'review','${MATCHES[tx.id]&&MATCHES[tx.id].length?'matches':'create'}')">

    <div class="ac-row">

    <div class="rc-foot">

        ?`<span class="btn-rc-done-msg">✓ All items reviewed</span><div class="rc-foot-sp"></div><button class="btn-rc-skip" onclick="undoAllAI(${tx.id})">Undo</button>`
        :`<span class="rc-progress">${acceptedCount}/${totalWithVal} accepted</span>

function buildActionCard(tx, field, label, icon){
  const f=tx.ai[field];
  const isEditing=S.editingCard&&S.editingCard.txId===tx.id&&S.editingCard.field===field;
  const isAcc=f.st==='accepted';
  const conf=f.conf||0;
  const barW=Math.max(conf,5);

  // rejected state
  if(f.st==='rejected'){
    return `
    <div class="ac ac-rej">
      <div class="ac-label">${icon} ${label} <span class="ac-ai">AI</span></div>
      <div class="ac-rej-label">✕ Rejected: ${f.rejectedVal||f.val}</div>
      <div class="ac-foot">
        <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">+ Add manually</button>
        <button class="btn-aundo" onclick="undoRejectAC(${tx.id},'${field}')">Undo</button>
      </div>
    </div>`;
  }

  if(isAcc){
    return `
    <div class="ac ac-acc">
      <div class="ac-label">${icon} ${label}</div>
      <div class="ac-acc-label">✓ ${f.val||'Added'}</div>
      <button class="btn-aundo" onclick="undoAC(${tx.id},'${field}')">Undo</button>
    </div>`;
  }

  if(!f.val&&!isEditing){
    return `
    <div class="ac ac-none">
      <div class="ac-label">${icon} ${label}</div>
      <div class="ac-val none">${field==='file'?'No receipt yet':'Not found'}</div>
      <div class="ac-foot">
        <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">+ ${field==='file'?'Upload':'Add'}</button>
      </div>
    </div>`;
  }

  if(isEditing){
    return `
    <div class="ac ac-editing">
      <div class="ac-label">${icon} ${label}</div>
      <input id="ace-${tx.id}-${field}" class="ac-input" value="${f.val||''}" placeholder="${label}..."/>
      <div style="display:flex;gap:4px">
        <button class="btn-asave" onclick="saveAC(${tx.id},'${field}')">Save</button>
        <button class="btn-acancel" onclick="cancelAC()">Cancel</button>
      </div>
    </div>`;
  }

  const why=getWhy(tx,field);
  return `
  <div class="ac">
    <div class="ac-label">${icon} ${label} <span class="ac-ai">AI</span></div>
    <div class="ac-val">${f.val}</div>
    ${conf>0?`<div class="ac-conf">
      <div class="conf-bar"><div class="conf-fill ${confCls(conf)}" style="width:${barW}%"></div></div>
      <span class="why-wrap">
        <span class="conf-pct">${conf}%</span>
        ${why?`<div class="why-tip"><div class="why-tip-head">Why this suggestion?</div>${why}</div>`:''}
      </span>
    </div>`:''}
    <div class="ac-foot">
      <button class="btn-aok" onclick="acceptAC(${tx.id},'${field}')">✓ Accept</button>
      <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">✏ Edit</button>
      <button class="btn-arej" onclick="rejectAC(${tx.id},'${field}')">✕</button>
    </div>
  </div>`;
}

/* ── SPLIT LINE HANDLERS ──────────────────────── */
function initSplitLines(txId){
  if(S.splitLines[txId]) return; // already initialised
  const tx=ftx(txId);
  const aiSplit=AI_SPLITS[txId];
  if(aiSplit){
    // Start with single line from AI cat; show banner to offer AI split
    S.aiSplitPending[txId]=true;
    S.splitLines[txId]=[{id:1, desc:tx.desc, cat:tx.ai.cat.val||'', tax:tx.ai.tax.val||'GST', amount:tx.amount}];
  } else {
    S.splitLines[txId]=[{id:1, desc:tx.desc, cat:tx.ai.cat.val||'', tax:tx.ai.tax.val||'GST', amount:tx.amount}];
  }
}

function acceptAiSplit(txId){
  const aiSplit=AI_SPLITS[txId]; if(!aiSplit) return;
  S.splitLines[txId]=aiSplit.lines.map(l=>({...l}));
  S.aiSplitPending[txId]=false;
  render();
}

function dismissAiSplit(txId){
  S.aiSplitPending[txId]=false;
  render();
}

function addSplitLine(txId){
  const lines=S.splitLines[txId]||[];
  const newId=Math.max(0,...lines.map(l=>l.id))+1;
  lines.push({id:newId, desc:'', cat:'', tax:'GST', amount:0});
  render();
}

function removeSplitLine(txId, lineId){
  S.splitLines[txId]=S.splitLines[txId].filter(l=>l.id!==lineId);
  render();
}

function updateSplitLine(txId, lineId, field, val){
  const lines=S.splitLines[txId]; if(!lines) return;
  const line=lines.find(l=>l.id===lineId); if(!line) return;
  line[field]=field==='amount'?parseFloat(val)||0:val;
  // Update remaining counter without full re-render
  updateRemaining(txId);
}

function updateRemaining(txId){
  const tx=ftx(txId); if(!tx) return;
  const lines=S.splitLines[txId]||[];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  const rem=(total-used).toFixed(2);
  const remOk=Math.abs(parseFloat(rem))<0.01;
  const el=document.getElementById(`split-rem-${txId}`);
  if(el){
    el.textContent=remOk?'✓ Fully allocated':('$'+Math.abs(parseFloat(rem)).toFixed(2)+(parseFloat(rem)<0?' over':''));
    el.className='split-rem '+(remOk?'ok':parseFloat(rem)<0?'over':'');
  }
}

function commitLedger(txId){
  const tx=ftx(txId);
  const lines=S.splitLines[txId]||[];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  if(Math.abs(total-used)>0.01){ showToast('Allocate remaining amount before committing.',3000); return; }
  tx.status='coded';
  markTxReviewDone(txId);
  Object.values(tx.ai).forEach(f=>{if(f.val&&f.st==='idle')f.st='accepted';});
  addToContext(txId,'cat');
  showContextToast();
  closeAside();
  render();
  const n=lines.length;
  showToast(`✓ ${tx.desc} — ${n} line${n>1?'s':''} committed to general ledger`, 4000);
}

/* ── MULTI-SELECT MATCH HANDLERS ─────────────────── */
function toggleMatchSel(txId, ref, name){
  if(!S.matchSel[txId]) S.matchSel[txId]={};
  if(S.matchSel[txId][ref]) delete S.matchSel[txId][ref];
  else S.matchSel[txId][ref]=name;
  renderAside();
}

function buildMatchFooter(tx){
  const sel=S.matchSel[tx.id]||{};
  const refs=Object.keys(sel);
  const count=refs.length;
  if(tx.status==='accepted'||tx.source==='both'||tx.source==='myob') return '';

  // Compute combined amount
  const allRecs=[...(MATCHES[tx.id]||[]),...ALL_RECORDS];
  const selTotal=refs.reduce((s,ref)=>{
    const r=allRecs.find(x=>x.ref===ref); return s+(r?Math.abs(r.amount):0);
  },0);
  const txAbs=Math.abs(tx.amount);
  const totalMatch=Math.abs(selTotal-txAbs)<0.01;
  const names=Object.values(sel);

  return `
  <div class="match-footer">
    ${count>0?`
    <div style="flex:1;min-width:0">
      <div class="mf-top">
        <span class="mf-count">${count} record${count!==1?'s':''} selected</span>
        ${count>1?`<span style="font-size:11px;padding:2px 8px;border-radius:var(--r99);background:${totalMatch?'var(--green-bg)':'var(--amber-bg)'};color:${totalMatch?'var(--green)':'var(--amber)'};font-weight:600">
          ${totalMatch?'✓ Totals match':'≠ Totals differ'}
        </span>`:''}
        <button class="btn-confirm-match" onclick="confirmMatch(${tx.id})">Confirm match →</button>
      </div>
      <div class="mf-names">${names.slice(0,2).join(' · ')}${names.length>2?` +${names.length-2} more`:''}</div>
    </div>
    `:`
    <span style="color:var(--muted);font-size:12px">Select records to match, then confirm below</span>
    <button class="btn-confirm-match" disabled style="background:#ccc;cursor:not-allowed">Confirm match →</button>
    `}
  </div>`;
}

function confirmMatch(txId){
  const tx=ftx(txId); if(!tx) return;
  const sel=S.matchSel[txId]||{};
  const refs=Object.keys(sel);
  if(!refs.length){ showToast('Select at least one record to match.',2500); return; }
  const names=Object.values(sel);
  tx.source='both';
  tx.status='accepted';
  tx.ai.match.val=names.join(', ');
  tx.ai.match.st='accepted';
  addToContext(txId,'match');
  delete S.matchSel[txId];
  closeAside();
  render();
  showToast(`✓ Matched to ${refs.length} record${refs.length>1?'s':''}: ${names.slice(0,2).join(', ')}${names.length>2?` +${names.length-2} more`:''} — <a href="#" onclick="event.preventDefault();viewContext()" style="color:var(--lavender);text-decoration:underline">Context saved →</a>`, 4500);
}

function buildAsideMatches(tx){
  if(tx.source==='myob') return `

    </div>`;
  if(tx.status==='accepted'||tx.source==='both'){
    const matchNames=(tx.ai.match.val||'').split(', ').filter(Boolean);

  }

  const aiMatches=MATCHES[tx.id]||[];

  const allFiltered=ALL_RECORDS.filter(r=>{
    if(aiRefs.has(r.ref)) return false;

  });
  const aiFiltered=q?aiMatches.filter(m=>m.ref.toLowerCase().includes(q)||m.name.toLowerCase().includes(q)):aiMatches;

  // Check if AI pre-selected multiple records (multi-match scenario)
  const presel=AI_PRESEL[tx.id]||[];
  const isMultiSuggest=presel.length>1;
  const aiSelCount=aiFiltered.filter(m=>sel[m.ref]).length;

  const allRecs=[...aiMatches,...ALL_RECORDS];
  const selTotal=Object.keys(sel).reduce((s,ref)=>{
    const r=allRecs.find(x=>x.ref===ref); return s+(r?Math.abs(r.amount):0);

    <input class="aside-search" placeholder="Search MYOB records…" value="${S.asideSearch}"
      oninput="S.asideSearch=this.value;updateMatchSearch()">
  </div>

  ${aiFiltered.length?`
  <div class="aside-section" style="margin-top:0;display:flex;align-items:center;gap:6px">
    <span class="ac-ai" style="font-size:10px">AI</span>
    Suggested
    ${isMultiSuggest&&!q?`<span style="font-size:10px;color:var(--muted);font-weight:400">— AI suggests both cover this payment</span>`:''}
  </div>
  ${isMultiSuggest&&!q?`
  <div style="background:var(--mauve);border:1px solid var(--lavender);border-radius:var(--r8);padding:9px 12px;margin-bottom:10px;font-size:11px;line-height:1.5">
    <span style="font-weight:600;color:var(--purple)">✦ Combined match detected</span><br>

    matching your ${tx.amount>0?'deposit':'payment'} of <strong>${fmtAbs(tx.amount)}</strong>.
    Both are pre-selected below.
  </div>`:''}
  ${aiFiltered.map(m=>{
    const isSel=!!sel[m.ref];

function buildAsideCategorise(tx){
  initSplitLines(tx.id);
  const lines=S.splitLines[tx.id];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  const rem=(total-used).toFixed(2);
  const remOk=Math.abs(parseFloat(rem))<0.01;
  const aiSplit=AI_SPLITS[tx.id];
  const showAiBanner=aiSplit&&S.aiSplitPending[tx.id];
  const CATS=['Materials','Electrical supplies','Power & gas','Office supplies','Cloud hosting','Sales income','Staff meals','Parking & tolls','Safety & workwear','Design software','General expenses'];
  const TAXES=['GST','N-T','CAP','FRE'];

  return `
  ${showAiBanner?`
  <div class="ai-split-banner">
    <div class="ai-split-banner-head">✦ AI detected multiple items in this receipt</div>
    <div class="ai-split-banner-body">We've split this transaction into ${aiSplit.lines.length} lines based on the receipt. Review and adjust before committing.</div>
    <div class="ai-split-btns">
      <button class="btn-asp-acc" onclick="acceptAiSplit(${tx.id})">Use AI split</button>
      <button class="btn-asp-dis" onclick="dismissAiSplit(${tx.id})">Code as single line</button>
    </div>
  </div>`:''}

  <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">
    Line items <span style="font-weight:400;font-size:10px">(total: ${fmt(tx.amount)})</span>
  </div>

  ${lines.map((line,i)=>`
  <div class="split-row" id="srow-${tx.id}-${line.id}">
    <div class="split-row-num">
      Line ${i+1}
      ${lines.length>1?`<button class="split-del" title="Remove line" onclick="removeSplitLine(${tx.id},${line.id})">✕</button>`:''}
    </div>
    <input class="split-inp full" placeholder="Description" value="${line.desc}"
      oninput="updateSplitLine(${tx.id},${line.id},'desc',this.value)">
    <select class="split-inp" onchange="updateSplitLine(${tx.id},${line.id},'cat',this.value)">
      <option value="">– Category –</option>
      ${CATS.map(c=>`<option${line.cat===c?' selected':''}>${c}</option>`).join('')}
    </select>
    <select class="split-inp" onchange="updateSplitLine(${tx.id},${line.id},'tax',this.value)">
      ${TAXES.map(t=>`<option${line.tax===t?' selected':''}>${t}</option>`).join('')}
    </select>
    <input class="split-inp" type="number" step="0.01" placeholder="0.00" value="${Math.abs(line.amount)||''}"
      oninput="updateSplitLine(${tx.id},${line.id},'amount',this.value);updateRemaining(${tx.id})">
  </div>`).join('')}

  <button class="btn-add-line" onclick="addSplitLine(${tx.id})">+ Add line</button>

  <div class="split-total-bar">
    <span style="color:var(--muted)">Remaining to allocate</span>
    <span class="split-rem ${remOk?'ok':parseFloat(rem)<0?'over':''}" id="split-rem-${tx.id}">
      ${remOk?'✓ Fully allocated':('$'+Math.abs(parseFloat(rem)).toFixed(2)+(parseFloat(rem)<0?' over':''))}
    </span>
  </div>

  <div class="frm-row" style="margin-top:10px"><label class="frm-label">Job code (all lines)</label>
    <select class="frm-sel"><option>– Select job –</option><option>ECO-0231</option><option>ECO-0234</option><option>APEX-2025</option><option>FANS-2025</option></select>
  </div>
  <div class="frm-row"><label class="frm-label">Note</label>
    <input class="frm-inp" type="text" placeholder="Add a note…"/>
  </div>
  <button class="btn-commit" onclick="commitLedger(${tx.id})" ${!remOk?'style="background:#999;cursor:not-allowed"':''}>
    ${remOk?'✓ Commit to general ledger':'Commit to general ledger (allocate remaining first)'}
  </button>`;
}

function buildAsideCreate(tx){
  const isDebit=tx.amount<0;
  const opts=isDebit
    ?[{i:'💸',l:'Spend money',s:'Card or cash payment'},{i:'📋',l:'Bill',s:'Supplier bill'},{i:'↔️',l:'Transfer',s:'Between accounts'},{i:'📄',l:'Other',s:'Journal entry'}]
    :[{i:'🧾',l:'Invoice',s:'Customer payment'},{i:'💰',l:'Receive money',s:'Incoming payment'},{i:'↔️',l:'Transfer',s:'Between accounts'},{i:'📄',l:'Other',s:'Journal entry'}];
  return `
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5">No MYOB record found. Create one to categorise this ${isDebit?'payment':'receipt'}.</div>
  <div class="create-grid">
    ${opts.map(o=>`<button class="create-btn" onclick="alert('Opening ${o.l}...')"><span class="create-icon">${o.i}</span><span class="create-label">${o.l}</span><span class="create-sub">${o.s}</span></button>`).join('')}

}

/* ── Unmatch ── */
function unmatch(txId){
  const tx=ftx(txId); if(!tx) return;
  tx.status='pending';
  // Reset accepted AI fields back to idle so they reappear as suggestions
  ['cat','match','tax'].forEach(f=>{
    if(tx.ai[f]&&tx.ai[f].st==='accepted') tx.ai[f].st='idle';
  });
  showToast('↩ Unmatched — transaction returned to review');
  render();
}

function openAttachModal(txId, attIdx){
  S.attachModal={txId,attIdx:attIdx||0};
  render();
}
function closeAttachModal(){
  S.attachModal=null;
  render();
}
function confirmAttachment(txId){
  const tx=ftx(txId); if(!tx) return;
  tx.ai.cat.st='accepted';
  showToast('✓ Receipt accepted — match confirmed');
  closeAttachModal();
}
function reassignFromAttachment(txId, newCat){
  const tx=ftx(txId); if(!tx) return;
  tx.ai.cat.val=newCat;
  tx.ai.cat.st='accepted';
  tx.status='coded';
  markTxReviewDone(txId);
  showToast(`✓ Recoded to "${newCat}" based on receipt`);
  closeAttachModal();
}
function rejectAttachment(txId){
  showToast('Receipt rejected — transaction unchanged');
  closeAttachModal();
}
function uploadAttachmentReceipt(txId, input){
  const tx=ftx(txId); if(!tx) return;
  const atts=ATTACH_DATA[txId]?[...ATTACH_DATA[txId]]:[];
  const idx=atts.length;
  const picked=input?.files?.[0];
  const names=['receipt.jpg','invoice.pdf','tax-invoice.jpg','eftpos-receipt.jpg','delivery-docket.pdf'];
  const fileName=picked?.name||names[idx%names.length];
  const vendor=tx.desc.split(/\s[–\-]/)[0].trim();
  const extractedCat=tx.ai.cat?.val||tx.ai.cat?.rejectedVal||'Office supplies';
  const extractedTax=tx.ai.tax?.val||tx.ai.tax?.rejectedVal||'GST';
  const amt=Math.abs(tx.amount);
  const gst=+(amt/11).toFixed(2);
  atts.push({
    id:`att-${txId}-${idx}-${Date.now()}`,
    name:fileName,
    vendor,
    extractedAmt:amt,
    extractedGst:gst,
    extractedDate:tx.date,
    extractedCat,
    extractedTax,
    invoiceRef:tx.ai.match?.val||null,
    confidence:85+((txId+idx)%12),
    fields:['vendor','amount','date','gst'],
    isNew:true,
  });
  ATTACH_DATA[txId]=atts;
  tx.attach=atts.length;
  if(tx.ai.file){
    tx.ai.file.val=fileName;
    tx.ai.file.st='idle';
    tx.ai.file.conf=atts[atts.length-1].confidence;
  }
  S.attachModal={txId,attIdx:idx};
  if(input) input.value='';
  render();
  showToast(`✓ ${fileName} uploaded — review extracted fields`,2800);
}

function startEditSection(id){S.bizCtxEditing=id;render();}
function cancelEditSection(){S.bizCtxEditing=null;render();}
function saveSection(id){
  const sec=S.bizCtx.sections.find(s=>s.id===id); if(!sec) return;
  const ta=document.getElementById(`biz-ta-${id}`);
  if(ta&&ta.value.trim()) sec.text=ta.value.trim();
  S.bizCtx.lastUpdated='just now';
  S.bizCtxEditing=null;
  render();
  showToast('✓ Context updated');
}
function submitBizCtxUpdate(){
  const inp=document.getElementById('biz-nl-inp');
  if(!inp||!inp.value.trim()) return;
  const raw=inp.value.trim();
  inp.value='';

  // Route to appropriate section by keyword
  const lower=raw.toLowerCase();
  let targetId='overview';
  if(/never|don.t|exclude|ignore|skip|won.t/i.test(raw)) targetId='exclusions';
  else if(/tax|gst|n-t|bas|fre|free|exempt/i.test(raw)) targetId='tax';
  else if(/match|invoice|bill|record|supplier|payee|code|category/i.test(raw)) targetId='suppliers';
  else if(/prefer|priorit|manual|auto|suggest/i.test(raw)) targetId='matching';

  // Show thinking state then apply
  const thinking=document.getElementById('biz-thinking');
  if(thinking) thinking.style.display='flex';
  setTimeout(()=>{
    const sec=S.bizCtx.sections.find(s=>s.id===targetId);
    if(sec){
      // Append the instruction as a new sentence
      const instruction=raw.endsWith('.')||raw.endsWith('!')?raw:raw+'.';
      sec.text=sec.text+' '+instruction;
      S.bizCtx.lastUpdated='just now';
    }
    S.bizCtxEditing=null;
    render();
    showToast('✓ Business context updated');
  }, 1200);
  render(); // re-render to show thinking state
}
