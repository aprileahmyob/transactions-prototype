function dismissSuggestion(txId,type,field){
  const tx=ftx(txId); if(!tx) return;
  closeDismissMenu();
  if(type==='hide'){
    S.hiddenTx.add(txId);
    S.reviewSel.delete(txId);
    showSuccessToast({title:'Transaction hidden',message:`${tx.ref||'Line'} removed from matching — restore from Hidden list.`});
    render(); return;
  }
  if(field){
    clearFieldSuggestion(tx,field);
    if(type==='once'){
      S.sessionDismissed.add(sessionDismissKey(txId,field));
      maybeElevationPrompt(tx,field);
      showToast('Suggestion dismissed for this transaction.',2500);
    }else if(type==='overall'){
      const vend=tx.desc.split(/\s[–\-]/)[0].trim();
      const val=tx.ai[field]?.rejectedVal||'';
      S.memory.push({id:Date.now(),source:'rejected',memType:field==='match'?'match':'category',active:true,
        entity:vend,
        conditions:[{field:'payee',op:'contains',val:vend}],
        action:field==='match'?{entity:val}:{cat:val,tax:''},
        count:1,last:new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric'}),
        note:`Never suggest "${val}" for ${vend}.`,
        summary:`Never suggest ${field==='match'?'match':'category'} "${val}" for ${vend}.`});
      addDismissLogEntry(tx,field,'overall','Permanent exclusion rule created.');
      showToast('Permanent exclusion saved to Memory.',3000);
    }else if(type==='object'){
      addDismissLogEntry(tx,field,'object',`Won't match to ${tx.ai[field]?.rejectedVal||'this record'}.`);
      showToast('Object-level dismissal saved.',2500);
    }else if(type==='semantic'){
      addDismissLogEntry(tx,field,'semantic','Semantic pattern excluded.');
      showToast('Semantic exclusion saved.',2500);
    }
  }else{
    ['cat','match','tax'].forEach(f=>clearFieldSuggestion(tx,f));
    showToast('All suggestions dismissed for this transaction.',2500);
  }
  if(S.matchSel[txId]) delete S.matchSel[txId];
  render();
}
function restoreDismissed(id){
  const e=S.clearList.find(x=>x.id===id); if(!e||e.restored) return;
  e.restored=true;
  if(e.txId&&S.hiddenTx.has(e.txId)) S.hiddenTx.delete(e.txId);
  if(e.txId&&e.rejectedField){
    S.sessionDismissed.delete(sessionDismissKey(e.txId,e.rejectedField));
    const tx=ftx(e.txId);
    if(tx&&e.rejectedVal&&e.rejectedVal!=='—'){
      const f=tx.ai[e.rejectedField];
      if(f&&f.st!=='accepted'){f.val=e.rejectedVal;f.st='idle';f.conf=75;}
    }
  }

  render();
}

function revAsmCodingSlim(tx){
  const cat=tx.ai.cat, match=tx.ai.match;
  const catOk=cat&&cat.val&&cat.st!=='rejected', matchOk=match&&match.val&&match.st!=='rejected';
  const catAcc=cat&&cat.st==='accepted', matchAcc=match&&match.st==='accepted';
  const manualBtn=`<button type="button" class="rev-inline-btn" onclick="event.stopPropagation();openAside(${tx.id},'review','matches')">Find match or code</button>`;
  if(catAcc||matchAcc){
    return `<div class="rev-asm-coding">
      ${catAcc?`<div class="rev-asm-coding-title">${cat.val} <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" class="rev-asm-check"><polyline points="2,6 5,9 10,3"/></svg></div>`:''}
      ${matchAcc?`<div class="rev-asm-coding-sub">${match.val}</div>`:''}
    </div>`;
  }
  if(!catOk&&!matchOk) return `<div class="rev-asm-manual-wrap">${manualBtn}</div>`;
  const conf=catOk?cat.conf:(matchOk?match.conf:0);
  const matchRev=txRevisionValues(tx,'match');
  const catRev=txRevisionValues(tx,'cat');
  const matchTxt=matchRev?matchRev.newVal:(matchOk?match.val:'');
  const catTxt=catRev?catRev.newVal:(catOk?cat.val:'');
  const whyField=matchRev?'match':(catRev?'cat':(matchOk?'match':'cat'));
  return `<div class="rev-asm-coding">
    ${catTxt?`<div class="rev-asm-coding-title">${catTxt}</div>`:''}
    ${matchTxt?`<div class="rev-asm-coding-sub">${matchTxt}</div>`:''}
    ${revConfBadge(conf,whyField==='match'?(matchOk?getWhy(tx,'match'):''):(catOk?getWhy(tx,'cat'):''),{field:whyField,tx})}
  </div>`;
}

const ROW_EXIT_PROCESS_MS=900;
const ROW_EXIT_SWIPE_MS=2400;
const ROW_REJECT_WIPE_MS=720;
function snapshotTx(tx){
  return{
    id:tx.id,status:tx.status,newContext:tx.newContext,
    ai:JSON.parse(JSON.stringify(tx.ai)),
    dismissedCtx:S.dismissedCtx.has(tx.id),
    matchSel:S.matchSel[tx.id]?{...S.matchSel[tx.id]}:null,
  };
}
function restoreTx(snapshot){
  const tx=ftx(snapshot.id); if(!tx) return;
  tx.status=snapshot.status;
  tx.newContext=snapshot.newContext;
  tx.ai=JSON.parse(JSON.stringify(snapshot.ai));
  if(snapshot.dismissedCtx) S.dismissedCtx.add(snapshot.id);
  else S.dismissedCtx.delete(snapshot.id);
  if(snapshot.matchSel) S.matchSel[snapshot.id]=snapshot.matchSel;
  else delete S.matchSel[snapshot.id];
  unmarkTxReviewDone(snapshot.id);
}
function applyAcceptAll(txId){
  const tx=ftx(txId); if(!tx) return false;
  let anyNew=false;
  Object.entries(tx.ai).forEach(([field,f])=>{
    if(field==='file') return;
    if(f.val&&f.st!=='accepted'){addToContext(txId,field);anyNew=true;}
    if(f.val) f.st='accepted';
  });
  if(txHasChanged(tx)) S.dismissedCtx.add(txId);
  const matched=!!(tx.ai.match?.val&&tx.ai.match.st==='accepted');
  tx.status=matched?'accepted':'coded';
  if(matched) tx.source='both';
  markTxReviewDone(txId);
  return anyNew;
}
function markRowExitDone(txId){

  if(!row) return;

function updateRowExitDOM(e){
  const row=document.querySelector(`tr[data-exit-id="${e.txId}"], .rev-mod-row[data-exit-id="${e.txId}"]`);
  if(!row) return;
  row.style.setProperty('--accept-fill',`${(e.phase==='processing'?e.progress:100).toFixed(1)}%`);
  row.classList.toggle('tr-exiting-processing',e.phase==='processing');
  if(e.phase==='swiping'){
    row.style.transform=`translateX(${(-e.progress*110).toFixed(1)}%)`;
    row.style.opacity=String(Math.max(0,1-e.progress*0.92));
  }else{
    row.style.transform='translateX(0)';
    row.style.opacity='1';
  }
  const fill=row.querySelector('.tr-exit-progress-fill');
  if(fill) fill.style.width=`${(e.phase==='processing'?e.progress:e.progress)*100}%`;
  const label=row.querySelector('.tr-exit-label');
  if(label) label.textContent=e.paused?'Paused':(e.phase==='processing'?'Processing…':'Accepted');
}
function tickRowExit(now){
  const e=S.rowExit; if(!e) return;
  if(e.paused){e.rafId=requestAnimationFrame(tickRowExit);return;}
  const elapsed=now-e.phaseStart-e.pauseAccum;
  if(e.phase==='processing'){
    e.progress=Math.min(1,elapsed/ROW_EXIT_PROCESS_MS);
    updateRowExitDOM(e);
    if(e.progress>=1){
      e.hadContext=applyAcceptAll(e.txId);
      e.applied=true;
      markRowExitDone(e.txId);
      e.phase='swiping';
      e.phaseStart=performance.now();
      e.progress=0;
      e.pauseAccum=0;
    }
  }else{
    e.progress=Math.min(1,elapsed/ROW_EXIT_SWIPE_MS);
    updateRowExitDOM(e);
    if(e.progress>=1){completeRowExit();return;}
  }
  e.rafId=requestAnimationFrame(tickRowExit);
}
function startRowExit(txId){
  if(S.rowExit||S.rowReject) return;
  const tx=ftx(txId); if(!tx) return;
  S.rowExit={
    txId,snapshot:snapshotTx(tx),phase:'processing',applied:false,paused:false,progress:0,
    phaseStart:performance.now(),pauseAccum:0,pauseStarted:null,rafId:null,hadContext:false,

function pauseRowExit(){

  if(!e.paused){
    e.paused=true;
    e.pauseStarted=performance.now();
  }else{
    e.paused=false;

function rejectAC(txId, field){

  const f=tx.ai[field];
  f.rejectedVal=f.val; f.st='rejected';
  // update matching rule rejection count if one exists
  const d=tx.desc.toLowerCase();
  const ruleMatch=S.rules.find(r=>{
    const kw=(r.trigger.match(/"([^"]+)"/)||[])[1];
    return kw&&d.includes(kw.toLowerCase());
  });
  if(ruleMatch){ ruleMatch.rejections=(ruleMatch.rejections||0)+1; ruleMatch.lastRejected=tx.date; }

  // Two-button persistent toast
  const toastId='rej'+Date.now();
  const typeLabel=field==='match'?'match suggestion':'category suggestion';
  const valLabel=f.rejectedVal||'this suggestion';
  const el=document.createElement('div');
  el.className='fx-toast fx-toast-inverse'; el.id=toastId;
  el.innerHTML=`
    <div class="fx-toast-body" style="flex:1">
      <div class="toast-title">Suggestion rejected</div>
      <div class="toast-msg">Clear <strong>"${valLabel}"</strong> so it won't appear again for this transaction?</div>
      <div class="toast-foot">
        <button class="btn-toast-yes" onclick="addToClearList(${txId},'${field}');dismissToast('${toastId}')">Yes, clear it</button>
        <button class="btn-toast-no" onclick="dismissToast('${toastId}')">Not now</button>
      </div>
    </div>
    <button type="button" class="fx-toast-dismiss" aria-label="Dismiss" onclick="dismissToast('${toastId}')">✕</button>`;
  document.getElementById('toasts').appendChild(el);
  render();
}

function undoRejectAC(txId, field){

function startTxPaneResize(e){
  if(e.button!==0) return;
  e.preventDefault();
  const wrap=document.getElementById('tx-pane-wrap');
  if(!wrap) return;
  const horizontal=S.txLayout==='horizontal';
  const startX=e.clientX, startY=e.clientY;
  const startRatio=horizontal?S.txPaneRatioH:S.txPaneRatio;
  const rect=wrap.getBoundingClientRect();
  function onMove(ev){
    const delta=horizontal?(ev.clientY-startY):(ev.clientX-startX);
    if(horizontal){
      const next=Math.min(0.75,Math.max(0.18,startRatio+delta/window.innerHeight));
      S.txPaneRatioH=next;
      wrap.style.setProperty('--tx-pane-top-h',(next*100).toFixed(1)+'vh');
    }else{
      const size=rect.width;
      const next=Math.min(0.72,Math.max(0.22,startRatio+delta/size));
      S.txPaneRatio=next;
      wrap.style.setProperty('--tx-pane-list-pct',(next*100).toFixed(1)+'%');
    }
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.body.classList.remove('tx-pane-dragging');
  }
  document.body.classList.add('tx-pane-dragging');
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}
function bindTxPaneKeys(){
  if(window._txPaneKeysBound) return;
  window._txPaneKeysBound=true;
  document.addEventListener('keydown',e=>{
    if(!useTxPaneForMain()) return;
    if(!isTxDetailOpen()&&!isReadingPaneLayout()) return;
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();navTxPane(1);}
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();navTxPane(-1);}
    else if(e.key==='Escape'){
      e.preventDefault();
      if(isTxFullScreenDetail()||!isReadingPaneLayout()) closeAside();
      else{S.asideId=null;render();}
    }
  });
}
function txPaneStatusPill(tx){
  if(S.tab==='review') return revSplitStatusPill(tx);
  if(tx.status==='coded'||tx.status==='accepted'||tx.source==='both') return '<span class="tx-pane-status done">Matched</span>';
  if(tx.ai.match.val||tx.ai.cat.val) return '<span class="tx-pane-status ready">Match found</span>';
  if(tx.source==='myob') return '<span class="tx-pane-status blocked">Awaiting</span>';
  return '<span class="tx-pane-status">Pending</span>';
}
function revSplitStatusPill(tx){
  if(txReviewDone(tx)) return '<span class="tx-pane-status done">Done</span>';
  if(txHasChanged(tx)) return '<span class="tx-pane-status upd">Updated</span>';
  if(txIsBlocked(tx)) return '<span class="tx-pane-status blocked">Blocked</span>';
  if(txIsReadyForBulk(tx)) return '<span class="tx-pane-status ready">Ready</span>';
  return '<span class="tx-pane-status">Review</span>';
}

function buildMatchFooterContent(tx,{includeReviewActions=false}={}){
  const sel=S.matchSel[tx.id]||{};
  const refs=Object.keys(sel);
  const count=refs.length;
  if(tx.status==='accepted'||tx.source==='both'||tx.source==='myob') return '';
  const allRecs=[...(MATCHES[tx.id]||[]),...ALL_RECORDS];
  const selTotal=refs.reduce((s,ref)=>{const r=allRecs.find(x=>x.ref===ref);return s+(r?Math.abs(r.amount):0);},0);
  const totalMatch=Math.abs(selTotal-Math.abs(tx.amount))<0.01;
  const names=Object.values(sel);
  const ready=txIsReadyForBulk(tx);
  return `
  <div class="pane-foot-row">
    <div class="pane-foot-meta">
      ${count>0?`
        <span class="mf-count">${count} record${count!==1?'s':''} selected</span>
        <div class="pane-foot-badges">
          ${count>1?`<span class="pane-foot-badge ${totalMatch?'ok':'warn'}">${totalMatch?'✓ Totals match':'≠ Totals differ'}</span>`:''}
        </div>
        <div class="mf-names">${names.slice(0,3).join(' · ')}${names.length>3?` +${names.length-3}`:''}</div>`
      :`<span class="mf-count" style="color:var(--muted);font-weight:500">Select records to match</span>`}
    </div>
    <div class="pane-foot-actions">
      ${includeReviewActions?`
        <button type="button" class="fx-btn fx-btn-neutral-ghost fx-btn-sm" onclick="skipTx(${tx.id})">Skip</button>
        <button type="button" class="fx-btn fx-btn-neutral-ghost fx-btn-sm" onclick="acceptAndNext(${tx.id})">Verify &amp; next</button>
        <button type="button" class="fx-btn fx-btn-success fx-btn-sm" ${ready?'':'disabled style="opacity:.5"'} onclick="acceptAllReadyInAside(${tx.id})">Verify all</button>`:''}
      ${count>0
        ?`<button type="button" class="btn-confirm-match" onclick="confirmMatch(${tx.id})">Confirm match</button>`
        :`<button type="button" class="btn-confirm-match" disabled style="background:#ccc;cursor:not-allowed">Confirm match</button>`}
    </div>
  </div>`;
}

function splitRemOk(tx){
  initSplitLines(tx.id);
  const lines=S.splitLines[tx.id]||[];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  return Math.abs(total-used)<0.01;
}

  if(S.asideTab==='matches'&&tx.status!=='accepted'&&tx.source!=='both'&&tx.source!=='myob'){

    return foot?`<div class="pane-sticky-foot">${foot}</div>`:'';
  }
  if(asideTabNorm(S.asideTab)==='create'){
    const remOk=splitRemOk(tx);
    const recType=getRecordType(tx.id);
    const ready=remOk&&!!recType;
    return `<div class="pane-sticky-foot"><div class="pane-foot-row">
      <div class="pane-foot-meta"><span class="mf-count">${ready?'Ready to save':!recType?'Select a record type':'Allocate remaining amount'}</span></div>

  }
  if(fromReview) return `<div class="pane-sticky-foot">${buildReviewFooterContent(tx)}</div>`;
  return '';
}

  const idx=list.findIndex(t=>t.id===txId);
  const next=list.slice(idx+1).find(t=>t.status!=='coded'&&t.status!=='accepted')||list.find(t=>t.status!=='coded'&&t.status!=='accepted');
  if(next&&next.id!==txId) openAside(next.id,S.asideFrom||S.tab,'matches');
  else closeAside();

function openAside(id,from='all',tab='matches'){
  if(S.txLayout==='horizontal'&&S.asideId===id){
    S.asideId=null;
    render();
    return;
  }
  S.asideRule=null;
  S.asideId=id;S.asideFrom=from;S.asideTab=tab;
  S.asideSearch='';
  // Pre-populate AI-suggested match shortlist if not already set
  if(!S.matchSel[id]&&AI_PRESEL[id]){
    const presel=AI_PRESEL[id];
    const allRecs=[...(MATCHES[id]||[]),...ALL_RECORDS];
    S.matchSel[id]={};
    presel.forEach(ref=>{
      const rec=allRecs.find(r=>r.ref===ref);
      if(rec) S.matchSel[id][ref]=rec.name;
    });
  }
  if(useTxPaneForMain()){
    bindTxPaneKeys();
    render();
    scrollTxPaneRowIntoView(id);
    return;
  }
  document.getElementById('aside-inner').innerHTML=buildAsideContent();
  document.getElementById('aside').classList.add('open');
  document.getElementById('aside-bd').classList.add('show');
  document.getElementById('content').classList.add('aside-open');
  syncScrollCtxAside(true);
}
function closeAside(){
  const wasDetail=!!S.asideId;
  S.asideId=null;
  S.asideRule=null;
  document.getElementById('aside').classList.remove('open');
  document.getElementById('aside-bd').classList.remove('show');
  document.getElementById('content').classList.remove('aside-open');
  syncScrollCtxAside(false);
  if(wasDetail&&(useTxPaneForMain()&&(isReadingPaneLayout()||S.txLayout==='none'))) render();
}
function setAsideTab(t){
  S.asideTab=asideTabNorm(t);
  if(S.asideTab!=='matches') S.asideSearch='';
  if(useTxPaneForMain()&&isTxDetailOpen()) renderAside();
  else document.getElementById('aside-inner').innerHTML=buildAsideContent();
}
/* ── Context learning ── */
function addToContext(txId, field){
  const tx=ftx(txId); if(!tx) return;
  const f=tx.ai[field]; if(!f||!f.val) return;
  if(field!=='cat'&&field!=='match') return;
  const entity=tx.desc.split(/\s[–\-]/)[0].trim();
  const today=new Date();
  const ds=`${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
  const existing=S.context.find(c=>c.entity===entity&&c.learnedField===field);
  if(existing){existing.count++;existing.lastSeen=ds;existing.learnedVal=f.val;if(tx.ref&&!existing.txRefs.includes(tx.ref))existing.txRefs.push(tx.ref);}
  else{S.context.push({id:Date.now(),type:field==='cat'?'category':'match',entity,learnedVal:f.val,learnedField:field,tax:field==='cat'?(tx.ai.tax?.val||''):null,count:1,lastSeen:ds,active:true,note:'',txRefs:tx.ref?[tx.ref]:[]});}
  const memType=field==='cat'?'category':'match';
  const memEx=S.memory.find(m=>m.source==='learned'&&m.entity===entity&&m.memType===memType);
  if(memEx){memEx.count++;memEx.last=ds;if(memEx.memType==='category')memEx.action.cat=f.val;else memEx.action.entity=f.val;}
  else{S.memory.push({id:Date.now()+1,source:'learned',memType,active:true,entity,conditions:[{field:'payee',op:'contains',val:entity}],action:field==='cat'?{cat:f.val,tax:tx.ai.tax?.val||''}:{entity:f.val,matchType:'invoice'},count:1,last:ds,note:''});}
}

function saveEditCtx(id){
  const c=S.context.find(c=>c.id===id); if(!c) return;
  const eEnt=document.getElementById(`ctx-ent-${id}`);

function acceptAC(txId,field){
  const tx=ftx(txId);
  const wasIdle=tx.ai[field].st==='idle';
  tx.ai[field].st='accepted';
  const allDone=Object.entries(tx.ai).every(([k,f])=>!f.val||f.st==='accepted'||k==='file');
  if(allDone){tx.status='coded';markTxReviewDone(txId);}
  S.editingCard=null;
  if(wasIdle){addToContext(txId,field);showContextToast();}
  render();
  if(useTxPaneForMain()&&isTxDetailOpen()) renderAside();
}

    all:{primary:'Review inbox',detail:''},
    ready:{primary:'Review',detail:'Ready to accept'},
    newcontext:{primary:'Review',detail:'AI updated'},
    receipt:{primary:'Review',detail:'Receipt'},
    receiptmatch:{primary:'Review',detail:'Receipt matches'},
    match:{primary:'Review',detail:'Matches'},
    gst:{primary:'Review',detail:'GST'},
    blocked:{primary:'Review',detail:'Blocked'},
    multi:{primary:'Review',detail:'Filtered'},

function syncReviewTableHeadWidths(){
  if(S.tab!=='review'||S.reviewView!=='table') return;
  const bodyTable=document.querySelector('.rev-card .review-tbl');

  const headTable=document.querySelector('.scroll-ctx-review-tbl');
  if(!bodyTable||!headWrap||!headTable) return;
  const card=bodyTable.closest('.rev-card');
  if(card) headWrap.style.width=card.getBoundingClientRect().width+'px';
  headTable.style.width=bodyTable.getBoundingClientRect().width+'px';
  const srcCells=bodyTable.querySelectorAll('thead tr:first-child > *');
  const dstCells=headTable.querySelectorAll('thead tr:first-child > *');
  srcCells.forEach((cell,i)=>{
    if(!dstCells[i]) return;
    const w=Math.round(cell.getBoundingClientRect().width);
    dstCells[i].style.width=w+'px';
    dstCells[i].style.minWidth=w+'px';
    dstCells[i].style.maxWidth=w+'px';
  });
}

function setupScrollCtxWatch(){
  const scrollRoot=document.querySelector('.main');
  const content=document.getElementById('content');
  const bar=document.getElementById('scroll-ctx');
  if(!scrollRoot||!content||!bar) return;
  if(window._scrollCtxObs){window._scrollCtxObs.disconnect();window._scrollCtxObs=null;}
  const anchor=content.querySelector('[data-scroll-table-head]')||content.querySelector('[data-scroll-ctx-anchor]');
  if(!anchor) return;
  const apply=show=>{if(S.page==='main') setScrollCtxVisible(show);};
  window._scrollCtxObs=new IntersectionObserver(([entry])=>{
    apply(!entry.isIntersecting);
  },{root:scrollRoot,threshold:0});
  window._scrollCtxObs.observe(anchor);
  if(!scrollRoot.dataset.scrollCtxScrollBound){
    scrollRoot.dataset.scrollCtxScrollBound='1';
    scrollRoot.addEventListener('scroll',()=>{
      if(S.page!=='main') return;
      apply(scrollRoot.scrollTop>48);
    },{passive:true});
  }
  apply(scrollRoot.scrollTop>48);
}

    return;

  bar.innerHTML=buildScrollCtxBar();
  syncScrollCtxAside(content.classList.contains('aside-open'));
  setupScrollCtxWatch();
  bindReviewTableHeadSync();
  requestAnimationFrame(()=>requestAnimationFrame(syncReviewTableHeadWidths));

const ALL_SOURCE_OPTS=[{k:'bank',l:'Bank feed'},{k:'myob',l:'MYOB Records'}];
const ALL_TYPE_OPTS=[{k:'deposit',l:'Deposit'},{k:'transfer',l:'Transfer'},{k:'withdrawal',l:'Withdrawals'}];
function parseAusDate(s){
  const p=s.split('/');
  return new Date(+p[2],+p[1]-1,+p[0]);
}
function formatAusDate(d){
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function ausToIso(s){
  const [d,m,y]=s.split('/');
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function isoToAus(iso){
  const [y,m,d]=iso.split('-');
  return `${d}/${m}/${y}`;
}
function txDateBounds(){
  let min=null,max=null;
  TX.forEach(t=>{
    const d=parseAusDate(t.date);
    if(!min||d<min) min=d;
    if(!max||d>max) max=d;
  });
  return {min:min||new Date(),max:max||new Date()};
}
function defaultAllFilters(){
  const {min,max}=txDateBounds();
  return {
    dateFrom:formatAusDate(min),
    dateTo:formatAusDate(max),
    sources:new Set(ALL_SOURCE_OPTS.map(o=>o.k)),
    types:new Set(ALL_TYPE_OPTS.map(o=>o.k)),
  };
}
function ensureAllFilters(){
  if(!S.allFilters) S.allFilters=defaultAllFilters();
}
function txKind(tx){
  const text=(tx.desc+' '+tx.ref).toLowerCase();
  if(/\btransfer\b/.test(text)) return 'transfer';
  return tx.amount>=0?'deposit':'withdrawal';
}
function matchesAllSource(tx,sources){
  if(!sources||sources.size>=ALL_SOURCE_OPTS.length) return true;
  if(sources.has('bank')&&(tx.source==='bank'||tx.source==='both')) return true;
  if(sources.has('myob')&&(tx.source==='myob'||tx.source==='both')) return true;
  return false;
}
function matchesAllType(tx,types){
  if(!types||types.size>=ALL_TYPE_OPTS.length) return true;
  return types.has(txKind(tx));
}
function matchesAllDate(tx,from,to){
  const d=parseAusDate(tx.date);
  return d>=parseAusDate(from)&&d<=parseAusDate(to);
}
function applyAllFilters(list){
  ensureAllFilters();
  const f=S.allFilters;
  return list.filter(tx=>
    matchesAllDate(tx,f.dateFrom,f.dateTo)&&
    matchesAllSource(tx,f.sources)&&
    matchesAllType(tx,f.types)
  );
}

function txSortValue(tx,col){
  switch(col){
    case 'date': return parseAusDate(tx.date).getTime();
    case 'tx': return (tx.ref||revModPartyName(tx)||'').toLowerCase();
    case 'amt': return tx.amount;
    case 'gst': case 'tax': return (tx.ai.tax.val||'').toLowerCase();
    case 'job': return (tx.ai.job?.val||'').toLowerCase();
    case 'match':{
      const rec=MATCHES[tx.id]?.[0];
      return (rec?.name||tx.ai.match.val||'').toLowerCase();
    }
    case 'left': return txWhatsLeftInfo(tx).pct;
    case 'code': return (tx.ai.cat.val||tx.ai.match.val||'').toLowerCase();
    default: return 0;
  }
}
function sortTableList(list,tableKey){
  ensureColSort();
  const {col,dir}=S.colSort[tableKey]||{col:'date',dir:'desc'};
  const mul=dir==='asc'?1:-1;
  return [...list].sort((a,b)=>{
    const va=txSortValue(a,col), vb=txSortValue(b,col);
    if(typeof va==='number'&&typeof vb==='number') return (va-vb)*mul;
    return String(va).localeCompare(String(vb))*mul;
  });
}

function txIsFullyComplete(tx){
  if(txHasChanged(tx)) return false;
  return tx.status==='accepted'||tx.status==='coded'||tx.source==='both';
}
/* Completion score for "What's left" — weights the two things that matter for
   rec + BAS: the record is matched/coded (2pts), and a tax code is set (1pt). */
function txCompletionPct(tx){ return txWhatsLeftInfo(tx).pct; }
function txWhatsLeftInfo(tx){
  if(txHasChanged(tx)) return {pct:25,bucket:'danger',label:'Recheck needed'};
  const codeDone=tx.status==='accepted'||tx.status==='coded'||tx.source==='both'||(tx.ai.match.val&&tx.ai.match.st==='accepted')||(tx.ai.cat.val&&tx.ai.cat.st==='accepted');
  const codeSuggested=!codeDone&&(tx.ai.match.val||tx.ai.cat.val);
  const taxDone=!!tx.ai.tax.val&&(tx.ai.tax.st==='accepted'||codeDone);
  const taxSuggested=!taxDone&&tx.ai.tax.val;
  if(codeDone&&taxDone) return {pct:100,bucket:'success',label:'Complete'};
  if((codeDone||codeSuggested)&&(taxDone||taxSuggested)) return {pct:75,bucket:'success',label:'Ready to verify'};
  if(codeDone||codeSuggested) return {pct:50,bucket:'warning',label:'Needs GST code'};
  if(taxDone||taxSuggested) return {pct:50,bucket:'warning',label:'Needs coding'};
  return {pct:15,bucket:'danger',label:'Needs review'};
}
function buildAllWhatsLeftCell(tx){
  const info=txWhatsLeftInfo(tx);
  return `<div class="all-left-cell">
    <div class="all-left-label ${info.bucket}">${info.label}</div>
    <div class="all-left-bar" role="img" aria-label="${info.pct}% complete"><div class="all-left-bar-fill ${info.bucket}" style="width:${info.pct}%"></div></div>
  </div>`;
}
function buildAllGstCell(tx){

function revRejectStyle(txId){
  const e=S.rowReject;
  if(!e||e.txId!==txId) return '';
  const eased=1-Math.pow(1-e.progress,1.65);
  return `--reject-wipe:${(eased*100).toFixed(1)}%;--reject-wipe-num:${eased.toFixed(3)};`;
}
function revRejectRowCls(txId){
  return S.rowReject?.txId===txId?'tr-reject-wiping':'';
}
function revExitStyle(txId){
  const e=S.rowExit;
  if(!e||e.txId!==txId) return '';
  if(e.phase==='swiping') return `transform:translateX(${(-e.progress*110).toFixed(1)}%);opacity:${Math.max(0,1-e.progress*0.92).toFixed(2)};`;
  return `--accept-fill:${(e.progress*100).toFixed(1)}%;`;
}
function revExitRowCls(txId,isCtx,modern){
  const e=S.rowExit;
  const exitActive=e?.txId===txId;
  const cls=[isCtx?(modern?'rev-mod-upd':'tr-upd'):''];
  if(exitActive){
    cls.push('tr-exiting');
    if(e.phase==='processing') cls.push('tr-exiting-processing');
    if(e.paused) cls.push('tr-exiting-paused');
  }
  return cls.filter(Boolean).join(' ');
}
function buildReviewExitOverlay(txId){

function revModConfHtml(conf,why,{field,tx}={}){
  if(!conf||conf<1) return '';
  return `<span class="why-wrap rev-mod-conf">${conf}%${whyTipHtml(why,{field,tx})}</span>`;
}
function revModFieldSuggest(f){
  return !!(f&&f.val&&f.st==='idle'&&(f.conf||0)>=1);
}
function revModFileSuggest(tx){
  const f=tx.ai.file;
  if(f&&f.st==='accepted') return false;
  return revModFieldSuggest(f);
}
function revModTaxSuggest(tx){
  const f=tx.ai.tax;
  if(f&&f.st==='accepted') return false;
  return revModFieldSuggest(f);
}
function revModMatchSuggest(tx){
  const cat=tx.ai.cat, match=tx.ai.match;
  if((cat&&cat.st==='accepted')||(match&&match.st==='accepted')) return false;
  return revModFieldSuggest(cat)||revModFieldSuggest(match);
}
function revModHasAnyAi(tx){
  return revModTaxSuggest(tx)||revModMatchSuggest(tx);
}
function revModIsFullManual(tx){
  return !revModHasAnyAi(tx);
}
function revModGstAmount(tx){
  const f=tx.ai.tax;
  if(!f||!f.val||f.val==='N-T') return null;
  return fmtAbs(Math.abs(tx.amount)/11);
}
function revModTxDesc(tx){
  const parts=tx.desc.split(/\s[–\-]\s*/);
  return parts.length>1?parts.slice(1).join(' – '):tx.desc;
}
function revModPartyName(tx){
  return tx.desc.split(/\s[–\-]/)[0].trim();
}
function revModIsCustomer(tx){
  if(tx.amount>0) return true;
  const m=tx.ai?.match?.val;
  if(m&&/invoice/i.test(m)) return true;
  const cat=tx.ai?.cat?.val;
  if(cat&&/sales|income|revenue/i.test(cat)) return true;
  return false;
}
function revModFindSupplierBrand(name){
  const n=name.toLowerCase();
  return AU_SUPPLIER_BRANDS.find(b=>b.keys.some(k=>n.includes(k)));
}
function revModPartyInitial(name){
  const w=name.replace(/^the\s+/i,'').trim();
  return(w.charAt(0)||'?').toUpperCase();
}

  const name=revModPartyName(tx);

    return `<div class="rev-mod-vendor is-customer" title="${name}">${revModPartyInitial(name)}</div>`;

  const brand=revModFindSupplierBrand(name);
  if(brand){
    const fs=brand.fs||15;
    return `<div class="rev-mod-vendor is-brand" style="background:${brand.bg};color:${brand.fg};font-size:${fs}px" title="${brand.name||name}">${brand.label}</div>`;
  }
  return `<div class="rev-mod-vendor is-supplier" title="${name}">${revModPartyInitial(name)}</div>`;
}

function buildReviewTable(pending, ctxItems){
  const all=[...ctxItems,...pending];
  if(!all.length) return `<div style="padding:48px;text-align:center;color:var(--muted)"><div style="font-size:32px;margin-bottom:8px">✓</div><div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">All caught up</div><div>No transactions need review right now.</div></div>`;

  const bulkBar=sel.size>0?`

  function aiTd(tx, field){
    const f=tx.ai[field];
    if(!f||!f.val) return `<td class="aitd aitd-empty"><span class="aitd-none">No suggestion</span></td>`;
    if(f.st==='rejected') return `<td class="aitd aitd-rejected"><div class="aitd-rej-wrap"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>${f.rejectedVal||f.val}</div><button class="btn-aitd-ed" style="margin-top:3px" onclick="event.stopPropagation();undoRejectAC(${tx.id},'${field}')">Undo</button></td>`;
    if(f.st==='accepted') return `<td class="aitd aitd-accepted"><div class="aitd-acc-wrap"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>${f.val}</div></td>`;
    const dot=f.conf>=85?'#22c55e':f.conf>=65?'#f59e0b':'#ef4444';
    const why=getWhy(tx,field);
    return `<td class="aitd">
      <div class="aitd-inner">
        <span class="aitd-dot" style="background:${dot}"></span>
        <span class="aitd-val" title="${f.val}">${f.val}</span>
        <span class="why-wrap">
          <span class="aitd-pct">${f.conf}%</span>
          ${whyTipHtml(why,{field,tx})}
        </span>
      </div>
      <div class="aitd-btns">
        <button class="btn-aitd-ok" onclick="event.stopPropagation();acceptAC(${tx.id},'${field}')">✓ Accept</button>
        <button class="btn-aitd-ed" onclick="event.stopPropagation();openAside(${tx.id},'review','create')">✏ Edit</button>
        <button class="btn-aitd-rej" onclick="event.stopPropagation();rejectAC(${tx.id},'${field}')" title="Reject suggestion">✕</button>
      </div>
    </td>`;
  }

  const rows=all.map(tx=>{
    const isCtx=tx.newContext;
    const isDone=tx.status==='accepted'||tx.status==='coded';
    const rowCls=isDone?'tr-done':isCtx?'tr-upd':'';
    const amtCls=tx.amount<0?'amt-neg':'amt-pos';

    {key:'file', label:'Attachment', icon:'📎'},
  ];

  const totalWithVal=Object.values(tx.ai).filter(f=>f.val).length;

  return `
  <div class="rc${done?' rc-done':''}${isCtx?' rc-upd':''}" id="rc-${tx.id}">

        ?`<span class="btn-rc-done-msg">✓ All items reviewed</span><div class="rc-foot-sp"></div><button class="btn-rc-skip" onclick="undoAllAI(${tx.id})">Undo</button>`

function buildActionCard(tx, field, label, icon){
  const f=tx.ai[field];
  const isEditing=S.editingCard&&S.editingCard.txId===tx.id&&S.editingCard.field===field;
  const isAcc=f.st==='accepted';
  const conf=f.conf||0;
  const barW=Math.max(conf,5);

  // rejected state
  if(f.st==='rejected'){
    return `
    <div class="ac ac-rej">
      <div class="ac-label">${icon} ${label} <span class="ac-ai">AI</span></div>
      <div class="ac-rej-label">✕ Rejected: ${f.rejectedVal||f.val}</div>
      <div class="ac-foot">
        <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">+ Add manually</button>
        <button class="btn-aundo" onclick="undoRejectAC(${tx.id},'${field}')">Undo</button>
      </div>
    </div>`;
  }

  if(isAcc){
    return `
    <div class="ac ac-acc">
      <div class="ac-label">${icon} ${label}</div>
      <div class="ac-acc-label">✓ ${f.val||'Added'}</div>
      <button class="btn-aundo" onclick="undoAC(${tx.id},'${field}')">Undo</button>
    </div>`;
  }

  if(!f.val&&!isEditing){
    return `
    <div class="ac ac-none">
      <div class="ac-label">${icon} ${label}</div>
      <div class="ac-val none">${field==='file'?'No receipt yet':'Not found'}</div>
      <div class="ac-foot">
        <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">+ ${field==='file'?'Upload':'Add'}</button>
      </div>
    </div>`;
  }

  if(isEditing){
    return `
    <div class="ac ac-editing">
      <div class="ac-label">${icon} ${label}</div>
      <input id="ace-${tx.id}-${field}" class="ac-input" value="${f.val||''}" placeholder="${label}..."/>
      <div style="display:flex;gap:4px">
        <button class="btn-asave" onclick="saveAC(${tx.id},'${field}')">Save</button>
        <button class="btn-acancel" onclick="cancelAC()">Cancel</button>
      </div>
    </div>`;
  }

  const why=getWhy(tx,field);
  return `
  <div class="ac">
    <div class="ac-label">${icon} ${label} <span class="ac-ai">AI</span></div>
    <div class="ac-val">${f.val}</div>
    ${conf>0?`<div class="ac-conf">
      <div class="conf-bar"><div class="conf-fill ${confCls(conf)}" style="width:${barW}%"></div></div>
      <span class="why-wrap">
        <span class="conf-pct">${conf}%</span>
        ${whyTipHtml(why,{field,tx})}
      </span>
    </div>`:''}
    <div class="ac-foot">
      <button class="btn-aok" onclick="acceptAC(${tx.id},'${field}')">✓ Accept</button>
      <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">✏ Edit</button>
      <button class="btn-arej" onclick="rejectAC(${tx.id},'${field}')">✕</button>
    </div>
  </div>`;
}

/* ── SPLIT LINE HANDLERS ──────────────────────── */
const SPLIT_CATS=['Materials','Electrical supplies','Power & gas','Office supplies','Cloud hosting','Sales income','Staff meals','Parking & tolls','Safety & workwear','Design software','General expenses','Equipment hire','Motor vehicle expenses','Compliance & testing','Subcontractor'];
const SPLIT_TAXES=['GST','N-T','CAP','FRE'];
const SPLIT_JOBS=['ECO-0231','ECO-0234','APEX-2025','FANS-2025','HER-2025'];
const SPLIT_DISCOUNTS=['STAFF10','TRADE5','BULK15','LOYAL8'];
const TAB_SPARKLE=`<span class="tab-sparkle" aria-hidden="true">✦</span>`;
const RECORD_TYPE_LABELS={
  spend:'Spend money',bill:'Bill',receive:'Receive money',invoice:'Invoice',transfer:'Transfer',other:'Other',
};

function recordTypeOptions(tx){
  return tx.amount<0?['spend','bill','transfer','other']:['invoice','receive','transfer','other'];
}
function defaultRecordType(tx){
  const hint=getAiAsideHint(tx);
  if(hint.recordType) return hint.recordType;
  return tx.amount<0?'spend':'receive';
}
function getRecordType(txId){
  const tx=ftx(txId);
  if(S.recordTypes?.[txId]) return S.recordTypes[txId];
  return tx?defaultRecordType(tx):'';
}
function setRecordType(txId,val){
  if(!S.recordTypes) S.recordTypes={};
  if(val) S.recordTypes[txId]=val;
  else delete S.recordTypes[txId];
}
function ensureRecordType(txId){
  const tx=ftx(txId); if(!tx) return;
  if(!S.recordTypes) S.recordTypes={};
  if(!S.recordTypes[txId]) S.recordTypes[txId]=defaultRecordType(tx);
}
function recordTypeSelectAiClass(tx){
  const hint=getAiAsideHint(tx);
  if(hint.tab!=='create'||!hint.recordType) return '';
  return getRecordType(tx.id)===hint.recordType?' split-inp-ai':'';
}
function saveNewRecord(txId){
  const tx=ftx(txId); if(!tx) return;
  if(!getRecordType(txId)){ showToast('Select a record type before saving.',2800); return; }
  commitLedger(txId);
}

function getAiCreateExplainerCopy(tx){
  const hint=getAiAsideHint(tx);
  if(hint.tab!=='create') return null;
  if(hint.explainer) return hint.explainer;

  const pre=hint.codePrefill||{};
  const att=ATTACH_DATA[tx.id]?.[0];
  const aiSplit=AI_SPLITS[tx.id];
  const vendor=att?.vendor||tx.desc.split(/[–\-]/)[0]?.trim()||'this supplier';
  const sugTax=pre.tax||tx.ai.tax?.val||att?.extractedTax;
  const sugCat=pre.cat||tx.ai.cat?.val||att?.extractedCat;
  const sugJob=pre.job||tx.ai.job?.val;
  const rejectedTax=tx.ai.tax?.rejectedVal;
  const rejectedCat=tx.ai.cat?.rejectedVal;
  const recType=getRecordType(tx.id)||hint.recordType;
  const receiptDetail=tx.desc.includes('–')?tx.desc.split('–').slice(1).join('–').trim():tx.desc;
  const hasReceipt=!!(att||tx.attach>0);

  if(aiSplit&&aiSplit.lines.length>1){
    const items=aiSplit.lines.map(l=>l.desc).join(', ');
    return {
      kind:'difference',
      body:`The uploaded receipt lists several separate items (${items}) rather than a single purchase total. We have split this into ${aiSplit.lines.length} lines so each item can carry its own category and amount, based on how the receipt breaks down the sale.`,
      check:'Review each line against the receipt and adjust categories, tax codes, or amounts before saving.',
    };
  }

  if(recType==='transfer'||/transfer/i.test(tx.desc)){
    return {
      kind:'difference',
      body:`The suggested tax code is ${sugTax||'N-T'} (not reportable on BAS) because this appears to be a transfer between accounts, while a purchase tax code such as GST would apply if this payment includes taxable business supplies. The record type is set to Transfer to reflect money moving between your own accounts.`,
      check:'Review your bank statement to confirm whether this is a transfer between your own accounts, or a payment for business purchases that include GST.',
    };
  }

  if(rejectedTax&&sugTax&&rejectedTax!==sugTax){
    const gstNote=sugTax==='GST'&&att?.extractedGst
      ? ` The receipt shows GST of $${att.extractedGst.toFixed(2)}, which is roughly 1/11 of the payment — consistent with a standard taxable supply in Australia.`
      : sugTax==='GST'
      ? ' For Australian GST, a tax invoice typically includes GST at about 1/11 of the total amount paid.'
      : '';
    const catNote=rejectedCat&&sugCat&&rejectedCat!==sugCat
      ? ` We have also suggested category "${sugCat}" instead of "${rejectedCat}" because the receipt line items point to that type of expense.`
      : sugCat&&!rejectedCat
      ? ` Category "${sugCat}" matches the items listed on the receipt.`
      : '';
    return {
      kind:'difference',
      body:`You previously had ${rejectedTax} on this transaction, but the uploaded receipt from ${vendor} is a tax invoice. We have suggested ${sugTax} instead.${gstNote}${catNote}`,
      check:'Review the receipt and confirm the correct tax code and category before saving.',
    };
  }

  if(rejectedCat&&sugCat&&rejectedCat!==sugCat){
    return {
      kind:'difference',
      body:`You previously declined "${rejectedCat}" as the category, but the receipt from ${vendor} (${receiptDetail.toLowerCase()}) still points to "${sugCat}" — this is consistent with how you usually code similar purchases from this supplier.`,
      check:'Review the items on the receipt and confirm the category is correct for this purchase.',
    };
  }

  if(tx.ctxOld?.tax&&sugTax&&tx.ctxOld.tax!==sugTax){
    return {
      kind:'difference',
      body:`The suggested tax code is ${sugTax} because the linked receipt indicates this purchase is ${sugTax==='N-T'?'not subject to GST and not reportable on BAS':'a taxable supply'}, while the transaction was previously coded as ${tx.ctxOld.tax}.`,
      check:'Review the receipt and confirm whether GST applies to this purchase.',
    };
  }

  if(tx.ctxOld?.cat&&sugCat&&tx.ctxOld.cat!==sugCat){
    return {
      kind:'difference',
      body:`The suggested category is "${sugCat}" because the linked receipt shows items that fit this account, while the transaction was previously coded as "${tx.ctxOld.cat}".`,
      check:'Review the receipt line items and confirm the category reflects what was actually purchased.',
    };
  }

  if(hasReceipt){
    const detailParts=[];
    if(sugCat) detailParts.push(`category "${sugCat}" from the receipt line items`);
    if(sugTax){
      detailParts.push(sugTax==='GST'&&att?.extractedGst
        ? `tax code ${sugTax} (the invoice shows GST of $${att.extractedGst.toFixed(2)})`
        : `tax code ${sugTax}`);
    }
    if(sugJob) detailParts.push(`job ${sugJob} from your recent coding on similar site purchases`);
    const recLabel=recType&&RECORD_TYPE_LABELS[recType]?`a ${RECORD_TYPE_LABELS[recType].toLowerCase()} record`:'a new record';
    const filled=detailParts.length?detailParts.join(', '):'the fields below from the receipt totals';
    return {
      kind:'difference',
      body:`No open MYOB record matches this bank transaction, so we have set up ${recLabel} from your uploaded receipt from ${vendor}. We have suggested ${filled}.`,
      check:'Review the pre-filled values against the receipt and edit anything that does not look right before saving.',
    };
  }

  const histParts=[];
  if(sugCat) histParts.push(`category "${sugCat}"`);
  if(sugTax) histParts.push(`tax code ${sugTax}`);
  if(sugJob) histParts.push(`job ${sugJob}`);
  return {
    kind:'difference',
    body:`No matching MYOB record was found for this transaction. We have pre-filled ${histParts.join(', ')} based on the transaction description and how you have coded similar payments from ${vendor} before.`,
    check:'Confirm the record type, category, and tax code are correct before saving.',
  };
}
function aiExplainerLabel(kind){
  return kind==='flagged'?'What was flagged:':'What is the difference:';
}
function shouldShowAiCreateExplainer(tx){
  const hint=getAiAsideHint(tx);
  if(hint.tab!=='create') return false;
  const pre=hint.codePrefill||{};
  if(pre.cat||pre.tax||pre.job) return true;
  if(AI_SPLITS[tx.id]) return true;
  if(ATTACH_DATA[tx.id]?.length) return true;
  if(AI_ASIDE_HINTS[tx.id]) return true;
  if(tx.ai.cat?.val||tx.ai.tax?.val||tx.ai.job?.val) return true;
  return false;
}
function buildAiCreateExplainer(tx){
  if(!shouldShowAiCreateExplainer(tx)) return '';
  const copy=getAiCreateExplainerCopy(tx);
  if(!copy?.body) return '';
  const kind=copy.kind||'difference';
  return `
  <div class="ai-create-explainer">
    <div class="ai-create-explainer-head">AI explanation</div>
    <div class="ai-create-explainer-body">
      <p><span class="ai-create-explainer-label">${aiExplainerLabel(kind)}</span> ${copy.body}</p>
      ${copy.check?`<p class="ai-create-explainer-check"><span class="ai-create-explainer-label">What to check:</span> ${copy.check}</p>`:''}
    </div>
  </div>`;
}

function getAiAsideHint(tx){
  if(!tx) return {tab:null};
  if(AI_ASIDE_HINTS[tx.id]) return {...AI_ASIDE_HINTS[tx.id]};
  const match=tx.ai?.match, cat=tx.ai?.cat, tax=tx.ai?.tax, job=tx.ai?.job;
  const hasMatch=(match?.val&&match.st==='idle')||(MATCHES[tx.id]?.length>0)||AI_PRESEL[tx.id];
  if(hasMatch) return {tab:'matches'};
  const codePrefill={
    cat:cat?.val&&cat.st==='idle'?cat.val:'',
    tax:tax?.val&&tax.st==='idle'?tax.val:'',
    job:job?.val&&job.st==='idle'?job.val:'',
  };
  if(codePrefill.cat||codePrefill.tax||codePrefill.job){
    return {tab:'create',recordType:tx.amount<0?'spend':'receive',codePrefill};
  }
  if(/transfer/i.test(tx.desc)) return {tab:'create',recordType:'transfer'};
  return {tab:'create',recordType:tx.amount<0?'spend':'receive'};
}
function buildAsideTabButtons(tx){
  const hint=getAiAsideHint(tx);
  const cur=asideTabNorm(S.asideTab);
  return [
    {id:'matches',label:'Match to existing'},
    {id:'create',label:'Create a new record'},
  ].map(t=>`<button type="button" class="at${cur===t.id?' act':''}${hint.tab===t.id?' at-ai-suggest':''}" onclick="setAsideTab('${t.id}');S.asideSearch='';renderAside()">${t.label}${hint.tab===t.id?TAB_SPARKLE:''}</button>`).join('');
}
function splitFieldAiClass(tx,field,line){
  const hint=getAiAsideHint(tx);
  if(hint.tab!=='create') return '';
  const pre=hint.codePrefill||{};
  const aiVal=field==='cat'?pre.cat||tx.ai.cat?.val
    :field==='tax'?pre.tax||tx.ai.tax?.val
    :field==='job'?pre.job||tx.ai.job?.val
    :field==='discount'?pre.discount:'';
  if(!aiVal) return '';
  const cur=line[field]||'';
  if(!cur||cur===aiVal) return 'split-inp-ai';
  return '';
}
function splitOptsOpen(txId,lineId){
  return !!S.splitLineOpts?.[`${txId}:${lineId}`];
}
function toggleSplitLineOpts(txId,lineId){
  const key=`${txId}:${lineId}`;
  if(!S.splitLineOpts) S.splitLineOpts={};
  S.splitLineOpts[key]=!S.splitLineOpts[key];
  renderAside();
}
function defaultSplitLine(tx){
  const hint=getAiAsideHint(tx);
  const pre=hint.codePrefill||{};
  return {
    id:1,
    desc:tx.desc,
    cat:pre.cat||tx.ai.cat?.val||'',
    tax:pre.tax||tx.ai.tax?.val||'GST',
    amount:tx.amount,
    job:pre.job||tx.ai.job?.val||'',
    discount:pre.discount||'',
  };
}
function buildSplitLineJobSelect(tx,line){

}
function buildSplitLineDiscountSelect(tx,line){

}
function buildSplitLineExtras(tx,line,compact){

function initSplitLines(txId){
  if(S.splitLines[txId]) return;
  const tx=ftx(txId);
  const aiSplit=AI_SPLITS[txId];
  if(aiSplit){
    S.splitLines[txId]=aiSplit.lines.map(l=>({job:'',discount:'',...l}));
  }else{
    S.splitLines[txId]=[{...defaultSplitLine(tx)}];
  }
}

function addSplitLine(txId){
  const lines=S.splitLines[txId]||[];
  const newId=Math.max(0,...lines.map(l=>l.id))+1;
  lines.push({id:newId, desc:'', cat:'', tax:'GST', amount:0, job:'', discount:''});
  render();
}

function removeSplitLine(txId, lineId){
  S.splitLines[txId]=S.splitLines[txId].filter(l=>l.id!==lineId);
  render();
}

function updateSplitLine(txId, lineId, field, val){
  const lines=S.splitLines[txId]; if(!lines) return;
  const line=lines.find(l=>l.id===lineId); if(!line) return;
  line[field]=field==='amount'?parseFloat(val)||0:val;
  // Update remaining counter without full re-render
  updateRemaining(txId);
}

function updateRemaining(txId){
  const tx=ftx(txId); if(!tx) return;
  const lines=S.splitLines[txId]||[];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  const rem=(total-used).toFixed(2);
  const remOk=Math.abs(parseFloat(rem))<0.01;
  const el=document.getElementById(`split-rem-${txId}`);
  if(el){
    el.textContent=remOk?'✓ Fully allocated':('$'+Math.abs(parseFloat(rem)).toFixed(2)+(parseFloat(rem)<0?' over':''));
    el.className='split-rem '+(remOk?'ok':parseFloat(rem)<0?'over':'');
  }
}

function commitLedger(txId){
  const tx=ftx(txId);
  const lines=S.splitLines[txId]||[];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  if(Math.abs(total-used)>0.01){ showToast('Allocate remaining amount before committing.',3000); return; }
  tx.status='coded';
  markTxReviewDone(txId);
  Object.values(tx.ai).forEach(f=>{if(f.val&&f.st==='idle')f.st='accepted';});
  addToContext(txId,'cat');
  showContextToast();
  closeAside();
  render();
  const n=lines.length;
  showToast(`✓ ${tx.desc} — ${RECORD_TYPE_LABELS[getRecordType(txId)]||'Record'} saved with ${n} line${n>1?'s':''}`, 4000);
}

function confirmMatch(txId){
  const tx=ftx(txId); if(!tx) return;
  const sel=S.matchSel[txId]||{};
  const refs=Object.keys(sel);
  if(!refs.length){ showToast('Select at least one record to match.',2500); return; }
  const names=Object.values(sel);
  tx.source='both';
  tx.status='accepted';
  tx.ai.match.val=names.join(', ');
  tx.ai.match.st='accepted';
  addToContext(txId,'match');
  delete S.matchSel[txId];
  closeAside();
  render();
  showToast(`✓ Matched to ${refs.length} record${refs.length>1?'s':''}: ${names.slice(0,2).join(', ')}${names.length>2?` +${names.length-2} more`:''} — <a href="#" onclick="event.preventDefault();viewContext()" style="color:var(--lavender);text-decoration:underline">Context saved →</a>`, 4500);
}

function buildAsideMatches(tx,compact){
  if(tx.source==='myob') return `

    </div>`;
  if(tx.status==='accepted'||tx.source==='both'){
    const matchNames=(tx.ai.match.val||'').split(', ').filter(Boolean);
    return `
    <div style="background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--r8);padding:12px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:6px">✓ Matched to ${matchNames.length} MYOB record${matchNames.length!==1?'s':''}</div>
      ${matchNames.map(n=>`<div style="font-weight:600;font-size:15px;margin-bottom:2px">${n}</div>`).join('')}
    </div>
    <button onclick="undoAllAI(${tx.id});delete S.matchSel[${tx.id}];closeAside();render()" style="width:100%;padding:7px;background:#fff;color:var(--red);border:1px solid #fca5a5;border-radius:var(--r4);font-size:14px;cursor:pointer;font-family:var(--font)">Unmatch & undo</button>`;
  }

  if(!S.matchSel[tx.id]) S.matchSel[tx.id]={};
  const sel=S.matchSel[tx.id];
  const selCount=Object.keys(sel).length;

  const aiMatches=MATCHES[tx.id]||[];
  const q=S.asideSearch.toLowerCase();
  const aiRefs=new Set(aiMatches.map(m=>m.ref));
  const allFiltered=ALL_RECORDS.filter(r=>{
    if(aiRefs.has(r.ref)) return false;
    if(!q) return true;
    return r.ref.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)||r.type.toLowerCase().includes(q);
  });
  const aiFiltered=q?aiMatches.filter(m=>m.ref.toLowerCase().includes(q)||m.name.toLowerCase().includes(q)):aiMatches;

  // Check if AI pre-selected multiple records (multi-match scenario)
  const presel=AI_PRESEL[tx.id]||[];
  const isMultiSuggest=presel.length>1;
  const aiSelCount=aiFiltered.filter(m=>sel[m.ref]).length;
  const allAiPreselSelected=presel.length>0&&presel.every(ref=>sel[ref]);

  // Compute combined amount of all selected records
  const allRecs=[...aiMatches,...ALL_RECORDS];
  const selTotal=Object.keys(sel).reduce((s,ref)=>{
    const r=allRecs.find(x=>x.ref===ref); return s+(r?Math.abs(r.amount):0);
  },0);
  const txAbs=Math.abs(tx.amount);
  const totalMatch=Math.abs(selTotal-txAbs)<0.01;

  const searchHtml=`
  <div class="${compact?'pane-match-toolbar':''}">
    <div class="aside-search-wrap">
      <span class="aside-search-ico"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="4.5"/><line x1="9.5" y1="9.5" x2="13" y2="13"/></svg></span>
      <input class="aside-search" placeholder="Search MYOB records…" value="${S.asideSearch}"
        oninput="S.asideSearch=this.value;updateMatchSearch()">
    </div>
  </div>`;

  const aiCards=aiFiltered.map(m=>{
    const isSel=!!sel[m.ref];
    return `
    <div class="mi${isSel?' mi-sel':''}" onclick="toggleMatchSel(${tx.id},'${m.ref}','${m.name.replace(/'/g,"\\'")}')">

      <div class="mi-body">
        <div class="mi-head">
          <div class="mi-name">${m.ref} · ${m.name}</div>
          <span class="why-wrap"><span class="mi-conf ${confPct(m.conf)}">${m.conf}%</span>
            ${whyTipHtml(getWhy(tx,'match'),{field:'match',head:'Why this match?',tx})}
          </span>
        </div>
        <div class="mi-sub">${m.type} · ${fmtAbs(m.amount)}</div>
        ${compact?'':matchSignalsHtml(getMatchSignals(tx,'match'))}
      </div>
    </div>`;
  }).join('');

  if(compact){
    return `
    ${searchHtml}

function buildAsideLineItems(tx,compact){
  initSplitLines(tx.id);

  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  const rem=(total-used).toFixed(2);

  return `

}

function buildAsideCreate(tx,compact){

/* ── Unmatch ── */
function unmatch(txId){
  const tx=ftx(txId); if(!tx) return;
  tx.status='pending';
  // Reset accepted AI fields back to idle so they reappear as suggestions
  ['cat','match','tax'].forEach(f=>{
    if(tx.ai[f]&&tx.ai[f].st==='accepted') tx.ai[f].st='idle';
  });
  showToast('↩ Unmatched — transaction returned to review');
  render();
}

function openAttachModal(txId, attIdx){
  S.attachModal={txId,attIdx:attIdx||0};
  render();
}
function closeAttachModal(){
  S.attachModal=null;
  render();
}
function confirmAttachment(txId){
  const tx=ftx(txId); if(!tx) return;
  tx.ai.cat.st='accepted';
  showToast('✓ Receipt accepted — match confirmed');
  closeAttachModal();
}
function reassignFromAttachment(txId, newCat){
  const tx=ftx(txId); if(!tx) return;
  tx.ai.cat.val=newCat;
  tx.ai.cat.st='accepted';
  tx.status='coded';
  markTxReviewDone(txId);
  showToast(`✓ Recoded to "${newCat}" based on receipt`);
  closeAttachModal();
}
function rejectAttachment(txId){
  showToast('Receipt rejected — transaction unchanged');
  closeAttachModal();
}
function uploadAttachmentReceipt(txId, input){
  const tx=ftx(txId); if(!tx) return;
  const atts=ATTACH_DATA[txId]?[...ATTACH_DATA[txId]]:[];
  const idx=atts.length;
  const picked=input?.files?.[0];
  const names=['receipt.jpg','invoice.pdf','tax-invoice.jpg','eftpos-receipt.jpg','delivery-docket.pdf'];
  const fileName=picked?.name||names[idx%names.length];
  const vendor=tx.desc.split(/\s[–\-]/)[0].trim();
  const extractedCat=tx.ai.cat?.val||tx.ai.cat?.rejectedVal||'Office supplies';
  const extractedTax=tx.ai.tax?.val||tx.ai.tax?.rejectedVal||'GST';
  const amt=Math.abs(tx.amount);
  const gst=+(amt/11).toFixed(2);
  atts.push({
    id:`att-${txId}-${idx}-${Date.now()}`,
    name:fileName,
    vendor,
    extractedAmt:amt,
    extractedGst:gst,
    extractedDate:tx.date,
    extractedCat,
    extractedTax,
    invoiceRef:tx.ai.match?.val||null,
    confidence:85+((txId+idx)%12),
    fields:['vendor','amount','date','gst'],
    isNew:true,
  });
  ATTACH_DATA[txId]=atts;
  tx.attach=atts.length;
  if(tx.ai.file){
    tx.ai.file.val=fileName;
    tx.ai.file.st='idle';
    tx.ai.file.conf=atts[atts.length-1].confidence;
  }
  S.attachModal={txId,attIdx:idx};
  if(input) input.value='';
  render();
  showToast(`✓ ${fileName} uploaded — review extracted fields`,2800);
}

function startEditSection(id){S.bizCtxEditing=id;render();}
function cancelEditSection(){S.bizCtxEditing=null;render();}
function saveSection(id){
  const sec=S.bizCtx.sections.find(s=>s.id===id); if(!sec) return;
  const ta=document.getElementById(`biz-ta-${id}`);
  if(ta&&ta.value.trim()) sec.text=ta.value.trim();
  S.bizCtx.lastUpdated='just now';
  S.bizCtxEditing=null;
  render();
  showToast('✓ Context updated');
}
function submitBizCtxUpdate(){
  const inp=document.getElementById('biz-nl-inp');
  if(!inp||!inp.value.trim()) return;
  const raw=inp.value.trim();
  inp.value='';

  // Route to appropriate section by keyword
  const lower=raw.toLowerCase();
  let targetId='company';
  if(/never|don.t|exclude|ignore|skip|won.t/i.test(raw)) targetId='goals';
  else if(/tax|gst|n-t|bas|fre|free|exempt/i.test(raw)) targetId='financial';
  else if(/match|invoice|bill|record|supplier|payee|code|category/i.test(raw)) targetId='industry';
  else if(/prefer|priorit|manual|auto|suggest|employee|staff|payroll/i.test(raw)) targetId='employees';

  // Show thinking state then apply
  const thinking=document.getElementById('biz-thinking');
  if(thinking) thinking.style.display='flex';
  setTimeout(()=>{
    const sec=S.bizCtx.sections.find(s=>s.id===targetId);
    if(sec){
      // Append the instruction as a new sentence
      const instruction=raw.endsWith('.')||raw.endsWith('!')?raw:raw+'.';
      sec.text=sec.text+' '+instruction;
      S.bizCtx.lastUpdated='just now';
    }
    S.bizCtxEditing=null;
    render();
    showToast('✓ Business context updated');
  }, 1200);
  render(); // re-render to show thinking state
}

function memCardSummary(m){
  if(m.summary) return m.summary;
  const val=m.conditions[0]?.val||m.entity;
  if(m.source==='rejected'){
    if(m.memType==='category') return `Never suggest category "${m.action.cat}" for ${m.entity}.`;
    return `Never match ${m.entity} to ${m.action.entity||'records'}.`;
  }
  if(m.memType==='category') return `When the payee includes "${val}", code as ${m.action.cat}${m.action.tax?' with '+m.action.tax:''}.`;
  if(m.memType==='match') return `When the payee includes "${val}", match to open ${m.action.matchType||'record'}.`;
  if(m.memType==='split') return `When the payee includes "${val}", split across ${m.action.cat||'categories'}.`;
  if(m.memType==='tax') return `When the payee includes "${val}", assign ${m.action.tax||'GST'} tax code.`;
  return m.note||'';
}
function memCardFlow(m){
  if(m.source==='rejected'){
    const target=m.memType==='category'?m.action.cat:(m.action.entity||'Excluded');
    return {from:{ico:'out',label:m.entity},kind:'stop',to:{ico:'stop',label:target}};
  }
  if(m.memType==='match'){
    const label=m.action.entity||`Open ${m.action.matchType||'record'}`;
    return {from:{ico:'in',label:m.entity},kind:'arrow',to:{ico:'match',label}};
  }
  if(m.memType==='split'){
    return {from:{ico:'out',label:m.entity},kind:'split',to:{ico:'split',label:m.action.cat||'Split lines'}};
  }
  if(m.memType==='tax'){
    return {from:{ico:'tax',label:m.entity},kind:'split',to:{ico:'tax',label:`${m.action.tax||'GST'} · ${m.action.cat||'Tax code'}`}};
  }
  return {from:{ico:'out',label:m.entity},kind:'arrow',to:{ico:'cat',label:m.action.cat||'Category'}};
}

function buildSettings(){
  if(!S.stgSection) return buildStgAiOverview();
  if(S.stgSection==='all'||S.stgSection==='transactions'||S.stgSection==='automatch') return buildStgTransactions();
  if(S.stgSection==='memory'||S.stgSection==='bizcxt') return buildStgMemorySummary();
  if(S.stgSection==='attachments') return buildStgAttachments();
  if(S.stgSection==='taxcodes') return buildStgTaxCodes();
  return buildStgAiOverview();
}

function dismissSuggestedRule(id){
  const r=S.rules.find(x=>x.id===id);
  if(r) r.suggested=false;
  if(S.asideRule?.source==='suggested'&&S.asideRule.id===id) closeAside();
  else render();
}
function turnIntoRule(id){
  const r=S.rules.find(x=>x.id===id);
  if(r) r.suggested=false;
  showToast('✓ Rule saved');
  if(S.asideRule?.source==='suggested'&&S.asideRule.id===id) closeAside();
  else render();
}
function buildSuggestedRulesBlock(){
  const rules=S.rules.filter(r=>r.suggested&&r.active!==false);
  if(!rules.length) return '';
  return `
    <div style="margin-bottom:24px">
      <h2 class="stg-ai-page-title" style="font-size:16px;margin-bottom:12px">Suggested rules</h2>

        ${rules.map(r=>{
          const isOpen=S.asideRule?.source==='suggested'&&S.asideRule.id===r.id;
          return `
        <div class="mem-entry mem-entry-clickable${isOpen?' is-open':''}" onclick="openRuleAside(${r.id},'suggested')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openRuleAside(${r.id},'suggested')}">

/* ─── Rule wizard ──────────────────────────────────────── */
function buildRuleWizard(){
  const w=S.ruleWiz;
  const steps=['Rule type','Conditions','Action','Review'];

  const stepBar=steps.map((s,i)=>{
    const n=i+1;
    const st=n<w.step?'done':n===w.step?'active':'idle';
    return `${i>0?`<div class="rwiz-connector ${n<=w.step?'done':''}"></div>`:''}
    <div class="rwiz-step">
      <div class="rwiz-num ${st}">${st==='done'?'✓':n}</div>
      <span class="rwiz-label ${st}">${s}</span>
    </div>`;
  }).join('');

  /* ── Step 1: type ── */
  let body='';
  if(w.step===1){
    const types=[
      {t:'category',icon:'⚡',title:'Category',   desc:'Assign a category and tax code when a transaction matches.'},
      {t:'invoice', icon:'📄',title:'Invoice',    desc:'Match the transaction to open customer invoices.'},
      {t:'bill',    icon:'🧾',title:'Bill',       desc:'Match the transaction to unpaid supplier bills.'},
    ];
    body=`
    <div style="font-size:15px;font-weight:700;margin-bottom:5px">What should this rule do?</div>
    <div style="font-size:15px;color:var(--muted);margin-bottom:22px">Choose how MYOB should handle matching transactions.</div>
    <div class="rtype-grid">
      ${types.map(t=>`
      <div class="rtype-card ${w.type===t.t?'sel':''}" onclick="wizSetType('${t.t}')">
        <div class="rtype-icon">${t.icon}</div>
        <div class="rtype-title">${t.title}</div>
        <div class="rtype-desc">${t.desc}</div>
      </div>`).join('')}
    </div>`;
  }

  /* ── Step 2: conditions ── */
  if(w.step===2){
    const fieldOpts=[
      {v:'payee',  l:'Payee name'},
      {v:'desc',   l:'Description'},
      {v:'amount', l:'Amount'},
      {v:'account',l:'Bank account'},
    ];
    const opOpts=f=>f==='amount'
      ?[{v:'eq',l:'equals'},{v:'gt',l:'is greater than'},{v:'lt',l:'is less than'}]
      :[{v:'contains',l:'contains'},{v:'is',l:'is exactly'},{v:'starts',l:'starts with'}];
    body=`
    <div style="font-size:15px;font-weight:700;margin-bottom:5px">When a transaction...</div>
    <div style="font-size:15px;color:var(--muted);margin-bottom:20px">All conditions must match for the rule to apply.</div>
    ${w.conditions.map((c,i)=>`
      ${i>0?`<div class="cond-and-row"><span class="cond-and">AND</span><div style="flex:1;height:1px;background:var(--border)"></div></div>`:''}
      <div class="cond-row">
        <select class="cond-sel" onchange="wizUpdateCond(${c.id},'field',this.value)">
          ${fieldOpts.map(f=>`<option value="${f.v}"${c.field===f.v?' selected':''}>${f.l}</option>`).join('')}
        </select>
        <select class="cond-sel" onchange="wizUpdateCond(${c.id},'op',this.value)">
          ${opOpts(c.field).map(o=>`<option value="${o.v}"${c.op===o.v?' selected':''}>${o.l}</option>`).join('')}
        </select>
        <input class="cond-inp" type="${c.field==='amount'?'number':'text'}"
          placeholder="${c.field==='amount'?'0.00':'Enter value…'}"
          value="${c.val}"
          onchange="wizUpdateCondVal(${c.id},this.value)">
        ${w.conditions.length>1?`<button class="cond-del" onclick="wizRemoveCond(${c.id})" title="Remove">×</button>`:'<div style="width:20px"></div>'}
      </div>`).join('')}
    <button class="btn-add-cond" onclick="wizAddCond()">+ Add condition</button>`;
  }

  /* ── Step 3: action ── */
  if(w.step===3){
    const cats=['Advertising','Bank charges','Computer expenses','Consulting fees','Entertainment','Freight & delivery','Insurance','Interest expense','Legal fees','Materials','Motor vehicle','Office supplies','Power & gas','Printing & stationery','Rent & occupancy','Repairs & maintenance','Safety & workwear','Staff meals','Subscriptions','Telephone & internet','Travel','Wages & salaries'];
    const taxCodes=[
      {v:'GST',l:'GST (10%) — Standard'},
      {v:'N-T',l:'N-T — BAS excluded'},
      {v:'FRE',l:'FRE — GST-free'},
      {v:'CAP',l:'CAP — Capital acquisition'},
      {v:'INP',l:'INP — Input-taxed'},
    ];
    if(w.type==='category'){
      body=`
      <div style="font-size:15px;font-weight:700;margin-bottom:5px">Then assign...</div>
      <div style="font-size:15px;color:var(--muted);margin-bottom:22px">Choose the category and tax code to apply.</div>
      <div class="act-field">
        <label class="act-label">Category</label>
        <select class="act-sel" onchange="wizUpdateActionRender('cat',this.value)">
          <option value="">Select a category…</option>
          ${cats.map(c=>`<option value="${c}"${w.action.cat===c?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="act-field">
        <label class="act-label">Tax code</label>
        <select class="act-sel" onchange="wizUpdateActionRender('tax',this.value)">
          ${taxCodes.map(t=>`<option value="${t.v}"${w.action.tax===t.v?' selected':''}>${t.l}</option>`).join('')}
        </select>
      </div>`;
    } else {
      const entityType=w.type==='invoice'?'Customer':'Supplier';
      const entityHint=w.type==='invoice'?'invoices':'bills';
      body=`
      <div style="font-size:15px;font-weight:700;margin-bottom:5px">Then match to...</div>
      <div style="font-size:15px;color:var(--muted);margin-bottom:22px">Specify which ${entityType.toLowerCase()}'s ${entityHint} to match against.</div>
      <div class="act-field">
        <label class="act-label">${entityType}</label>
        <input class="act-inp" type="text" placeholder="Enter ${entityType.toLowerCase()} name…"
          value="${w.action.entity}"
          onchange="wizUpdateAction('entity',this.value)">
      </div>
      <div style="font-size:14px;color:var(--muted);margin-top:-8px;line-height:1.5">
        Leave blank to match against any ${entityType.toLowerCase()}'s ${entityHint}.
      </div>`;
    }
  }

  /* ── Step 4: review ── */
  if(w.step===4){
    const condDesc=w.conditions.filter(c=>c.val).map(c=>{
      const fl={payee:'Payee',desc:'Description',amount:'Amount',account:'Bank account'}[c.field]||c.field;
      const ol={contains:'contains',is:'is exactly',starts:'starts with',eq:'=',gt:'>',lt:'<'}[c.op]||c.op;
      return `${fl} ${ol} "${c.val}"`;
    }).join(' AND ')||'(any transaction)';
    let actionDesc='';
    if(w.type==='category') actionDesc=`Assign "${w.action.cat||'?'}"${w.action.tax?' · '+w.action.tax:''}`;
    else if(w.type==='invoice') actionDesc=`Match to invoices${w.action.entity?' from '+w.action.entity:''}`;
    else actionDesc=`Match to bills${w.action.entity?' from '+w.action.entity:''}`;
    const typeL={category:'Category',invoice:'Invoice',bill:'Bill'}[w.type];
    const typeCl={category:'rb-cat',invoice:'rb-inv',bill:'rb-bill'}[w.type];
    body=`
    <div style="font-size:15px;font-weight:700;margin-bottom:5px">Review & save</div>
    <div style="font-size:15px;color:var(--muted);margin-bottom:20px">Confirm the rule details and give it a name.</div>
    <label style="font-size:14px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em">Rule name</label>
    <input id="rwiz-name-inp" class="rwiz-name-input" type="text" value="${w.name||''}"
      placeholder="Name this rule…"
      oninput="S.ruleWiz.name=this.value;S.ruleWiz.nameAuto=false">
    <div class="rwiz-summary">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
        <span class="rb ${typeCl}">${typeL}</span>
        <span style="font-size:16px;font-weight:700;color:var(--text)">${w.name||'Untitled rule'}</span>
      </div>
      <div class="rwiz-sum-row">
        <span class="rwiz-sum-label">When</span>
        <span class="rwiz-sum-val">${condDesc}</span>
      </div>
      <div class="rwiz-sum-row">
        <span class="rwiz-sum-label">Then</span>
        <span class="rwiz-sum-val">${actionDesc}</span>
      </div>
    </div>`;
  }

  /* ── Footer ── */
  const canNext=w.step===2
    ? w.conditions.some(c=>c.val.trim())
    : w.step===3
      ? (w.type==='category' ? !!w.action.cat : true)
      : true;

  const footer=`
  <div class="rwiz-footer">
    ${w.step===1
      ? `<button class="btn-wiz-cancel" onclick="wizBack()">Cancel</button><div></div>`
      : `<button class="btn-wiz-back" onclick="wizBack()">← Back</button>`}
    ${w.step===4
      ? `<button class="btn-wiz-save" onclick="saveRule()">Save rule</button>`
      : w.step===1
        ? '' // auto-advances on card click
        : `<button class="btn-wiz-next" ${canNext?'':'disabled'} onclick="wizNext()">Next →</button>`}
  </div>`;

  return buildStgAiShell([
    {label:'Settings',onclick:'goHub()'},
    {label:'AI',onclick:"S.stgSection=null;render()"},
    {label:'Transaction automatching',onclick:'S.ruleWiz=null;render()'},
    {label:'Create rule'},
  ],`
    <div class="rwiz">
      <div class="rwiz-steps">${stepBar}</div>
      ${body}
      ${footer}
    </div>`);
}

initAttachments();
document.addEventListener('click',()=>{
  if(S.acctMenuOpen){S.acctMenuOpen=false;S.acctMenuFrom=null;render();}
});
(function initFromUrl(){
  const params=new URLSearchParams(location.search);
  if(params.get('tab')==='review'||location.hash==='#review') S.tab='review';
  if(params.get('tab')==='prebas'||location.hash==='#prebas') S.tab='prebas';
  if(params.get('page')==='settings'||location.hash==='#settings'){
    S.page='settings';
    S.stgSection=null;
    const sec=params.get('section');
    if(sec) S.stgSection=sec;
  }
  const bank=params.get('bank');
  if(bank&&BANKS.some(b=>b.id===bank)) S.bankFilter=bank;
})();
render();
</script>
</body>
</html>
