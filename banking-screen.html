function buildReviewTab(){
  const pending=pendingList();
  const ctxItems=ctxList();
  const all=[...ctxItems,...pending];
  const withAttach=TX.filter(t=>t.attach>0&&t.status!=='coded'&&t.status!=='accepted');
  // Tax scope: tx with pending tax suggestion
  const withTax=pending.filter(t=>t.ai.tax.val&&t.ai.tax.st==='idle');

  // Scope-filtered list
  let scopeList=all;
  if(S.revScope==='attachments') scopeList=withAttach;
  else if(S.revScope==='taxcodes') scopeList=withTax;

  const attach=tx=>{
    if(tx.attach>0) return `<div class="att-w"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.5 5.5l-4 4A2.8 2.8 0 112.5 5.5l4-4a1.5 1.5 0 012.1 2.1L4.5 7.7a.3.3 0 01-.4-.4l3.5-3.5"/></svg><span class="att-ct">${tx.attach}</span></div>`;
    return `<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#ccc" stroke-width="1.7"><path d="M10.5 5.5l-4 4A2.8 2.8 0 112.5 5.5l4-4a1.5 1.5 0 012.1 2.1L4.5 7.7a.3.3 0 01-.4-.4l3.5-3.5"/></svg>`;
  };

  // Primary suggestion per row (ONE per row)
  const primarySug=(tx)=>{
    if(S.revScope==='taxcodes') return tx.ai.tax;
    // Prefer match over cat for transactions scope
    if(tx.ai.match.val&&tx.ai.match.st==='idle') return tx.ai.match;
    if(tx.ai.cat.val&&tx.ai.cat.st==='idle') return tx.ai.cat;
    return null;
  };

  const confLabel=conf=>conf>=90?'Similar past matches':conf>=75?'Details match':'Possible match';

  const sugCell=(tx)=>{
    const sug=primarySug(tx);
    const isDone=tx.status==='coded'||tx.status==='accepted';
    if(isDone){
      const val=tx.ai.match.val||tx.ai.cat.val||'—';
      return `<div style="display:flex;align-items:center;gap:6px"><span style="font-size:11px;color:var(--green);font-weight:600">✓</span><span style="font-size:13px;font-weight:500">${val}</span></div>`;
    }
    if(S.revScope==='attachments'){
      const atts=ATTACH_DATA[tx.id]||[];
      if(!atts.length) return `<div style="font-size:12px;color:var(--muted)">No attachments</div>`;
      const first=atts[0];
      const extra=atts.length>1?`<span class="att-more" onclick="event.stopPropagation();openAttachModal(${tx.id},1)">+${atts.length-1} more</span>`:'';
      const isCoded=tx.status==='coded'||tx.status==='accepted';
      const currentMatch=isCoded?(tx.ai.match.val||tx.ai.cat.val):null;
      const diff=currentMatch&&first.extractedCat&&first.extractedCat!==currentMatch;
      return `
      <div class="att-thumb-wrap">
        <div class="att-thumb" onclick="event.stopPropagation();openAttachModal(${tx.id},0)" title="Click to preview">
          <div class="att-thumb-inner">
            <div class="att-line dark" style="width:70%"></div>
            <div class="att-line dark short"></div>
            <div class="att-line" style="width:80%;margin-top:3px"></div>
            <div class="att-line hl" style="width:90%"></div>
            <div class="att-line" style="width:60%"></div>
            <div class="att-line" style="width:75%"></div>
            <div class="att-line hl-green" style="width:90%"></div>
            <div class="att-line" style="width:40%"></div>
            <div class="att-line" style="width:85%"></div>
            <div class="att-line hl" style="width:70%"></div>
          </div>
        </div>
        ${extra}
        <div style="flex:1;min-width:0">
          ${diff?`<div style="font-size:10px;font-weight:700;color:var(--amber);margin-bottom:2px">⚠ May need recoding</div>`:`<div style="font-size:10px;font-weight:600;color:var(--purple);margin-bottom:2px">✦ ${first.confidence}% match</div>`}
          <div style="font-size:12px;font-weight:600">${first.extractedCat}</div>
          <div style="font-size:11px;color:var(--muted)">${first.vendor}</div>
          <div style="display:flex;gap:6px;margin-top:6px">
            <button class="btn-sug-acc" onclick="event.stopPropagation();confirmAttachment(${tx.id})">✓ Accept</button>
            <button class="btn-sug-rej" onclick="event.stopPropagation();rejectAttachment(${tx.id})">✗ Reject</button>
          </div>
        </div>
      </div>`;
    }
    if(S.revScope==='taxcodes'){
      if(!sug||!sug.val) return `<div style="font-size:12px;color:var(--muted)">No tax suggestion</div>`;
      if(sug.st==='accepted') return `<div style="display:flex;align-items:center;gap:6px"><span style="font-size:11px;color:var(--green);font-weight:600">✓</span><span style="font-size:13px;font-weight:500">${sug.val}</span></div>`;
      const conf=sug.conf||82;
      return `
      <div class="sug-cell">
        <div class="sug-conf">
          <span class="sug-conf-star">✦</span>
          ${conf}% · Based on supplier history · <span class="sug-why">See why</span>
        </div>
        <div class="sug-name">${sug.val} <span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;cursor:help;" title="Tax code info">i</span></div>
        <div class="sug-acct" style="margin-bottom:4px">Applied to $${Math.abs(tx.amount).toFixed(2)} = $${(Math.abs(tx.amount)/11).toFixed(2)} tax</div>
        <div class="sug-actions">
          <button class="btn-sug-acc" onclick="event.stopPropagation();acceptAC(${tx.id},'tax')">✓ Accept</button>
          <button class="btn-sug-rej" onclick="event.stopPropagation();rejectAC(${tx.id},'tax')">✗ Reject</button>
        </div>
      </div>`;
    }
    if(!sug||!sug.val) return `<div style="font-size:12px;color:var(--muted)">No suggestion yet</div>`;
    const conf=sug.conf||85;
    const why=getWhy(tx, tx.ai.match.val&&tx.ai.match.st==='idle'?'match':'cat');
    return `
    <div class="sug-cell">
      <div class="sug-conf">
        <span class="sug-conf-star">✦</span>
        ${conf}% · ${confLabel(conf)} · <span class="sug-why" onclick="event.stopPropagation()" title="${why||'Based on your past transactions'}">See why</span>
      </div>
      <div class="sug-name">${sug.val} <span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;cursor:help;" title="AI suggestion">i</span></div>
      <div class="sug-acct">${tx.ai.cat.st!=='accepted'?'Expense account':'Income account'} · ${Math.abs(tx.amount).toFixed(2)}</div>
      <div class="sug-actions">
        <button class="btn-sug-acc" onclick="event.stopPropagation();acceptAC(${tx.id},'${tx.ai.match.val&&tx.ai.match.st==='idle'?'match':'cat'}')">✓ Accept</button>
        <button class="btn-sug-rej" onclick="event.stopPropagation();rejectAC(${tx.id},'${tx.ai.match.val&&tx.ai.match.st==='idle'?'match':'cat'}')">✗ Reject</button>
      </div>
    </div>`;
  };

  const sortIco=`<span class="sort-ico">↕</span>`;
  const rows=scopeList.length?scopeList.map(tx=>`
    <tr onclick="openAside(${tx.id},'review','matches')" style="cursor:pointer">
      <td style="padding:8px 12px" onclick="event.stopPropagation()"><input type="checkbox" style="width:13px;height:13px;accent-color:var(--purple);cursor:pointer"></td>
      <td style="color:var(--muted);font-size:12px;white-space:nowrap">${tx.date}</td>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="tx-icon${tx.amount>0?' green':''}">${tx.desc.charAt(0).toUpperCase()}</div>
          <div>
            <div class="tx-ref">${tx.ref||tx.desc}</div>
            <div class="tx-bank">${tx.desc}</div>
          </div>
        </div>
      </td>
      <td style="text-align:right"><span class="${tx.amount<0?'amt-neg':'amt-pos'}">${fmt(tx.amount)}</span></td>
      <td style="text-align:center">${attach(tx)}</td>
      <td class="tax-cell">
        <div class="tax-code">${tx.ai.tax.val||'—'}</div>
        ${tx.ai.tax.val&&tx.amount?`<div style="font-size:11px">${fmt(Math.abs(tx.amount)*0.1)}</div>`:''}
      </td>
      <td style="min-width:240px">${sugCell(tx)}</td>
      <td style="width:28px;text-align:center" onclick="event.stopPropagation();openAside(${tx.id},'review','matches')">
        <span class="rev-chev">›</span>
      </td>
    </tr>`).join(''):`
    <tr><td colspan="8" style="text-align:center;padding:48px;color:var(--muted)">
      <div style="font-size:28px;margin-bottom:8px">✓</div>
      <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px">All done here</div>
      <div style="font-size:12px">No ${S.revScope} need review right now.</div>
    </td></tr>`;

  return `
  <div class="fade-in">
    ${buildActionRequired('review')}
    ${buildFilterBar()}
    <div class="scope-pill-row">
      ${[
        {v:'transactions',l:'Transactions',ct:all.length},
        {v:'attachments',l:'Attachments',ct:withAttach.length},
        {v:'taxcodes',l:'Tax codes',ct:withTax.length},
      ].map(p=>`<button class="scope-pill${S.revScope===p.v?' act':''}" onclick="S.revScope='${p.v}';render()">${p.l}<span class="scope-ct">${p.ct}</span></button>`).join('')}
      <div class="fbar2-sp"></div>
      <div class="fpill">Source: All transactions, M... <span class="arr">▾</span></div>
      <div class="fpill">Type: Deposit, Transfer, With... <span class="arr">▾</span></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="all-tbl">
        <thead>
          <tr>
            <th style="width:36px;padding:8px 12px"><input type="checkbox" style="width:13px;height:13px;accent-color:var(--purple)"></th>
            <th style="width:96px">Date ${sortIco}</th>
            <th>Transaction ${sortIco}</th>
            <th class="r" style="width:110px">Amount ($) ${sortIco}</th>
            <th style="width:36px;text-align:center">📎</th>
            <th style="width:80px">Tax ${sortIco}</th>
            <th>Match ${sortIco}</th>
            <th style="width:28px"></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${scopeList.length&&S.revScope==='transactions'?`
    <div style="display:flex;justify-content:flex-end;margin-top:12px;gap:8px">
      <button class="btn-aok" onclick="bulkAcceptAll()">✓ Accept all AI suggestions</button>
    </div>`:''}
  </div>`;
}

function buildReviewTable(pending, ctxItems){
  const all=[...ctxItems,...pending];
  if(!all.length) return `<div style="padding:48px;text-align:center;color:var(--muted)"><div style="font-size:32px;margin-bottom:8px">✓</div><div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">All caught up</div><div>No transactions need review right now.</div></div>`;
  const sel=S.reviewSel;
  const allChk=all.length>0&&all.every(t=>sel.has(t.id));
  const bulkBar=sel.size>0?`
    <div class="bulk-bar">
      <span>${sel.size} selected</span>
      <div class="bulk-sp"></div>
      <button class="btn-bulk-ok" onclick="bulkAcceptAll()">✓ Accept all AI suggestions</button>
    </div>`:'';

  function aiTd(tx, field){
    const f=tx.ai[field];
    if(!f||!f.val) return `<td class="aitd aitd-empty"><span class="aitd-none">No suggestion</span></td>`;
    if(f.st==='rejected') return `<td class="aitd aitd-rejected"><div class="aitd-rej-wrap"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>${f.rejectedVal||f.val}</div><button class="btn-aitd-ed" style="margin-top:3px" onclick="event.stopPropagation();undoRejectAC(${tx.id},'${field}')">Undo</button></td>`;
    if(f.st==='accepted') return `<td class="aitd aitd-accepted"><div class="aitd-acc-wrap"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>${f.val}</div></td>`;
    const dot=f.conf>=85?'#22c55e':f.conf>=65?'#f59e0b':'#ef4444';
    const why=getWhy(tx,field);
    return `<td class="aitd">
      <div class="aitd-inner">
        <span class="aitd-dot" style="background:${dot}"></span>
        <span class="aitd-val" title="${f.val}">${f.val}</span>
        <span class="why-wrap">
          <span class="aitd-pct">${f.conf}%</span>
          ${why?`<div class="why-tip" style="width:210px"><div class="why-tip-head">Why this suggestion?</div>${why}</div>`:''}
        </span>
      </div>
      <div class="aitd-btns">
        <button class="btn-aitd-ok" onclick="event.stopPropagation();acceptAC(${tx.id},'${field}')">✓ Accept</button>

function buildReviewCard(tx, isCtx){

  return `

function buildActionCard(tx, field, label, icon){
  const f=tx.ai[field];
  const isEditing=S.editingCard&&S.editingCard.txId===tx.id&&S.editingCard.field===field;
  const isAcc=f.st==='accepted';
  const conf=f.conf||0;
  const barW=Math.max(conf,5);

  // rejected state
  if(f.st==='rejected'){
    return `
    <div class="ac ac-rej">
      <div class="ac-label">${icon} ${label} <span class="ac-ai">AI</span></div>
      <div class="ac-rej-label">✕ Rejected: ${f.rejectedVal||f.val}</div>
      <div class="ac-foot">
        <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">+ Add manually</button>
        <button class="btn-aundo" onclick="undoRejectAC(${tx.id},'${field}')">Undo</button>
      </div>
    </div>`;
  }

  if(isAcc){
    return `
    <div class="ac ac-acc">
      <div class="ac-label">${icon} ${label}</div>
      <div class="ac-acc-label">✓ ${f.val||'Added'}</div>
      <button class="btn-aundo" onclick="undoAC(${tx.id},'${field}')">Undo</button>
    </div>`;
  }

  if(!f.val&&!isEditing){
    return `
    <div class="ac ac-none">
      <div class="ac-label">${icon} ${label}</div>
      <div class="ac-val none">${field==='file'?'No receipt yet':'Not found'}</div>
      <div class="ac-foot">
        <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">+ ${field==='file'?'Upload':'Add'}</button>
      </div>
    </div>`;
  }

  if(isEditing){
    return `
    <div class="ac ac-editing">
      <div class="ac-label">${icon} ${label}</div>
      <input id="ace-${tx.id}-${field}" class="ac-input" value="${f.val||''}" placeholder="${label}..."/>
      <div style="display:flex;gap:4px">
        <button class="btn-asave" onclick="saveAC(${tx.id},'${field}')">Save</button>
        <button class="btn-acancel" onclick="cancelAC()">Cancel</button>
      </div>
    </div>`;
  }

  const why=getWhy(tx,field);
  return `
  <div class="ac">
    <div class="ac-label">${icon} ${label} <span class="ac-ai">AI</span></div>
    <div class="ac-val">${f.val}</div>
    ${conf>0?`<div class="ac-conf">
      <div class="conf-bar"><div class="conf-fill ${confCls(conf)}" style="width:${barW}%"></div></div>
      <span class="why-wrap">
        <span class="conf-pct">${conf}%</span>
        ${why?`<div class="why-tip"><div class="why-tip-head">Why this suggestion?</div>${why}</div>`:''}
      </span>
    </div>`:''}
    <div class="ac-foot">
      <button class="btn-aok" onclick="acceptAC(${tx.id},'${field}')">✓ Accept</button>
      <button class="btn-aedit" onclick="editAC(${tx.id},'${field}')">✏ Edit</button>
      <button class="btn-arej" onclick="rejectAC(${tx.id},'${field}')">✕</button>
    </div>
  </div>`;
}

/* ── SPLIT LINE HANDLERS ──────────────────────── */
function initSplitLines(txId){
  if(S.splitLines[txId]) return; // already initialised
  const tx=ftx(txId);
  const aiSplit=AI_SPLITS[txId];
  if(aiSplit){
    // Start with single line from AI cat; show banner to offer AI split
    S.aiSplitPending[txId]=true;
    S.splitLines[txId]=[{id:1, desc:tx.desc, cat:tx.ai.cat.val||'', tax:tx.ai.tax.val||'GST', amount:tx.amount}];
  } else {
    S.splitLines[txId]=[{id:1, desc:tx.desc, cat:tx.ai.cat.val||'', tax:tx.ai.tax.val||'GST', amount:tx.amount}];
  }
}

function acceptAiSplit(txId){
  const aiSplit=AI_SPLITS[txId]; if(!aiSplit) return;
  S.splitLines[txId]=aiSplit.lines.map(l=>({...l}));
  S.aiSplitPending[txId]=false;
  render();
}

function dismissAiSplit(txId){
  S.aiSplitPending[txId]=false;
  render();
}

function addSplitLine(txId){
  const lines=S.splitLines[txId]||[];
  const newId=Math.max(0,...lines.map(l=>l.id))+1;
  lines.push({id:newId, desc:'', cat:'', tax:'GST', amount:0});
  render();
}

function removeSplitLine(txId, lineId){
  S.splitLines[txId]=S.splitLines[txId].filter(l=>l.id!==lineId);
  render();
}

function updateSplitLine(txId, lineId, field, val){
  const lines=S.splitLines[txId]; if(!lines) return;
  const line=lines.find(l=>l.id===lineId); if(!line) return;
  line[field]=field==='amount'?parseFloat(val)||0:val;
  // Update remaining counter without full re-render
  updateRemaining(txId);
}

function updateRemaining(txId){
  const tx=ftx(txId); if(!tx) return;
  const lines=S.splitLines[txId]||[];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  const rem=(total-used).toFixed(2);
  const remOk=Math.abs(parseFloat(rem))<0.01;
  const el=document.getElementById(`split-rem-${txId}`);
  if(el){
    el.textContent=remOk?'✓ Fully allocated':('$'+Math.abs(parseFloat(rem)).toFixed(2)+(parseFloat(rem)<0?' over':''));
    el.className='split-rem '+(remOk?'ok':parseFloat(rem)<0?'over':'');
  }
}

function commitLedger(txId){
  const tx=ftx(txId);
  const lines=S.splitLines[txId]||[];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  if(Math.abs(total-used)>0.01){ showToast('Allocate remaining amount before committing.',3000); return; }
  tx.status='coded';
  Object.values(tx.ai).forEach(f=>{if(f.val&&f.st==='idle')f.st='accepted';});
  addToContext(txId,'cat');
  showContextToast();
  closeAside();
  render();
  const n=lines.length;
  showToast(`✓ ${tx.desc} — ${n} line${n>1?'s':''} committed to general ledger`, 4000);
}

/* ── MULTI-SELECT MATCH HANDLERS ─────────────────── */
function toggleMatchSel(txId, ref, name){
  if(!S.matchSel[txId]) S.matchSel[txId]={};
  if(S.matchSel[txId][ref]) delete S.matchSel[txId][ref];
  else S.matchSel[txId][ref]=name;
  renderAside();
}

function buildMatchFooter(tx){
  const sel=S.matchSel[tx.id]||{};
  const refs=Object.keys(sel);
  const count=refs.length;
  if(tx.status==='accepted'||tx.source==='both'||tx.source==='myob') return '';

  // Compute combined amount
  const allRecs=[...(MATCHES[tx.id]||[]),...ALL_RECORDS];
  const selTotal=refs.reduce((s,ref)=>{
    const r=allRecs.find(x=>x.ref===ref); return s+(r?Math.abs(r.amount):0);
  },0);
  const txAbs=Math.abs(tx.amount);
  const totalMatch=Math.abs(selTotal-txAbs)<0.01;
  const names=Object.values(sel);

  return `
  <div class="match-footer">
    ${count>0?`
    <div style="flex:1;min-width:0">
      <div class="mf-top">
        <span class="mf-count">${count} record${count!==1?'s':''} selected</span>
        ${count>1?`<span style="font-size:11px;padding:2px 8px;border-radius:var(--r99);background:${totalMatch?'var(--green-bg)':'var(--amber-bg)'};color:${totalMatch?'var(--green)':'var(--amber)'};font-weight:600">
          ${totalMatch?'✓ Totals match':'≠ Totals differ'}
        </span>`:''}
        <button class="btn-confirm-match" onclick="confirmMatch(${tx.id})">Confirm match →</button>
      </div>
      <div class="mf-names">${names.slice(0,2).join(' · ')}${names.length>2?` +${names.length-2} more`:''}</div>
    </div>
    `:`
    <span style="color:var(--muted);font-size:12px">Select records to match, then confirm below</span>
    <button class="btn-confirm-match" disabled style="background:#ccc;cursor:not-allowed">Confirm match →</button>
    `}
  </div>`;
}

function confirmMatch(txId){
  const tx=ftx(txId); if(!tx) return;
  const sel=S.matchSel[txId]||{};
  const refs=Object.keys(sel);
  if(!refs.length){ showToast('Select at least one record to match.',2500); return; }
  const names=Object.values(sel);
  tx.source='both';
  tx.status='accepted';
  tx.ai.match.val=names.join(', ');
  tx.ai.match.st='accepted';
  addToContext(txId,'match');
  delete S.matchSel[txId];
  closeAside();
  render();
  showToast(`✓ Matched to ${refs.length} record${refs.length>1?'s':''}: ${names.slice(0,2).join(', ')}${names.length>2?` +${names.length-2} more`:''} — <a href="#" onclick="event.preventDefault();viewContext()" style="color:var(--lavender);text-decoration:underline">Context saved →</a>`, 4500);
}

function buildAsideContent(){
  const tx=ftx(S.asideId);if(!tx)return '';
  const amtCls=tx.amount<0?'amt-neg':'amt-pos';
  // Tab labels — see naming rationale below
  // Match: "Is this already in MYOB?" — link to existing record
  // Code:  "What was this for?" — categorise + split lines
  // Record: "Create a formal document" — invoice, bill, spend money
  const tabs=[{id:'matches',label:'Match'},{id:'categorise',label:'Code'},{id:'create',label:'Record'}];
  return `
  <div class="aside-head">
    <button class="aside-close" onclick="closeAside()">✕</button>
    <div>${srcBadge(tx.source)}</div>
    <div class="aside-amt ${amtCls}">${fmt(tx.amount)}</div>

    <div class="aside-meta">${tx.date} · ${tx.ref} · ${BANKS.find(b=>b.id===tx.bank)?.label}</div>
  </div>
  <div class="at-tabs">

function buildAsideMatches(tx){
  if(tx.source==='myob') return `
    <div style="background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r8);padding:12px">
      <div style="font-size:12px;font-weight:600;color:var(--amber);margin-bottom:4px">⏳ Awaiting bank confirmation</div>
      <div style="font-size:12px;color:#92400e;line-height:1.5">This ${tx.amount>0?'invoice':'bill'} is in MYOB. It will auto-match when your bank processes it.</div>
    </div>`;
  if(tx.status==='accepted'||tx.source==='both'){
    const matchNames=(tx.ai.match.val||'').split(', ').filter(Boolean);
    return `
    <div style="background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--r8);padding:12px;margin-bottom:10px">
      <div style="font-size:11px;font-weight:600;color:var(--green);margin-bottom:6px">✓ Matched to ${matchNames.length} MYOB record${matchNames.length!==1?'s':''}</div>
      ${matchNames.map(n=>`<div style="font-weight:600;font-size:13px;margin-bottom:2px">${n}</div>`).join('')}
    </div>
    <button onclick="undoAllAI(${tx.id});delete S.matchSel[${tx.id}];closeAside();render()" style="width:100%;padding:7px;background:#fff;color:var(--red);border:1px solid #fca5a5;border-radius:var(--r4);font-size:12px;cursor:pointer;font-family:var(--font)">Unmatch & undo</button>`;
  }

  if(!S.matchSel[tx.id]) S.matchSel[tx.id]={};
  const sel=S.matchSel[tx.id];
  const selCount=Object.keys(sel).length;

  const aiMatches=MATCHES[tx.id]||[];
  const q=S.asideSearch.toLowerCase();
  const aiRefs=new Set(aiMatches.map(m=>m.ref));
  const allFiltered=ALL_RECORDS.filter(r=>{
    if(aiRefs.has(r.ref)) return false;
    if(!q) return true;
    return r.ref.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)||r.type.toLowerCase().includes(q);
  });
  const aiFiltered=q?aiMatches.filter(m=>m.ref.toLowerCase().includes(q)||m.name.toLowerCase().includes(q)):aiMatches;

  // Check if AI pre-selected multiple records (multi-match scenario)
  const presel=AI_PRESEL[tx.id]||[];
  const isMultiSuggest=presel.length>1;
  const aiSelCount=aiFiltered.filter(m=>sel[m.ref]).length;
  const allAiPreselSelected=presel.length>0&&presel.every(ref=>sel[ref]);

  // Compute combined amount of all selected records
  const allRecs=[...aiMatches,...ALL_RECORDS];
  const selTotal=Object.keys(sel).reduce((s,ref)=>{
    const r=allRecs.find(x=>x.ref===ref); return s+(r?Math.abs(r.amount):0);
  },0);
  const txAbs=Math.abs(tx.amount);
  const totalMatch=Math.abs(selTotal-txAbs)<0.01;

  return `
  <div class="aside-search-wrap">
    <span class="aside-search-ico"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="4.5"/><line x1="9.5" y1="9.5" x2="13" y2="13"/></svg></span>
    <input class="aside-search" placeholder="Search MYOB records…" value="${S.asideSearch}"
      oninput="S.asideSearch=this.value;updateMatchSearch()">
  </div>

  ${aiFiltered.length?`
  <div class="aside-section" style="margin-top:0;display:flex;align-items:center;gap:6px">
    <span class="ac-ai" style="font-size:10px">AI</span>
    Suggested
    ${isMultiSuggest&&!q?`<span style="font-size:10px;color:var(--muted);font-weight:400">— AI suggests both cover this payment</span>`:''}
  </div>
  ${isMultiSuggest&&!q?`
  <div style="background:var(--mauve);border:1px solid var(--lavender);border-radius:var(--r8);padding:9px 12px;margin-bottom:10px;font-size:11px;line-height:1.5">
    <span style="font-weight:600;color:var(--purple)">✦ Combined match detected</span><br>
    These ${aiFiltered.length} invoices together total <strong>${fmtAbs(aiFiltered.reduce((s,m)=>s+Math.abs(m.amount),0))}</strong>,
    matching your ${tx.amount>0?'deposit':'payment'} of <strong>${fmtAbs(tx.amount)}</strong>.
    Both are pre-selected below.
  </div>`:''}
  ${aiFiltered.map(m=>{
    const isSel=!!sel[m.ref];
    return `
    <div class="mi${isSel?' mi-sel':''}" onclick="toggleMatchSel(${tx.id},'${m.ref}','${m.name.replace(/'/g,"\\'")}')">
      <div class="rec-chk ${isSel?'on':''}">${isSel?'✓':''}</div>
      <div class="mi-body">
        ${!q&&presel[0]===m.ref?`<div style="font-size:10px;font-weight:600;color:var(--purple);margin-bottom:3px">★ Best match</div>`:''}
        <div class="mi-head">
          <div class="mi-name">${m.ref} · ${m.name}</div>
          <span class="why-wrap"><span class="mi-conf ${confPct(m.conf)}">${m.conf}%</span>
            <div class="why-tip" style="width:200px"><div class="why-tip-head">Why this match?</div>${getWhy(tx,'match')}</div>
          </span>
        </div>
        <div class="mi-sub">${m.type} · ${m.date} · ${fmtAbs(m.amount)}</div>
      </div>
    </div>`;}).join('')}
  `:''}

  <div class="aside-section" style="margin-top:${aiFiltered.length?'12':'0'}px">
    ${q?`Results for "${S.asideSearch}"`:'All MYOB records'}
    <span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:4px">(${allFiltered.length})</span>
  </div>
  ${allFiltered.length?allFiltered.map(r=>{
    const isSel=!!sel[r.ref];
    return `
    <div class="ri ${isSel?'ri-sel':''}" onclick="toggleMatchSel(${tx.id},'${r.ref}','${r.name.replace(/'/g,"\\'")}')">
      <div class="rec-chk ${isSel?'on':''}" style="margin-top:0">${isSel?'✓':''}</div>
      <div class="ri-icon">${r.icon}</div>
      <div class="ri-body">
        <div class="ri-ref">${r.ref} · ${r.name}</div>
        <div class="ri-sub">${r.type} · ${r.date} · <span style="font-weight:500">${fmt(r.amount)}</span></div>
      </div>
      <span class="ri-amt">${fmt(r.amount)}</span>
    </div>`;}).join('')
  :`<div style="color:var(--muted);font-size:12px;padding:12px 0;text-align:center">No records found for "${S.asideSearch}"</div>`}
  <div style="height:8px"></div>`;
}

function buildAsideCategorise(tx){
  initSplitLines(tx.id);
  const lines=S.splitLines[tx.id];
  const total=Math.abs(tx.amount);
  const used=lines.reduce((s,l)=>s+Math.abs(parseFloat(l.amount)||0),0);
  const rem=(total-used).toFixed(2);
  const remOk=Math.abs(parseFloat(rem))<0.01;
  const aiSplit=AI_SPLITS[tx.id];
  const showAiBanner=aiSplit&&S.aiSplitPending[tx.id];
  const CATS=['Materials','Electrical supplies','Power & gas','Office supplies','Cloud hosting','Sales income','Staff meals','Parking & tolls','Safety & workwear','Design software','General expenses'];
  const TAXES=['GST','N-T','CAP','FRE'];

  return `
  ${showAiBanner?`
  <div class="ai-split-banner">
    <div class="ai-split-banner-head">✦ AI detected multiple items in this receipt</div>
    <div class="ai-split-banner-body">We've split this transaction into ${aiSplit.lines.length} lines based on the receipt. Review and adjust before committing.</div>
    <div class="ai-split-btns">
      <button class="btn-asp-acc" onclick="acceptAiSplit(${tx.id})">Use AI split</button>
      <button class="btn-asp-dis" onclick="dismissAiSplit(${tx.id})">Code as single line</button>
    </div>
  </div>`:''}

  <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">
    Line items <span style="font-weight:400;font-size:10px">(total: ${fmt(tx.amount)})</span>
  </div>

  ${lines.map((line,i)=>`
  <div class="split-row" id="srow-${tx.id}-${line.id}">
    <div class="split-row-num">
      Line ${i+1}
      ${lines.length>1?`<button class="split-del" title="Remove line" onclick="removeSplitLine(${tx.id},${line.id})">✕</button>`:''}
    </div>
    <input class="split-inp full" placeholder="Description" value="${line.desc}"
      oninput="updateSplitLine(${tx.id},${line.id},'desc',this.value)">
    <select class="split-inp" onchange="updateSplitLine(${tx.id},${line.id},'cat',this.value)">
      <option value="">– Category –</option>
      ${CATS.map(c=>`<option${line.cat===c?' selected':''}>${c}</option>`).join('')}
    </select>
    <select class="split-inp" onchange="updateSplitLine(${tx.id},${line.id},'tax',this.value)">
      ${TAXES.map(t=>`<option${line.tax===t?' selected':''}>${t}</option>`).join('')}
    </select>
    <input class="split-inp" type="number" step="0.01" placeholder="0.00" value="${Math.abs(line.amount)||''}"
      oninput="updateSplitLine(${tx.id},${line.id},'amount',this.value);updateRemaining(${tx.id})">
  </div>`).join('')}

  <button class="btn-add-line" onclick="addSplitLine(${tx.id})">+ Add line</button>

  <div class="split-total-bar">
    <span style="color:var(--muted)">Remaining to allocate</span>
    <span class="split-rem ${remOk?'ok':parseFloat(rem)<0?'over':''}" id="split-rem-${tx.id}">
      ${remOk?'✓ Fully allocated':('$'+Math.abs(parseFloat(rem)).toFixed(2)+(parseFloat(rem)<0?' over':''))}
    </span>
  </div>

  <div class="frm-row" style="margin-top:10px"><label class="frm-label">Job code (all lines)</label>
    <select class="frm-sel"><option>– Select job –</option><option>ECO-0231</option><option>ECO-0234</option><option>APEX-2025</option><option>FANS-2025</option></select>
  </div>
  <div class="frm-row"><label class="frm-label">Note</label>
    <input class="frm-inp" type="text" placeholder="Add a note…"/>
  </div>
  <button class="btn-commit" onclick="commitLedger(${tx.id})" ${!remOk?'style="background:#999;cursor:not-allowed"':''}>
    ${remOk?'✓ Commit to general ledger':'Commit to general ledger (allocate remaining first)'}
  </button>`;
}

function buildAsideCreate(tx){
  const isDebit=tx.amount<0;
  const opts=isDebit
    ?[{i:'💸',l:'Spend money',s:'Card or cash payment'},{i:'📋',l:'Bill',s:'Supplier bill'},{i:'↔️',l:'Transfer',s:'Between accounts'},{i:'📄',l:'Other',s:'Journal entry'}]
    :[{i:'🧾',l:'Invoice',s:'Customer payment'},{i:'💰',l:'Receive money',s:'Incoming payment'},{i:'↔️',l:'Transfer',s:'Between accounts'},{i:'📄',l:'Other',s:'Journal entry'}];
  return `
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5">No MYOB record found. Create one to categorise this ${isDebit?'payment':'receipt'}.</div>
  <div class="create-grid">
    ${opts.map(o=>`<button class="create-btn" onclick="alert('Opening ${o.l}...')"><span class="create-icon">${o.i}</span><span class="create-label">${o.l}</span><span class="create-sub">${o.s}</span></button>`).join('')}
  </div>
  <div class="divider"></div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Or categorise without creating a record:</div>
  ${buildAsideCategorise(tx)}`;
}

/* ── Unmatch ── */
function unmatch(txId){
  const tx=ftx(txId); if(!tx) return;
  tx.status='pending';
  // Reset accepted AI fields back to idle so they reappear as suggestions
  ['cat','match','tax'].forEach(f=>{
    if(tx.ai[f]&&tx.ai[f].st==='accepted') tx.ai[f].st='idle';
  });
  showToast('↩ Unmatched — transaction returned to review');
  render();
}

function openAttachModal(txId, attIdx){
  S.attachModal={txId,attIdx:attIdx||0};
  render();
}
function closeAttachModal(){
  S.attachModal=null;
  render();
}
function confirmAttachment(txId){
  const tx=ftx(txId); if(!tx) return;
  tx.ai.cat.st='accepted';
  showToast('✓ Receipt accepted — match confirmed');
  closeAttachModal();
}
function reassignFromAttachment(txId, newCat){
  const tx=ftx(txId); if(!tx) return;
  tx.ai.cat.val=newCat;
  tx.ai.cat.st='accepted';
  tx.status='coded';
  showToast(`✓ Recoded to "${newCat}" based on receipt`);
  closeAttachModal();
}
function rejectAttachment(txId){
  showToast('Receipt rejected — transaction unchanged');
  closeAttachModal();
}

function startEditSection(id){S.bizCtxEditing=id;render();}
function cancelEditSection(){S.bizCtxEditing=null;render();}
function saveSection(id){
  const sec=S.bizCtx.sections.find(s=>s.id===id); if(!sec) return;
  const ta=document.getElementById(`biz-ta-${id}`);
  if(ta&&ta.value.trim()) sec.text=ta.value.trim();
  S.bizCtx.lastUpdated='just now';
  S.bizCtxEditing=null;
  render();
  showToast('✓ Context updated');
}
function submitBizCtxUpdate(){
  const inp=document.getElementById('biz-nl-inp');
  if(!inp||!inp.value.trim()) return;
  const raw=inp.value.trim();
  inp.value='';

  // Route to appropriate section by keyword
  const lower=raw.toLowerCase();
  let targetId='overview';
  if(/never|don.t|exclude|ignore|skip|won.t/i.test(raw)) targetId='exclusions';
  else if(/tax|gst|n-t|bas|fre|free|exempt/i.test(raw)) targetId='tax';
  else if(/match|invoice|bill|record|supplier|payee|code|category/i.test(raw)) targetId='suppliers';
  else if(/prefer|priorit|manual|auto|suggest/i.test(raw)) targetId='matching';

  // Show thinking state then apply
  const thinking=document.getElementById('biz-thinking');
  if(thinking) thinking.style.display='flex';
  setTimeout(()=>{
    const sec=S.bizCtx.sections.find(s=>s.id===targetId);
    if(sec){
      // Append the instruction as a new sentence
      const instruction=raw.endsWith('.')||raw.endsWith('!')?raw:raw+'.';
      sec.text=sec.text+' '+instruction;
      S.bizCtx.lastUpdated='just now';
    }
    S.bizCtxEditing=null;
    render();
    showToast('✓ Business context updated');
  }, 1200);
  render(); // re-render to show thinking state
}

    <div class="am-block">
      <div class="am-master-row">
        <div class="am-master-left">
          <div class="am-master-title">Auto-process attachments</div>
          <div class="am-master-desc">When enabled, MYOB will analyse attached receipts and invoices to extract data and pre-fill transaction details.</div>
        </div>
        <div class="am-master-right">
          <span class="am-tog-label ${at.auto?'on':''}">${at.auto?'On':'Off'}</span>
          <label class="tog-lg">
            <input type="checkbox" ${at.auto?'checked':''} onchange="S.atToggles.auto=this.checked;render()">
            <span class="tog-s"></span>
          </label>
        </div>
      </div>
      <hr class="am-divider">
      <div class="am-sub-section ${at.auto?'':'am-detail-dim'}">
        ${subToggles.map(t=>`
        <div class="am-sub-row">
          <div class="am-sub-left">
            <div class="am-sub-title">${t.label}</div>
            <div class="am-sub-desc">${t.desc}</div>
          </div>
          <label class="tog">
            <input type="checkbox" ${at[t.key]?'checked':''}
              onchange="S.atToggles['${t.key}']=this.checked;render()">
            <span class="tog-s"></span>
          </label>
        </div>`).join('')}
      </div>
    </div>
    <div class="am-block">
      <div style="padding:14px 20px 10px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">Supported file types</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.5">PDF, PNG, JPG, HEIC — uploaded directly or via email forwarding.</div>
      </div>
      <hr class="am-divider">
      <div style="padding:14px 20px 16px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">Confidence threshold</div>
        <div style="display:flex;align-items:center;gap:12px">
          <input type="range" min="60" max="99" value="${S.atConfidence||80}"
            oninput="S.atConfidence=+this.value;document.getElementById('at-conf-val').textContent=this.value+'%'"
            style="flex:1;accent-color:var(--purple)">
          <span id="at-conf-val" style="font-size:13px;font-weight:700;color:var(--purple);min-width:36px">${S.atConfidence||80}%</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px">Suggestions below this confidence are hidden and flagged for review.</div>
      </div>
    </div>
    <div class="stg-footer">
      <button class="btn-save-stg" onclick="showToast('✓ Attachment settings saved')">Save settings</button>
    </div>
  </div>`;
}

/* ─── Tax codes sub-page ───────────────────────────────── */
function buildStgTaxCodes(){

  const tc=S.tcToggles;
  const codes=[
    {key:'gst',        label:'GST (10%)',       desc:'Standard goods and services tax on taxable purchases and sales.', badge:'GST'},
    {key:'basExcluded',label:'BAS excluded',    desc:'Wages, drawings and private expenses excluded from BAS lodgement.', badge:'N-T'},
    {key:'capGains',   label:'Capital gains',   desc:'Asset sales, investments and depreciable items.', badge:'CAP'},
  ];
  return `
  <div class="stg fade-in">
    <div class="stg-sub-back" onclick="goStgBack()">← Automatching</div>
    <div class="stg-title">Tax codes</div>
    <div class="am-block">
      <div class="am-master-row">
        <div class="am-master-left">
          <div class="am-master-title">Auto-assign tax codes</div>
          <div class="am-master-desc">MYOB will suggest and auto-assign tax codes to transactions based on supplier history, category rules, and transaction patterns.</div>
        </div>
        <div class="am-master-right">
          <span class="am-tog-label ${tc.auto?'on':''}">${tc.auto?'On':'Off'}</span>
          <label class="tog-lg">
            <input type="checkbox" ${tc.auto?'checked':''} onchange="S.tcToggles.auto=this.checked;render()">
            <span class="tog-s"></span>
          </label>
        </div>
      </div>
      <hr class="am-divider">
      <div class="am-sub-section ${tc.auto?'':'am-detail-dim'}">
        <div class="am-sub-row">
          <div class="am-sub-left">
            <div class="am-sub-title">Suggest only — don't auto-apply</div>
            <div class="am-sub-desc">Show tax code suggestions for review rather than applying them automatically.</div>
          </div>
          <label class="tog">
            <input type="checkbox" ${tc.suggest?'checked':''}
              onchange="S.tcToggles.suggest=this.checked;render()">
            <span class="tog-s"></span>
          </label>
        </div>
      </div>
    </div>
    <div class="am-block" style="${tc.auto?'':'opacity:.4;pointer-events:none'}">
      <div style="padding:14px 20px 6px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px">Auto-assign by tax type</div>
        <div style="font-size:12px;color:var(--muted)">Choose which tax codes MYOB is allowed to auto-assign.</div>
      </div>
      ${codes.map(c=>`
      <div class="am-sub-row" style="align-items:center">
        <div style="display:flex;align-items:center;gap:10px;flex:1">
          <span style="font-size:10px;font-weight:700;background:var(--stone20);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-family:monospace;flex-shrink:0">${c.badge}</span>
          <div class="am-sub-left">
            <div class="am-sub-title">${c.label}</div>
            <div class="am-sub-desc">${c.desc}</div>
          </div>
        </div>
        <label class="tog">
          <input type="checkbox" ${tc[c.key]?'checked':''}
            onchange="S.tcToggles['${c.key}']=this.checked;render()">
          <span class="tog-s"></span>
        </label>
      </div>`).join('')}
    </div>
    <div class="am-block" style="padding:14px 20px;${tc.auto?'':'opacity:.4;pointer-events:none'}">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px">Saved tax code rules</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Rules that automatically assign specific tax codes to matching transactions.</div>
      ${[
        {name:'AGL Energy → GST (10%)', trigger:'Payee contains "AGL"', code:'GST', applied:14},
        {name:'Payroll → BAS excluded', trigger:'Description contains "payroll" or "wage"', code:'N-T', applied:31},
        {name:'Woolworths → GST (10%)', trigger:'Payee contains "Woolworths"', code:'GST', applied:8},
      ].map(r=>`
      <div class="rule-card" style="margin-bottom:8px">
        <div class="rule-head">
          <div style="flex:1">
            <span style="font-size:10px;font-weight:700;background:var(--stone20);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-family:monospace;margin-right:6px">${r.code}</span>
            <span class="rule-name">${r.name}</span>
          </div>
        </div>
        <div class="rule-meta">
          <div>When: <span>${r.trigger}</span></div>
        </div>
        <div class="rule-foot">
          <span class="rule-applied">Applied ${r.applied}× </span>
          <span class="rule-sp"></span>
          <button class="btn-re">Edit</button>

        </div>

      <button class="btn-add-rule" style="margin-top:4px">+ Create rule</button>

    <div class="stg-footer">
      <button class="btn-save-stg" onclick="showToast('✓ Tax code settings saved')">Save settings</button>

}

/* ─── Rule wizard ──────────────────────────────────────── */
function buildRuleWizard(){
  const w=S.ruleWiz;
  const steps=['Rule type','Conditions','Action','Review'];

  const stepBar=steps.map((s,i)=>{
    const n=i+1;
    const st=n<w.step?'done':n===w.step?'active':'idle';
    return `${i>0?`<div class="rwiz-connector ${n<=w.step?'done':''}"></div>`:''}
    <div class="rwiz-step">
      <div class="rwiz-num ${st}">${st==='done'?'✓':n}</div>
      <span class="rwiz-label ${st}">${s}</span>
    </div>`;
  }).join('');

  /* ── Step 1: type ── */
  let body='';
  if(w.step===1){
    const types=[
      {t:'category',icon:'⚡',title:'Category',   desc:'Assign a category and tax code when a transaction matches.'},
      {t:'invoice', icon:'📄',title:'Invoice',    desc:'Match the transaction to open customer invoices.'},
      {t:'bill',    icon:'🧾',title:'Bill',       desc:'Match the transaction to unpaid supplier bills.'},
    ];
    body=`
    <div style="font-size:15px;font-weight:700;margin-bottom:5px">What should this rule do?</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:22px">Choose how MYOB should handle matching transactions.</div>
    <div class="rtype-grid">
      ${types.map(t=>`
      <div class="rtype-card ${w.type===t.t?'sel':''}" onclick="wizSetType('${t.t}')">
        <div class="rtype-icon">${t.icon}</div>
        <div class="rtype-title">${t.title}</div>
        <div class="rtype-desc">${t.desc}</div>
      </div>`).join('')}
    </div>`;
  }

  /* ── Step 2: conditions ── */
  if(w.step===2){
    const fieldOpts=[
      {v:'payee',  l:'Payee name'},
      {v:'desc',   l:'Description'},
      {v:'amount', l:'Amount'},
      {v:'account',l:'Bank account'},
    ];
    const opOpts=f=>f==='amount'
      ?[{v:'eq',l:'equals'},{v:'gt',l:'is greater than'},{v:'lt',l:'is less than'}]
      :[{v:'contains',l:'contains'},{v:'is',l:'is exactly'},{v:'starts',l:'starts with'}];
    body=`
    <div style="font-size:15px;font-weight:700;margin-bottom:5px">When a transaction...</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">All conditions must match for the rule to apply.</div>
    ${w.conditions.map((c,i)=>`
      ${i>0?`<div class="cond-and-row"><span class="cond-and">AND</span><div style="flex:1;height:1px;background:var(--border)"></div></div>`:''}
      <div class="cond-row">
        <select class="cond-sel" onchange="wizUpdateCond(${c.id},'field',this.value)">
          ${fieldOpts.map(f=>`<option value="${f.v}"${c.field===f.v?' selected':''}>${f.l}</option>`).join('')}
        </select>
        <select class="cond-sel" onchange="wizUpdateCond(${c.id},'op',this.value)">
          ${opOpts(c.field).map(o=>`<option value="${o.v}"${c.op===o.v?' selected':''}>${o.l}</option>`).join('')}
        </select>
        <input class="cond-inp" type="${c.field==='amount'?'number':'text'}"
          placeholder="${c.field==='amount'?'0.00':'Enter value…'}"
          value="${c.val}"
          onchange="wizUpdateCondVal(${c.id},this.value)">
        ${w.conditions.length>1?`<button class="cond-del" onclick="wizRemoveCond(${c.id})" title="Remove">×</button>`:'<div style="width:20px"></div>'}
      </div>`).join('')}
    <button class="btn-add-cond" onclick="wizAddCond()">+ Add condition</button>`;
  }

  /* ── Step 3: action ── */
  if(w.step===3){
    const cats=['Advertising','Bank charges','Computer expenses','Consulting fees','Entertainment','Freight & delivery','Insurance','Interest expense','Legal fees','Materials','Motor vehicle','Office supplies','Power & gas','Printing & stationery','Rent & occupancy','Repairs & maintenance','Safety & workwear','Staff meals','Subscriptions','Telephone & internet','Travel','Wages & salaries'];
    const taxCodes=[
      {v:'GST',l:'GST (10%) — Standard'},
      {v:'N-T',l:'N-T — BAS excluded'},
      {v:'FRE',l:'FRE — GST-free'},
      {v:'CAP',l:'CAP — Capital acquisition'},
      {v:'INP',l:'INP — Input-taxed'},
    ];
    if(w.type==='category'){
      body=`
      <div style="font-size:15px;font-weight:700;margin-bottom:5px">Then assign...</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:22px">Choose the category and tax code to apply.</div>
      <div class="act-field">
        <label class="act-label">Category</label>
        <select class="act-sel" onchange="wizUpdateActionRender('cat',this.value)">
          <option value="">Select a category…</option>
          ${cats.map(c=>`<option value="${c}"${w.action.cat===c?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="act-field">
        <label class="act-label">Tax code</label>
        <select class="act-sel" onchange="wizUpdateActionRender('tax',this.value)">
          ${taxCodes.map(t=>`<option value="${t.v}"${w.action.tax===t.v?' selected':''}>${t.l}</option>`).join('')}
        </select>
      </div>`;
    } else {
      const entityType=w.type==='invoice'?'Customer':'Supplier';
      const entityHint=w.type==='invoice'?'invoices':'bills';
      body=`
      <div style="font-size:15px;font-weight:700;margin-bottom:5px">Then match to...</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:22px">Specify which ${entityType.toLowerCase()}'s ${entityHint} to match against.</div>
      <div class="act-field">
        <label class="act-label">${entityType}</label>
        <input class="act-inp" type="text" placeholder="Enter ${entityType.toLowerCase()} name…"
          value="${w.action.entity}"
          onchange="wizUpdateAction('entity',this.value)">
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:-8px;line-height:1.5">
        Leave blank to match against any ${entityType.toLowerCase()}'s ${entityHint}.
      </div>`;
    }
  }

  /* ── Step 4: review ── */
  if(w.step===4){
    const condDesc=w.conditions.filter(c=>c.val).map(c=>{
      const fl={payee:'Payee',desc:'Description',amount:'Amount',account:'Bank account'}[c.field]||c.field;
      const ol={contains:'contains',is:'is exactly',starts:'starts with',eq:'=',gt:'>',lt:'<'}[c.op]||c.op;
      return `${fl} ${ol} "${c.val}"`;
    }).join(' AND ')||'(any transaction)';
    let actionDesc='';
    if(w.type==='category') actionDesc=`Assign "${w.action.cat||'?'}"${w.action.tax?' · '+w.action.tax:''}`;
    else if(w.type==='invoice') actionDesc=`Match to invoices${w.action.entity?' from '+w.action.entity:''}`;
    else actionDesc=`Match to bills${w.action.entity?' from '+w.action.entity:''}`;
    const typeL={category:'Category',invoice:'Invoice',bill:'Bill'}[w.type];
    const typeCl={category:'rb-cat',invoice:'rb-inv',bill:'rb-bill'}[w.type];
    body=`
    <div style="font-size:15px;font-weight:700;margin-bottom:5px">Review & save</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Confirm the rule details and give it a name.</div>
    <label style="font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em">Rule name</label>
    <input id="rwiz-name-inp" class="rwiz-name-input" type="text" value="${w.name||''}"
      placeholder="Name this rule…"
      oninput="S.ruleWiz.name=this.value;S.ruleWiz.nameAuto=false">
    <div class="rwiz-summary">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
        <span class="rb ${typeCl}">${typeL}</span>
        <span style="font-size:14px;font-weight:700;color:var(--text)">${w.name||'Untitled rule'}</span>
      </div>
      <div class="rwiz-sum-row">
        <span class="rwiz-sum-label">When</span>
        <span class="rwiz-sum-val">${condDesc}</span>
      </div>
      <div class="rwiz-sum-row">
        <span class="rwiz-sum-label">Then</span>
        <span class="rwiz-sum-val">${actionDesc}</span>
      </div>
    </div>`;
  }

  /* ── Footer ── */
  const canNext=w.step===2
    ? w.conditions.some(c=>c.val.trim())
    : w.step===3
      ? (w.type==='category' ? !!w.action.cat : true)
      : true;

  const footer=`
  <div class="rwiz-footer">
    ${w.step===1
      ? `<button class="btn-wiz-cancel" onclick="wizBack()">Cancel</button><div></div>`
      : `<button class="btn-wiz-back" onclick="wizBack()">← Back</button>`}
    ${w.step===4
      ? `<button class="btn-wiz-save" onclick="saveRule()">Save rule</button>`
      : w.step===1
        ? '' // auto-advances on card click
        : `<button class="btn-wiz-next" ${canNext?'':'disabled'} onclick="wizNext()">Next →</button>`}
  </div>`;

  return `
  <div class="stg fade-in">
    <div class="rwiz">
      <div class="stg-sub-back" onclick="wizBack()">${w.step===1?'← Automatching':''}</div>
      <div class="stg-title" style="margin-bottom:22px">Create rule</div>
      <div class="rwiz-steps">${stepBar}</div>
      ${body}
      ${footer}
    </div>
  </div>`;
}

initAttachments();
render();
</script>
</body>
</html>
